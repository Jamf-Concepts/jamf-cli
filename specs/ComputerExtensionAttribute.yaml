components:
  schemas:
    CeaTemplatesResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/ComputerExtensionAttributeTemplates'
          minItems: 0
          type: array
        totalCount:
          example: 1
          type: integer
      required:
        - totalCount
      type: object
    ComputerExtensionAttributeSearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/ComputerExtensionAttributes'
          minItems: 0
          type: array
        totalCount:
          example: 1
          type: integer
      required:
        - totalCount
      type: object
    ComputerExtensionAttributeTemplates:
      properties:
        templateCategoryName:
          description: Template category name of the extension attribute.
          example: AntiVirus
          type: string
        templateId:
          description: Unique Id for Computer Extension Attribute Template.
          example: "1"
          readOnly: true
          type: string
        templateName:
          description: Template display name of the extension attribute.
          example: ClamXav - Virus Definition Date
          type: string
      required:
        - templateCategoryName
        - templateName
      type: object
    ComputerExtensionAttributes:
      allOf:
        - $ref: _MonolithLibrary.yaml#/components/schemas/ExtensionAttributes
        - properties:
            enabled:
              default: true
              description: Enabled by default, but for inputType Script we can disable it as well. <br/> Possible values are:<br/> false <br/> true
              example: true
              type: boolean
            inputType:
              default: TEXT
              description: Extension attributes collect inventory data by using an input type.The type of the Input used to populate the extension attribute.
              enum:
                - SCRIPT
                - TEXT
                - POPUP
                - DIRECTORY_SERVICE_ATTRIBUTE_MAPPING
              type: string
            inventoryDisplayType:
              default: GENERAL
              description: Category in which to display the extension attribute in Jamf Pro.
              enum:
                - GENERAL
                - HARDWARE
                - OPERATING_SYSTEM
                - USER_AND_LOCATION
                - PURCHASING
                - EXTENSION_ATTRIBUTES
              example: GENERAL
              type: string
            ldapAttributeMapping:
              description: Directory Service attribute use to populate the extension attribute. <br/> Required when inputType is "DIRECTORY_SERVICE_ATTRIBUTE_MAPPING"
              example: ldapAttributeMapping
              type: string
            ldapExtensionAttributeAllowed:
              default: false
              description: Collect multiple values for this extension attribute. ldapExtensionAttributeAllowed is disabled by default, only for inputType 'DIRECTORY_SERVICE_ATTRIBUTE_MAPPING' it can be enabled. It's value cannot be modified during edit operation.<br/> Possible values are:<br/> false <br/> true <br/>
              example: false
              type: boolean
            manageExistingData:
              description: It is used to specify to either delete or retain the extension attributes values when inputType is Script and enabled is false.
              enum:
                - RETAIN
                - DELETE
              example: RETAIN
              type: string
            popupMenuChoices:
              description: When added with list of choices while creating computer extension attributes these Pop-up menu can be displayed in inventory information. User can choose a value from the pop-up menu list when enrolling a computer any time using Jamf Pro. Provide popupMenuChoices only when inputType is 'POPUP'.
              example:
                - Test
                - Popup
              items:
                description: Popup Menu choices.
                type: string
              minItems: 0
              type: array
            scriptContents:
              description: When we run this script it returns a data value each time a computer submits inventory to Jamf Pro. Provide scriptContents only when inputType is 'SCRIPT'.
              example: scriptContent
              nullable: true
              type: string
          required:
            - inputType
            - inventoryDisplayType
          type: object
info:
  title: Jamf Pro API - ComputerExtensionAttribute
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/computer-extension-attributes:
    get:
      description: Retrieves All Computer Extension Attributes Configuration.
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Sorts results by one or more criteria, following the format property:asc/desc.<br/> Default sort is name:asc.<br/> If using multiple criteria, separate with commas. Allows sort for id and name.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - name.asc
            items:
              type: string
            type: array
          style: form
        - description: 'Filters results. Use RSQL format for query. Allows for many fields, including ID, name, etc.<br/> Can be combined with paging and sorting.<br/> Fields allowed in the query: id, name <br/> Default filter is an empty query and returns all results from the requested page.'
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerExtensionAttributeSearchResults'
          description: Computer Extension Attribute objects has been fetched successfully.
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Computer Extension Attribute objects could not be found. The server either did not find a current representation for the requested resource or is trying to hide its existence from an unauthorized client.
      summary: Retrieve Computer Extension Attributes.
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Read Computer Extension Attributes
    post:
      description: Create Computer Extension Attribute to collect extra inventory information.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerExtensionAttributes'
        description: Computer Extension Attribute to be created.
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Computer Extension Attribute was successfully created.
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request. The server could not understand the request because of invalid syntax. Possible reasons are:</br> 1) Required fields are not provided in request body.</br> 2) Fields which are not associated with provided inputType has some value.</br> 3) Any values outside of the allowed range are included in the request body.</br> 4) LDAP is not configured.</br> 5) Error occured during database create operation.</br> 6) Duplicate_Field
      summary: Create Computer Extension Attribute.
      tags:
        - computer-extension-attributes
      x-action: true
      x-required-privileges:
        - Create Computer Extension Attributes
  /v1/computer-extension-attributes/delete-multiple:
    post:
      description: IDs of the Computer Extension Attribute to be deleted.
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/Ids
        description: IDs of the Computer Extension Attribute to be deleted
        required: true
      responses:
        204:
          description: All specified Computer Extension Attribute deleted successfully.
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request. Returns error codes and IDs for any Computer Extension Attribute that were unable to be deleted. Possible reasons are:</br> 1) The specified extension attribute id does not include a valid number.</br> 2) The specified extension attribute id does not exist in Jamf Pro.
      summary: Delete multiple Computer Extension Attribute at once.
      tags:
        - computer-extension-attributes
      x-action: true
      x-required-privileges:
        - Delete Computer Extension Attributes
  /v1/computer-extension-attributes/templates:
    get:
      description: Retrieves All Computer Extension Attributes Templates.
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Sorts results by one or more criteria, following the format property:asc/desc.<br/> Default sort is templateName:asc.<br/> If using multiple criteria, separate with commas. Allows sort for templateName and templateCategory.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - templateName.asc
            items:
              type: string
            type: array
          style: form
        - description: 'Filters results. Use RSQL format for queries. which allows filtering by multiple fields such as templateName, templateCategoryName.<br/> Can be combined with paging and sorting.<br/> Fields allowed in the query: templateName, templateCategoryName <br/> Default filter is an empty query and returns all results from the requested page.'
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeaTemplatesResults'
          description: Computer Extension Attribute templates objects has been fetched successfully.
      summary: Retrieve All Computer Extension Attributes Templates.
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Read Computer Extension Attributes
  /v1/computer-extension-attributes/templates/{id}:
    get:
      description: Gets specified Computer Extension Attribute Template object.
      parameters:
        - description: Unique Id of the Template.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerExtensionAttributes'
          description: Computer Extension Attribute Template object has been fetched successfully.
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified Computer Extension Attribute Template object could not be found. The server either did not find a current representation for the requested resource or is trying to hide its existence from an unauthorized client.
      summary: Get specified Computer Extension Attribute Template object.
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Read Computer Extension Attributes
  /v1/computer-extension-attributes/upload:
    post:
      description: Uploads a Computer Extension Attribute.
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: The file to upload
                  format: binary
                  type: string
              required:
                - file
              type: object
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerExtensionAttributes'
          description: Computer Extension Attribute object has been fetched successfully.
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request. Possible reasons are:</br> 1) Unsupported file extension. Acceptable format is xml.</br> 2) Uploaded file should not be empty.
      summary: Upload Computer Extension Attribute.
      tags:
        - computer-extension-attributes
      x-action: true
      x-required-privileges:
        - Create Computer Extension Attributes
        - Read Computer Extension Attributes
  /v1/computer-extension-attributes/{id}:
    delete:
      description: ID of the Computer Extension Attribute to be deleted.
      parameters:
        - description: Unique ID of Computer Extension Attribute.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: Computer Extension Attribute deleted successfully.
        400:
          description: Bad Request. The server could not understand the request because of invalid syntax. Possible reason can be 'The specified extension attribute id does not include a valid number.'
        404:
          description: Specified Computer Extension Attribute object could not be found. The server either did not find a current representation for the requested resource or is trying to hide its existence from an unauthorized client.
      summary: Remove specified Computer Extension Attribute.
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Delete Computer Extension Attributes
    get:
      description: Gets specified Computer Extension Attribute object.
      parameters:
        - description: Unique ID of Computer Extension Attribute.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerExtensionAttributes'
          description: Computer Extension Attribute object has been fetched successfully.
        400:
          description: Bad Request. The server could not understand the request because of invalid syntax. Possible reason can be 'The specified extension attribute id does not include a valid number.'
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified Computer Extension Attribute object could not be found. The server either did not find a current representation for the requested resource or is trying to hide its existence from an unauthorized client.
      summary: Get specified Computer Extension Attribute object.
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Read Computer Extension Attributes
    put:
      description: Update specified Computer Extension Attribute object.
      parameters:
        - description: Unique ID of Computer Extension Attribute.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerExtensionAttributes'
        description: Computer Extension Attribute object to be updated. IDs defined in this body will be ignored.
        required: true
      responses:
        202:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerExtensionAttributes'
          description: Computer Extension Attribute updated successfully.
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request. Specified Computer Extension Attribute could not be updated due to bad request. Possible reasons are:</br> 1) The specified extension attribute id does not include a valid number.</br> 2) Duplicate_Field.</br> 3) Required fields are not provided in request body.</br> 4) Fields which are not associated with provided inputType has some value.</br> 5) Any values outside of the allowed range are included in the request body.</br> 6) LDAP is not configured.</br> 7) Error occured during database update operation.
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified Computer Extension Attribute object does not exist. The server either did not find a current representation for the requested resource or is trying to hide its existence from an unauthorized client.
      summary: Update specified Computer Extension Attribute object.
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Update Computer Extension Attributes
  /v1/computer-extension-attributes/{id}/data-dependency:
    get:
      description: Get smart group/advance search dependent objects for a specified computer extension attribute
      parameters:
        - description: Unique ID of computer extension attribute.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/DependencyObjectResults
          description: Fetches list of dependent objects for a specified computer extension attribute.
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request. The server could not understand the request because of invalid syntax.
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified computer extension attribute id were not found in database.
      summary: Get smart group/advance search dependent objects for a specified computer extension attribute
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Read Computer Extension Attributes
  /v1/computer-extension-attributes/{id}/download:
    get:
      description: Retrieves the specified Computer Extension Attribute in XML format based on the provided unique ID.
      parameters:
        - description: The unique ID of the Computer Extension Attribute to be downloaded.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/xml:
              schema:
                example: <?xml version="1.0" encoding="UTF-8"?><extensionAttribute><displayName>Testing</displayName></extensionAttribute>
                type: string
          description: The requested Computer Extension Attribute XML file was fetched successfully.
        400:
          description: Bad Request. The server could not understand the request because of invalid syntax. Possible reason can be 'The specified extension attribute id does not include a valid number.'
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified Computer Extension Attribute object could not be found. The server either did not find a current representation for the requested resource or is trying to hide its existence from an unauthorized client.
      summary: Download the specified Computer Extension Attribute.
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Read Computer Extension Attributes
  /v1/computer-extension-attributes/{id}/history:
    get:
      description: Get specified Computer Extension Attribute history object
      parameters:
        - description: Instance ID of Computer Extension Attribute history
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Sorts results by one or more criteria, following the format property:asc/desc. Default sort is ID:asc. If using multiple criteria, separate with commas.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - id:asc
            items:
              type: string
            type: array
          style: form
        - description: Filters results. Use RSQL format for query. Allows for many fields, including ID, name, etc. Can be combined with paging and sorting. Default filter is an empty query and returns all results from the requested page.
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HistorySearchResults
          description: Details of Computer Extension Attribute history were found.
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request. Specified Computer Extension Attribute history object could not be found. Possible reason can be 'Provided id field is not string of positive numeric value or -1'.
      summary: Get specified Computer Extension Attribute History object
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Read Computer Extension Attributes
    post:
      description: Add specified Computer Extension Attribute history object notes
      parameters:
        - description: Instance ID of Computer Extension Attribute history
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistoryNote
        description: History note to be created
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistory
          description: Computer Extension Attribute history note created successfully.
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request. Error creating history note. Possible reason can be 'Provided id field is not string of positive numeric value or -1'.
      summary: Add specified Computer Extension Attribute history object notes
      tags:
        - computer-extension-attributes
      x-required-privileges:
        - Update Computer Extension Attributes
servers:
  - url: /api
