      description: |
        Retrieve the Account Driven User Enrollment Session Token Settings
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDrivenUserEnrollmentSessionTokenSettings'
          description: Successful response
      summary: |
        Retrieve the Account Driven User Enrollment Session Token Settings
      tags:
        - enrollment
      x-required-privileges:
        - Read User-Initiated Enrollment
    put:
      description: |
        Update the Account Driven User Enrollment Session Token Settings object.
      requestBody:
