openapi: 3.0.1
info:
    title: Jamf Pro API - Device Information Command Definition
    description: This MDM commands exist to be re-used by multiple other Swagger files.
    version: 0.0.1
paths: {}
components:
  schemas:
    DeviceInformationCommand:
      allOf:
        - $ref: 'MdmDefinitionsLibrary.yaml#/components/schemas/MdmCommandBase'
        - type: object
          properties:
            queries:
              type: array
              items:
                type: string
                description: List of queries specifying the information to collect from a device
                externalDocs:
                    description: For a full list of possible queries see Apple's documentation
                    url: https://developer.apple.com/documentation/devicemanagement/deviceinformationcommand/command/queries
              example:
                - DeviceName
                - BatteryLevel
                - IsSupervised
              required: true
              minItems: 1
