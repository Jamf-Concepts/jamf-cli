        400:
          description: Bind connection pool statistics data is not available.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ApiError'
        404:
          description: Cloud Identity Provider bind connection pool statistics does not
            exist.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-privileges:
        - Read LDAP Servers
  /v2/cloud-ldaps/{id}/connection/status:
    get:
      tags:
        - cloud-ldap
      summary: |
        Tests the communication with the specified cloud connection
      description: |
        Tests the communication with the specified cloud connection
      parameters:
        - name: id
          in: path
          required: true
          description: Cloud Identity Provider identifier
          schema:
            type: string
      responses:
        200:
          description: Successfully connected to the specified cloud connection
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/CloudLdapConnectionStatus'
        400:
          description: One or more parameters were invalid.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ApiError'
        404:
          description: Cloud Identity Provider does not exist.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-privileges:
        - Read LDAP Servers
components: {}
