# Classic API (/JSSResource/) resource manifest.
# Only resources with NO modern API equivalent are included here.
# The generator reads this file and produces CLI commands with the classic- prefix.
#
# Defaults (omit to use):
#   operations: [list, get, create, update, delete]
#   lookups:    [id, name]

resources:
  # ── Computers & Policies ──────────────────────────────────────────
  - name: policies
    path: policies
    description: Deployment policies
    singular: policy
    scope: true

  - name: osxconfigurationprofiles
    path: osxconfigurationprofiles
    description: macOS configuration profiles
    cli_name: classic-macos-config-profiles
    singular: os_x_configuration_profile
    scope: true

  - name: computercommands
    path: computercommands
    description: Computer management commands
    cli_name: classic-computer-commands
    singular: computer_command
    operations: [list, get, create]

  - name: computerextensionattributes
    path: computerextensionattributes
    description: Computer extension attributes
    cli_name: classic-computer-ext-attrs
    singular: computer_extension_attribute

  - name: computerconfigurations
    path: computerconfigurations
    description: Computer configurations
    cli_name: classic-computer-configs
    singular: computer_configuration

  - name: computerapplications
    path: computerapplications
    description: Computer applications inventory
    cli_name: classic-computer-apps
    singular: computer_application
    operations: [list, get]
    lookups: [id]

  - name: computerapplicationusage
    path: computerapplicationusage
    description: Computer application usage data
    cli_name: classic-computer-app-usage
    singular: computer_application_usage
    operations: [get]
    lookups: [id]

  - name: computerhistory
    path: computerhistory
    description: Computer history records
    cli_name: classic-computer-history
    singular: computer_history
    operations: [get]
    lookups: [id]

  - name: computerinvitations
    path: computerinvitations
    description: Computer enrollment invitations
    cli_name: classic-computer-invitations
    singular: computer_invitation
    operations: [list, get, create, delete]
    lookups: [id]

  - name: advancedcomputersearches
    path: advancedcomputersearches
    description: Advanced computer searches
    cli_name: classic-advanced-computer-searches
    singular: advanced_computer_search

  # ── Mobile Devices ────────────────────────────────────────────────
  - name: mobiledevicecommands
    path: mobiledevicecommands
    description: Mobile device management commands
    cli_name: classic-mobile-commands
    singular: mobile_device_command
    operations: [list, get, create]

  - name: mobiledeviceconfigurationprofiles
    path: mobiledeviceconfigurationprofiles
    description: Mobile device configuration profiles
    cli_name: classic-mobile-config-profiles
    singular: mobile_device_configuration_profile
    scope: true

  - name: mobiledeviceprovisioningprofiles
    path: mobiledeviceprovisioningprofiles
    description: Mobile device provisioning profiles
    cli_name: classic-mobile-provisioning-profiles
    singular: mobile_device_provisioning_profile

  - name: mobiledevicehistory
    path: mobiledevicehistory
    description: Mobile device history records
    cli_name: classic-mobile-history
    singular: mobile_device_history
    operations: [get]
    lookups: [id]

  - name: mobiledeviceinvitations
    path: mobiledeviceinvitations
    description: Mobile device enrollment invitations
    cli_name: classic-mobile-invitations
    singular: mobile_device_invitation
    operations: [list, get, create, delete]
    lookups: [id]

  # ── Configuration & Content ───────────────────────────────────────
  - name: packages
    path: packages
    description: Software packages
    singular: package

  - name: printers
    path: printers
    description: Printer configurations
    singular: printer

  - name: networksegments
    path: networksegments
    description: Network segments
    cli_name: classic-network-segments
    singular: network_segment

  - name: dockitems
    path: dockitems
    description: Dock items
    cli_name: classic-dock-items
    singular: dock_item

  - name: directorybindings
    path: directorybindings
    description: Directory bindings
    cli_name: classic-directory-bindings
