# Classic API (/JSSResource/) resource manifest.
# Only resources with NO modern API equivalent are included here.
# The generator reads this file and produces CLI commands with the classic- prefix.
#
# Defaults (omit to use):
#   operations: [list, get, create, update, delete]
#   lookups:    [id, name]
#   id_path:    id
#
# id_path overrides the URL segment between the base path and the ID value.
# Use when the API deviates from the standard /JSSResource/{path}/id/{id} pattern.
# Example: id_path: groupid → /JSSResource/accounts/groupid/{id}
#
# Specifying operations: [] (explicit empty list) generates no standard CRUD commands,
# only get-by-{lookup} commands for any non-id entries in lookups.
#
# Resources requiring non-standard URL structures beyond what id_path covers
# (e.g. required date ranges in path, deeply hierarchical paths, command-dispatch APIs)
# must be implemented as handwritten commands in internal/commands/pro_*.go.

resources:
  # ── Computers & Policies ──────────────────────────────────────────
  - name: policies
    path: policies
    description: Deployment policies
    singular: policy
    scope: true

  - name: osxconfigurationprofiles
    path: osxconfigurationprofiles
    description: macOS configuration profiles
    cli_name: classic-macos-config-profiles
    singular: os_x_configuration_profile
    scope: true

  - name: computercommands
    path: computercommands
    description: Computer management commands
    cli_name: classic-computer-commands
    singular: computer_command
    # No standard /id/{id} endpoint; create requires /command/{command} path (handwritten).
    # Lookups only — list all, or fetch by name/uuid/status.
    operations: [list]
    lookups: [name, uuid, status]

  - name: computerextensionattributes
    path: computerextensionattributes
    description: Computer extension attributes
    cli_name: classic-computer-ext-attrs
    singular: computer_extension_attribute

  - name: computerconfigurations
    path: computerconfigurations
    description: Computer configurations
    cli_name: classic-computer-configs
    singular: computer_configuration

  - name: computerapplications
    path: computerapplications
    description: Computer applications inventory
    cli_name: classic-computer-apps
    singular: computer_application
    # No /list or /id/{id} endpoints; lookup is by application name only.
    operations: []
    lookups: [application]

  # computerapplicationusage: all endpoints require a date range in the URL
  # (/computerapplicationusage/id/{id}/{start_date}_{end_date}) which the generator
  # cannot express. Implement as a handwritten command if needed.

  - name: computerhistory
    path: computerhistory
    description: Computer history records
    cli_name: classic-computer-history
    singular: computer_history
    operations: [get]
    lookups: [id, name, serialnumber, macaddress, udid]

  - name: computerinvitations
    path: computerinvitations
    description: Computer enrollment invitations
    cli_name: classic-computer-invitations
    singular: computer_invitation
    operations: [list, get, create, delete]
    lookups: [id, name, invitation]

  - name: advancedcomputersearches
    path: advancedcomputersearches
    description: Advanced computer searches
    cli_name: classic-advanced-computer-searches
    singular: advanced_computer_search

  # ── Mobile Devices ────────────────────────────────────────────────
  - name: mobiledevices
    path: mobiledevices
    description: Mobile device inventory records
    cli_name: classic-mobile-devices
    singular: mobile_device
    lookups: [id, name, serialnumber, macaddress, udid]
    groups_path: mobiledevicegroups

  - name: mobiledevicecommands
    path: mobiledevicecommands
    description: Mobile device management commands
    cli_name: classic-mobile-commands
    singular: mobile_device_command
    # No standard /id/{id} endpoint; create requires /command/{command} path (handwritten).
    # Lookups only — list all, or fetch by name/uuid/command type.
    operations: [list]
    lookups: [name, uuid, command]

  - name: mobiledeviceconfigurationprofiles
    path: mobiledeviceconfigurationprofiles
    description: Mobile device configuration profiles
    cli_name: classic-mobile-config-profiles
    # Classic API returns <configuration_profile>, not <mobile_device_configuration_profile>.
    singular: configuration_profile
    scope: true

  - name: mobiledeviceprovisioningprofiles
    path: mobiledeviceprovisioningprofiles
    description: Mobile device provisioning profiles
    cli_name: classic-mobile-provisioning-profiles
    singular: mobile_device_provisioning_profile

  - name: mobiledevicehistory
    path: mobiledevicehistory
    description: Mobile device history records
    cli_name: classic-mobile-history
    singular: mobile_device_history
    operations: [get]
    lookups: [id, name, serialnumber, macaddress, udid]

  - name: mobiledeviceinvitations
    path: mobiledeviceinvitations
    description: Mobile device enrollment invitations
    cli_name: classic-mobile-invitations
    singular: mobile_device_invitation
    operations: [list, get, create, delete]
    lookups: [id, invitation]

  # ── Configuration & Content ───────────────────────────────────────
  - name: packages
    path: packages
    description: Software packages
    singular: package

  - name: printers
    path: printers
    description: Printer configurations
    singular: printer

  - name: networksegments
    path: networksegments
    description: Network segments
    cli_name: classic-network-segments
    singular: network_segment

  - name: dockitems
    path: dockitems
    description: Dock items
    cli_name: classic-dock-items
    singular: dock_item

  - name: directorybindings
    path: directorybindings
    description: Directory bindings
    cli_name: classic-directory-bindings
    singular: directory_binding

  - name: diskencryptionconfigurations
    path: diskencryptionconfigurations
    description: Disk encryption configurations
    cli_name: classic-disk-encryption-configs
    singular: disk_encryption_configuration

  - name: restrictedsoftware
    path: restrictedsoftware
    description: Restricted software entries
    cli_name: classic-restricted-software
    singular: restricted_software
    scope: true

  - name: allowedfileextensions
    path: allowedfileextensions
    description: Allowed file extensions
    cli_name: classic-allowed-file-extensions
    singular: allowed_file_extension
    operations: [list, get, create, delete]
    lookups: [id, extension]

  - name: macapplications
    path: macapplications
    description: Mac App Store applications
    cli_name: classic-mac-apps
    singular: mac_application
    scope: true

  - name: mobiledeviceapplications
    path: mobiledeviceapplications
    description: Mobile device applications
    cli_name: classic-mobile-apps
    singular: mobile_device_application
    scope: true

  - name: ebooks
    path: ebooks
    description: eBook distributions
    cli_name: classic-ebooks
    singular: ebook
    scope: true

  - name: ibeacons
    path: ibeacons
    description: iBeacon configurations
    cli_name: classic-ibeacons
    singular: ibeacon

  - name: classes
    path: classes
    description: Class configurations for Apple Classroom
    singular: class

  - name: removablemacaddresses
    path: removablemacaddresses
    description: Removable MAC addresses for storage control
    cli_name: classic-removable-mac-addresses
    singular: removable_mac_address

  # ── Administration ────────────────────────────────────────────────
  - name: accounts
    path: accounts
    description: All Jamf Pro user accounts and groups (combined list)
    singular: account
    # /accounts returns users + groups together; split resources below handle CRUD.
    operations: [list]

  - name: account-groups
    path: accounts
    cli_name: classic-account-groups
    description: Jamf Pro account groups
    singular: account_group
    # Groups use /accounts/groupid/{id} and /accounts/groupname/{name}.
    # /accounts returns users+groups combined; list_subset extracts just groups.
    operations: [list, get, create, update, delete]
    id_path: groupid
    lookups: [id, groupname]
    list_subset: groups

  - name: account-users
    path: accounts
    cli_name: classic-account-users
    description: Jamf Pro account users
    singular: account_user
    # Users use /accounts/userid/{id} and /accounts/username/{name}.
    # /accounts returns users+groups combined; list_subset extracts just users.
    operations: [list, get, create, update, delete]
    id_path: userid
    lookups: [id, username]
    list_subset: users

  - name: webhooks
    path: webhooks
    description: Webhook configurations
    singular: webhook

  - name: smtpserver
    path: smtpserver
    description: SMTP server configuration
    cli_name: classic-smtp-server
    singular: smtp_server
    operations: [get, update]
    lookups: [id]

  - name: distributionpoints
    path: distributionpoints
    description: File distribution points
    cli_name: classic-distribution-points
    singular: distribution_point

  - name: softwareupdateservers
    path: softwareupdateservers
    description: Software update servers
    cli_name: classic-software-update-servers
    singular: software_update_server

  - name: licensedsoftware
    path: licensedsoftware
    description: Licensed software records
    cli_name: classic-licensed-software
    singular: licensed_software

  - name: usergroups
    path: usergroups
    description: JSS user groups (referenced in policy/ebook scope limitations)
    cli_name: classic-user-groups
    singular: user_group

  - name: userextensionattributes
    path: userextensionattributes
    description: User extension attributes
    cli_name: classic-user-ext-attrs
    singular: user_extension_attribute

  - name: vppaccounts
    path: vppaccounts
    description: Volume Purchase Program accounts
    cli_name: classic-vpp-accounts
    singular: vpp_account
    lookups: [id]

  - name: vppassignments
    path: vppassignments
    description: VPP license assignments
    cli_name: classic-vpp-assignments
    singular: vpp_assignment
    lookups: [id]
    scope: true
    no_subset_put: true

  - name: vppinvitations
    path: vppinvitations
    description: VPP invitations
    cli_name: classic-vpp-invitations
    singular: vpp_invitation
    operations: [list, get, create, delete]
    lookups: [id]

  - name: gsxconnection
    path: gsxconnection
    description: Apple GSX connection settings
    cli_name: classic-gsx-connection
    singular: gsx_connection
    operations: [get, update]
    lookups: [id]

  - name: jsonwebtokenconfigurations
    path: jsonwebtokenconfigurations
    description: JSON Web Token configurations
    cli_name: classic-jwt-configs
    singular: json_web_token_configuration
    lookups: [id]

  # ── Patch Management ──────────────────────────────────────────────
  - name: patchsoftwaretitles
    path: patchsoftwaretitles
    description: Patch management software titles
    cli_name: classic-patch-titles
    singular: patch_software_title

  - name: patchpolicies
    path: patchpolicies
    description: Patch policies
    cli_name: classic-patch-policies
    singular: patch_policy
    lookups: [id]

  - name: patchexternalsources
    path: patchexternalsources
    description: Patch management external sources
    cli_name: classic-patch-external-sources
    singular: patch_external_source

  - name: patchinternalsources
    path: patchinternalsources
    description: Patch management internal sources
    cli_name: classic-patch-internal-sources
    singular: patch_internal_source
    operations: [list, get]

  - name: patchavailabletitles
    path: patchavailabletitles
    description: Available patch titles from sources
    cli_name: classic-patch-available-titles
    singular: patch_available_title
    # No /list endpoint and no /id/{id}; only /sourceid/{id}.
    operations: [get]
    id_path: sourceid
    lookups: [id]

  - name: patchreports
    path: patchreports
    description: Patch management reports
    cli_name: classic-patch-reports
    singular: patch_report
    # Only /patchsoftwaretitleid/{id}; no list or write endpoints.
    operations: [get]
    id_path: patchsoftwaretitleid
    lookups: [id]
