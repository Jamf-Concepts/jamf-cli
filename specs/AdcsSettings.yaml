components:
  schemas:
    AdcsCertificate:
      properties:
        data:
          description: Must be base-64 encoded data obtainable by `openssl base64 < /file/path/filename.pfx | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods.
          example: 
          items:
            format: byte
            type: string
          type: array
        filename:
          description: Server certificate filename should extend .cer or .pem, and client certificate filename should extend .p12 or .pfx.
          example: example.cer
          maxLength: 255
          minLength: 1
          type: string
        password:
          example: password-example
          format: password
          maxLength: 255
          minLength: 1
          nullable: true
          type: string
          writeOnly: true
      required:
        - data
        - filename
      type: object
    AdcsCertificateResponse:
      properties:
        expirationDate:
          example: "2018-10-15T16:39:56Z"
          format: date-time
          readOnly: true
          type: string
        filename:
          description: Server certificate filename should extend .cer or .pem, and client certificate filename should extend .p12 or .pfx.
          example: example.cer
          maxLength: 255
          readOnly: true
          type: string
        issuer:
          example: IssuerName
          readOnly: true
          type: string
        serialNumber:
          example: "123456789456123"
          readOnly: true
          type: string
        subject:
          example: CN=SubjectName, OU=OrganizationalUnit, O=Organization, L=Location, ST=State, C=Country
          readOnly: true
          type: string
      type: object
    AdcsDependencies:
      properties:
        results:
          items:
            $ref: '#/components/schemas/AdcsDependency'
          type: array
        totalCount:
          example: 1
          nullable: false
          type: integer
      type: object
    AdcsDependency:
      properties:
        configProfileId:
          example: 1
          nullable: false
          type: integer
        configProfileName:
          example: name
          type: string
        configProfileType:
          enum:
            - OSX_CONFIGURATION_PROFILE
            - IOS_CONFIGURATION_PROFILE
          example: OSX_CONFIGURATION_PROFILE
          nullable: false
          readOnly: true
          type: string
      type: object
    AdcsSettings:
      description: AD CS Settings object to create, or update with a merge-patch strategy. Certificate data must be provided in full, or not at all for update with merge-patch strategy.
      properties:
        adcsUrl:
          example: https://<host-name>.example.com
          maxLength: 255
          minLength: 1
          type: string
        apiClientId:
          example: A11B43D6-9ED4-4B29-B726-E2DE747D2410
          type: string
        caName:
          example: EXAMPLE-SUBCA02-CA
          maxLength: 255
          minLength: 1
          type: string
        clientCert:
          $ref: '#/components/schemas/AdcsCertificate'
        displayName:
          example: Example Display Name
          maxLength: 255
          minLength: 1
          type: string
        fqdn:
          example: example-subca02.example.com
          maxLength: 255
          minLength: 1
          type: string
        outbound:
          example: true
          type: boolean
        revocationEnabled:
          example: true
          type: boolean
        serverCert:
          $ref: '#/components/schemas/AdcsCertificate'
      type: object
    AdcsSettingsResponse:
      properties:
        adcsUrl:
          example: https://<host-name>.example.com
          maxLength: 255
          minLength: 1
          readOnly: true
          type: string
        apiClientId:
          example: A11B43D6-9ED4-4B29-B726-E2DE747D2410
          readOnly: true
          type: string
        caName:
          example: EXAMPLE-SUBCA02-CA
          maxLength: 255
          minLength: 1
          readOnly: true
          type: string
        clientCert:
          $ref: '#/components/schemas/AdcsCertificateResponse'
        connectorLastCheckInTimestamp:
          example: "2018-10-15T16:39:56Z"
          format: date-time
          readOnly: true
          type: string
        displayName:
          example: Example Display Name
          maxLength: 255
          minLength: 1
          readOnly: true
          type: string
        fqdn:
          example: example-subca02.example.com
          maxLength: 255
          minLength: 1
          readOnly: true
          type: string
        id:
          example: "1"
          readOnly: true
          type: string
        outbound:
          example: true
          readOnly: true
          type: boolean
        revocationEnabled:
          example: true
          readOnly: true
          type: boolean
        serverCert:
          $ref: '#/components/schemas/AdcsCertificateResponse'
      type: object
info:
  title: Jamf Pro API - AdcsSettings
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/pki/adcs-settings:
    post:
      description: Create AD CS Settings configuration and initialize renewal monitor. Once set, the configuration cannot change between inbound and outbound modes.
      requestBody:
        content:
          application/json:
            examples:
              sample1:
                value:
                  adcsUrl: null
                  apiClientId: A11B43D6-9ED4-4B29-B726-E2DE747D2410
                  caName: EXAMPLE-SUBCA02-CA
                  clientCert: null
                  displayName: Example Display Name - 1
                  fqdn: example-subca02.example.com
                  outbound: true
                  revocationEnabled: true
                  serverCert: null
              sample2:
                value:
                  adcsUrl: https://<host-name>.example.com
                  apiClientId: null
                  caName: EXAMPLE-SUBCA02-CA
                  clientCert:
                    data: 
                    filename: client-cert.pfx
                    password: password-example
                  fqdn: example-subca02.example.com
                  outbound: false
                  revocationEnabled: true
                  serverCert:
                    data: 
                    filename: adcs-proxy-ca.cer
                    password: ""
              sample3:
                value:
                  adcsUrl: https://<host-name>.example.com
                  apiClientId: null
                  caName: EXAMPLE-SUBCA02-CA
                  clientCert:
                    data: 
                    filename: client-cert.p12
                    password: password-example
                  displayName: Example Display Name - 2
                  fqdn: example-subca02.example.com
                  outbound: false
                  revocationEnabled: true
                  serverCert:
                    data: 
                    filename: adcs-proxy-ca.pem
                    password: ""
            schema:
              $ref: '#/components/schemas/AdcsSettings'
        required: true
      responses:
        201:
          content:
            '*/*':
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Created
      summary: |
        Create AD CS Settings configuration for either inbound or outbound mode
      tags:
        - adcs-settings
      x-required-privileges:
        - Create AD CS Settings
  /v1/pki/adcs-settings/validate-certificate:
    post:
      description: Validate AD CS Settings server certificate for file format. Must be base64-encoded X.509 file content, obtainable by `openssl base64 < /file/path/filename.pfx | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods.
      requestBody:
        content:
          application/json:
            examples:
              sample1:
                value:
                  data: 
                  filename: adcs-proxy-ca.cer
                  password: ""
              sample2:
                value:
                  data: 
                  filename: adcs-proxy-ca.pem
                  password: ""
            schema:
              $ref: '#/components/schemas/AdcsCertificate'
      responses:
        204:
          description: AD CS Settings certificate for the Jamf Pro server is of valid file format.
      summary: |
        Validate AD CS Settings server certificate
      tags:
        - adcs-settings
      x-action: true
      x-required-privileges:
        - Update AD CS Settings
        - Create AD CS Settings
  /v1/pki/adcs-settings/validate-client-certificate:
    post:
      description: Validate AD CS Settings client certificate for file format and correct password. Must be base64-encoded PKCS#12 file content, obtainable by `openssl base64 < /file/path/filename.pfx | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods. This should only contain a single X.509 certificate.
      requestBody:
        content:
          application/json:
            examples:
              sample1:
                value:
                  data: 
                  filename: client-cert.pfx
                  password: password-example
              sample2:
                value:
                  data: 
                  filename: client-cert.p12
                  password: password-example
            schema:
              $ref: '#/components/schemas/AdcsCertificate'
      responses:
        204:
          description: AD CS Settings certificate for client server is of valid file format and has correct password.
      summary: |
        Validate AD CS Settings client certificate
      tags:
        - adcs-settings
      x-action: true
      x-required-privileges:
        - Update AD CS Settings
        - Create AD CS Settings
  /v1/pki/adcs-settings/{id}:
    delete:
      description: Delete AD CS Settings configuration, only if reassignment of Certificate Authority succeeds and no config profiles are using the configuration.
      parameters:
        - description: ID of the AD CS Settings configuration.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: No Content
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Not Found
        409:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Conflict
      summary: |
        Delete AD CS Settings configuration by ID
      tags:
        - adcs-settings
      x-required-privileges:
        - Delete AD CS Settings
    get:
      description: Get AD CS Settings configuration for the ID value including public key information, but not including any password information.
      parameters:
        - description: ID of the AD CS Settings configuration.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdcsSettingsResponse'
          description: OK
      summary: |
        Get AD CS Settings configuration for the ID value
      tags:
        - adcs-settings
      x-required-privileges:
        - Read AD CS Settings
    patch:
      description: Update AD CS Settings configuration, where certificate information must be provided in full, or not at all. Cannot change between inbound and outbound modes.
      parameters:
        - description: ID of the AD CS Settings configuration.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AdcsSettings'
        required: true
      responses:
        204:
          description: No Content
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
      summary: |
        Update AD CS Settings configuration
      tags:
        - adcs-settings
      x-required-privileges:
        - Update AD CS Settings
  /v1/pki/adcs-settings/{id}/dependencies:
    get:
      description: Retrieve list of AD CS Settings dependencies
      parameters:
        - description: AD CS Settings ID
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdcsDependencies'
          description: Success
      summary: Retrieve list of AD CS Settings dependencies
      tags:
        - adcs-settings
      x-required-privileges:
        - Read AD CS Settings
  /v1/pki/adcs-settings/{id}/history:
    get:
      description: |
        Get specified AD CS Settings history object.
      parameters:
        - description: ID of the AD CS Settings configuration.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: 'Sorting criteria in the format: property:asc/desc. Default sort is date:desc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=date:desc,name:asc '
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - date:desc
            items:
              type: string
            type: array
          style: form
        - description: 'Query in the RSQL format, allowing to filter history notes collection. Default filter is empty query - returning all results for the requested page. Fields allowed in the query: username, date, note, details. This param can be combined with paging and sorting. Example: filter=username!=admin and details==*disabled* and date<2019-12-15'
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HistorySearchResults
          description: Details of AD CS Settings history was found.
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified AD CS Settings object does not exist.
      summary: |
        Get specified AD CS Settings history object
      tags:
        - adcs-settings
      x-required-privileges:
        - Read AD CS Settings
    post:
      description: |
        Adds specified AD CS Settings object note.
      parameters:
        - description: Instance ID of AD CS Settings history record.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistoryNote
        description: AD CS Settings history notes to create.
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Notes of AD CS Settings history were added.
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified AD CS Settings object does not exist.
        503:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: AD CS Settings history cannot be saved.
      summary: |
        Add specified AD CS Settings object note
      tags:
        - adcs-settings
      x-required-privileges:
        - Update AD CS Settings
servers:
  - url: /api
