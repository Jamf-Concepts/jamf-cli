openapi: "3.0.1"
info:
  title: "Jamf Pro API - AD CS Settings"
  description: "API for configuring the AD CS Settings in Jamf Pro using either inbound or outbound mode."
  version: "1.0.0"
paths:
  /v1/pki/adcs-settings/{id}:
    get:
      tags:
        - adcs-settings
      summary: |
        Get AD CS Settings configuration for the ID value
      description: Get AD CS Settings configuration for the ID value including public key information, but not including any password information.
      parameters:
        - name: "id"
          in: "path"
          description: ID of the AD CS Settings configuration.
          required: true
          schema:
            type: "string"
      responses:
        200:
          description: "OK"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/AdcsSettingsResponse"
      x-required-privileges:
        - Read AD CS Settings
    delete:
      tags:
        - adcs-settings
      summary: |
        Delete AD CS Settings configuration by ID
      description: Delete AD CS Settings configuration, only if reassignment of Certificate Authority succeeds and no config profiles are using the configuration.
      parameters:
        - name: "id"
          in: "path"
          description: ID of the AD CS Settings configuration.
          required: true
          schema:
            type: "string"
      responses:
        204:
          description: "No Content"
        404:
          description: "Not Found"
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        409:
          description: "Conflict"
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Delete AD CS Settings
    patch:
      tags:
        - adcs-settings
      summary: |
        Update AD CS Settings configuration
      description: Update AD CS Settings configuration, where certificate information must be provided in full, or not at all. Cannot change between inbound and outbound modes.
      parameters:
        - name: "id"
          in: "path"
          description: ID of the AD CS Settings configuration.
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          'application/merge-patch+json':
            schema:
              $ref: '#/components/schemas/AdcsSettings'
        required: true
      responses:
        204:
          description: "No Content"
        400:
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update AD CS Settings
  /v1/pki/adcs-settings:
    post:
      tags:
        - adcs-settings
      summary: |
        Create AD CS Settings configuration for either inbound or outbound mode
      description: Create AD CS Settings configuration and initialize renewal monitor. Once set, the configuration cannot change between inbound and outbound modes.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdcsSettings"
            examples:
              sample1:
                value:
                  displayName: "Example Display Name - 1"
                  caName: "EXAMPLE-SUBCA02-CA"
                  fqdn: "example-subca02.example.com"
                  adcsUrl: null
                  serverCert: null
                  clientCert: null
                  revocationEnabled: true
                  outbound: true
                  apiClientId: "A11B43D6-9ED4-4B29-B726-E2DE747D2410"
              sample2:
                value:
                  caName: "EXAMPLE-SUBCA02-CA"
                  fqdn: "example-subca02.example.com"
                  adcsUrl: "https://<host-name>.example.com"
                  serverCert:
                    filename: "adcs-proxy-ca.cer"
                    data: ""
                    password: ""
                  clientCert:
                    filename: "client-cert.pfx"
                    data: ""
                    password: "password-example"
                  revocationEnabled: true
                  outbound: false
                  apiClientId: null
              sample3:
                value:
                  displayName: "Example Display Name - 2"
                  caName: "EXAMPLE-SUBCA02-CA"
                  fqdn: "example-subca02.example.com"
                  adcsUrl: "https://<host-name>.example.com"
                  serverCert:
                    filename: "adcs-proxy-ca.pem"
                    data: ""
                    password: ""
                  clientCert:
                    filename: "client-cert.p12"
                    data: ""
                    password: "password-example"
                  revocationEnabled: true
                  outbound: false
                  apiClientId: null
        required: true
      responses:
        201:
          description: "Created"
          content:
            '*/*':
              schema:
                $ref: "DefinitionsLibrary.yaml#/components/schemas/HrefResponse"
      x-required-privileges:
        - Create AD CS Settings
  /v1/pki/adcs-settings/validate-client-certificate:
    post:
      tags:
        - adcs-settings
      summary: |
        Validate AD CS Settings client certificate
      description: Validate AD CS Settings client certificate for file format and correct password. Must be base64-encoded PKCS#12 file content, obtainable by `openssl base64 < /file/path/filename.pfx | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods. This should only contain a single X.509 certificate.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdcsCertificate"
            examples:
                sample1:
                    value:
                        filename: "client-cert.pfx"
                        data: ""
                        password: "password-example"
                sample2:
                    value:
                        filename: "client-cert.p12"
                        data: ""
                        password: "password-example"
      responses:
        204:
          description: AD CS Settings certificate for client server is of valid file format and has correct password.
      x-required-privileges:
        - Update AD CS Settings
        - Create AD CS Settings
      x-action: true
  /v1/pki/adcs-settings/validate-certificate:
    post:
      tags:
        - adcs-settings
      summary: |
          Validate AD CS Settings server certificate
      description: Validate AD CS Settings server certificate for file format. Must be base64-encoded X.509 file content, obtainable by `openssl base64 < /file/path/filename.pfx | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdcsCertificate"
            examples:
                sample1:
                    value:
                        filename: "adcs-proxy-ca.cer"
                        data: ""
                        password: ""
                sample2:
                    value:
                        filename: "adcs-proxy-ca.pem"
                        data: ""
                        password: ""
      responses:
        204:
          description: AD CS Settings certificate for the Jamf Pro server is of valid file format.
      x-required-privileges:
        - Update AD CS Settings
        - Create AD CS Settings
      x-action: true
  /v1/pki/adcs-settings/{id}/history:
    get:
      tags:
        - adcs-settings
      summary: |
        Get specified AD CS Settings history object
      description: |
        Get specified AD CS Settings history object.
      parameters:
        - name: id
          in: path
          description: ID of the AD CS Settings configuration.
          required: true
          schema:
            type: string
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page'
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page-size'
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property:asc/desc. Default sort
          is date:desc. Multiple sort criteria are supported and must be separated
          with a comma. Example: sort=date:desc,name:asc '
          explode: true
          schema:
            type: array
            items:
              type: string
            default: [date:desc]
        - name: filter
          in: query
          description: 'Query in the RSQL format, allowing to filter history notes collection.
            Default filter is empty query - returning all results for the requested page.
            Fields allowed in the query: username, date, note, details.
            This param can be combined with paging and sorting.
            Example: filter=username!=admin and details==*disabled* and date<2019-12-15'
          schema:
            type: string
            default: ''
      responses:
        200:
          description: Details of AD CS Settings history was found.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/HistorySearchResults'
        404:
          description: Specified AD CS Settings object does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read AD CS Settings
    post:
      tags:
        - adcs-settings
      summary: |
        Add specified AD CS Settings object note
      description: |
        Adds specified AD CS Settings object note.
      parameters:
      - name: id
        in: path
        description: Instance ID of AD CS Settings history record.
        required: true
        schema:
          type: string
      requestBody:
        description: AD CS Settings history notes to create.
        content:
          'application/json':
            schema:
              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ObjectHistoryNote'
        required: true
      responses:
        201:
          description: Notes of AD CS Settings history were added.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/HrefResponse'
        404:
          description: Specified AD CS Settings object does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        503:
          description: AD CS Settings history cannot be saved.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update AD CS Settings
  /v1/pki/adcs-settings/{id}/dependencies:
    get:
      tags:
        - adcs-settings
      summary: Retrieve list of AD CS Settings dependencies
      description: Retrieve list of AD CS Settings dependencies
      x-required-privileges:
        - Read AD CS Settings
      parameters:
        - name: id
          in: path
          required: true
          description: AD CS Settings ID
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AdcsDependencies'
components:
  schemas:
    AdcsCertificate:
      type: "object"
      required:
        - filename
        - data
      properties:
        filename:
          type: "string"
          description: "Server certificate filename should extend .cer or .pem, and client certificate filename should extend .p12 or .pfx."
          minLength: 1
          maxLength: 255
          example: "example.cer"
        data:
          description: Must be base-64 encoded data obtainable by `openssl base64 < /file/path/filename.pfx | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods.
          type: "array"
          items:
            type: "string"
            format: "byte"
          example: ""
        password:
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 255
          type: "string"
          format: password
          example: "password-example"
    AdcsCertificateResponse:
      type: "object"
      properties:
        filename:
          type: "string"
          description: "Server certificate filename should extend .cer or .pem, and client certificate filename should extend .p12 or .pfx."
          readOnly: true
          maxLength: 255
          example: "example.cer"
        serialNumber:
          type: "string"
          readOnly: true
          example: "123456789456123"
        subject:
          type: "string"
          readOnly: true
          example: "CN=SubjectName, OU=OrganizationalUnit, O=Organization, L=Location, ST=State, C=Country"
        issuer:
          type: "string"
          readOnly: true
          example: "IssuerName"
        expirationDate:
          type: "string"
          readOnly: true
          format: date-time
          example: 2018-10-15T16:39:56Z
    AdcsSettingsResponse:
      type: "object"
      properties:
        id:
          type: "string"
          readOnly: true
          example: "1"
        displayName:
          type: "string"
          readOnly: true
          minLength: 1
          maxLength: 255
          example: "Example Display Name"
        caName:
          type: "string"
          readOnly: true
          minLength: 1
          maxLength: 255
          example: "EXAMPLE-SUBCA02-CA"
        fqdn:
          type: "string"
          readOnly: true
          minLength: 1
          maxLength: 255
          example: "example-subca02.example.com"
        adcsUrl:
          type: "string"
          readOnly: true
          minLength: 1
          maxLength: 255
          example: "https://<host-name>.example.com"
        serverCert:
          $ref: "#/components/schemas/AdcsCertificateResponse"
        clientCert:
          $ref: "#/components/schemas/AdcsCertificateResponse"
        revocationEnabled:
          type: "boolean"
          readOnly: true
          example: true
        apiClientId:
          type: "string"
          readOnly: true
          example: A11B43D6-9ED4-4B29-B726-E2DE747D2410
        outbound:
          type: "boolean"
          readOnly: true
          example: true
        connectorLastCheckInTimestamp:
          type: "string"
          readOnly: true
          format: date-time
          example: 2018-10-15T16:39:56Z
    AdcsSettings:
      type: "object"
      description: "AD CS Settings object to create, or update with a merge-patch strategy. Certificate data must be provided in full, or not at all for update with merge-patch strategy."
      properties:
        displayName:
          type: "string"
          minLength: 1
          maxLength: 255
          example: "Example Display Name"
        caName:
          type: "string"
          minLength: 1
          maxLength: 255
          example: "EXAMPLE-SUBCA02-CA"
        fqdn:
          type: "string"
          minLength: 1
          maxLength: 255
          example: "example-subca02.example.com"
        adcsUrl:
          type: "string"
          minLength: 1
          maxLength: 255
          example: "https://<host-name>.example.com"
        serverCert:
          $ref: "#/components/schemas/AdcsCertificate"
        clientCert:
          $ref: "#/components/schemas/AdcsCertificate"
        revocationEnabled:
          type: "boolean"
          example: true
        apiClientId:
          type: "string"
          example: A11B43D6-9ED4-4B29-B726-E2DE747D2410
        outbound:
          type: "boolean"
          example: true
    AdcsDependencies:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
          nullable: false
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdcsDependency'
    AdcsDependency:
      type: object
      properties:
        configProfileId:
          type: integer
          example: 1
          nullable: false
        configProfileName:
          type: string
          example: 'name'
        configProfileType:
          type: string
          enum: [ "OSX_CONFIGURATION_PROFILE", "IOS_CONFIGURATION_PROFILE" ]
          example: "OSX_CONFIGURATION_PROFILE"
          readOnly: true
          nullable: false
