          nullable: false
          readOnly: true
          type: boolean
          example: true
        values:
          description: |
            A value of extension attribute, in some rare cases there may be multiple values present, hence the array.
          nullable: true
          readOnly: false
          type: array
          items:
            type: string
          example: [foo,bar]
        dataType:
          description: A data type of extension attribute.
          nullable: true
          readOnly: true
          type: string
          enum:
            - STRING
            - INTEGER
            - DATE_TIME
          example: STRING
        options:
          description: |
            A closed list of possible values (applies to `popup` input type).
          nullable: true
          readOnly: true
          type: array
          items:
            type: string
          example: [foo,bar]
        inputType:
          description: |
            The input method. `text` is most common and means simply free text, `popup` i a closed list of values from
            which one or many can be selected and `script` value is calculated and can never be set directly.
          nullable: true
          readOnly: true
          type: string
          enum:
            - TEXT
            - POPUP
            - SCRIPT
            - LDAP
          example: TEXT
