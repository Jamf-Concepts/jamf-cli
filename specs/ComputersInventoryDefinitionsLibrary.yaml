openapi: 3.0.1
info:
  title: Jamf Pro API - Definitions Library
  description: These definitions exist to be re-used by other Computers Inventory
    Swagger files.
  version: 0.0.1
paths: { }
components:
  schemas:
    ComputerInventoryCreateRequestV2:
      type: object
      properties:
        udid:
          type: string
          example: 45436edf-864e-4364-982a-330b01d39e65
          nullable: true
        general:
          $ref: '#/components/schemas/ComputerGeneralCreate'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ComputerApplicationCreate'
          nullable: true
        storage:
          $ref: '#/components/schemas/ComputerStorageCreate'
        security:
          $ref: '#/components/schemas/ComputerSecurityCreate'
        configurationProfiles:
          type: array
          items:
            $ref: '#/components/schemas/ComputerConfigurationProfileCreate'
          nullable: true
        printers:
          type: array
          items:
            $ref: '#/components/schemas/ComputerPrinterCreate'
          nullable: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/ComputerServiceCreate'
          nullable: true
        localUserAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ComputerLocalUserAccountCreate'
          nullable: true
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/ComputerCertificateCreate'
          nullable: true
        packageReceipts:
          $ref: '#/components/schemas/ComputerPackageReceiptsCreate'
        softwareUpdates:
          type: array
          items:
            $ref: '#/components/schemas/ComputerSoftwareUpdateCreate'
          nullable: true
        purchasing:
          $ref: '#/components/schemas/ComputerPurchaseCreate'
        userAndLocation:
          $ref: '#/components/schemas/ComputerUserAndLocationCreate'
        hardware:
          $ref: '#/components/schemas/ComputerHardwareCreate'
        operatingSystem:
          $ref: '#/components/schemas/ComputerOperatingSystemCreate'
    ComputerGeneral:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: Boalime
        lastIpAddress:
          type: string
          example: 247.185.82.186
        lastReportedIp:
          type: string
          example: 247.185.82.186
          deprecated: true
          description: Last reported IPv4 address (Deprecated. Use lastReportedIpV4 instead.)
        lastReportedIpV4:
          type: string
          example: 247.185.82.186
          description: Last reported IPv4 address
        lastReportedIpV6:
          type: string
          example: 2001:0db8:85a3:0000:0000:8a2e:0370:7335
        jamfBinaryVersion:
          type: string
          example: 9.27
        platform:
          type: string
          example: Mac
        barcode1:
          type: string
          example: 5 12345 678900
        barcode2:
          type: string
          example: 5 12345 678900
        assetTag:
          type: string
          example: 304822
        remoteManagement:
          $ref: '#/components/schemas/ComputerRemoteManagement'
        supervised:
          type: boolean
          example: true
        mdmCapable:
          $ref: '#/components/schemas/ComputerMdmCapability'
        reportDate:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
        lastContactTime:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
        lastCloudBackupDate:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
        lastEnrolledDate:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
        mdmProfileExpiration:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
        initialEntryDate:
          type: string
          format: date
          example: 2018-10-31
        distributionPoint:
          type: string
          example: distribution point name
        enrollmentMethod:
          $ref: '#/components/schemas/EnrollmentMethod'
        site:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/V1Site'
        itunesStoreAccountActive:
          type: boolean
          example: true
        enrolledViaAutomatedDeviceEnrollment:
          type: boolean
          example: true
        userApprovedMdm:
          type: boolean
          example: true
        declarativeDeviceManagementEnabled:
          type: boolean
          example: true
        extensionAttributes:
          type: array
          items:
            $ref: '#/components/schemas/ComputerExtensionAttribute'
        managementId:
          type: string
          example: 73226fb6-61df-4c10-9552-eb9bc353d507
          readOnly: true
        lastLoggedInUsernameSelfService:
          type: string
          example: admin
          nullable: true
        lastLoggedInUsernameSelfServiceTimestamp:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
          nullable: true
        lastLoggedInUsernameBinary:
          type: string
          example: admin
          nullable: true
        lastLoggedInUsernameBinaryTimestamp:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
          nullable: true
    ComputerRemoteManagement:
      type: object
      properties:
        managed:
          type: boolean
          example: true
        managementUsername:
          type: string
          example: rootname
          deprecated: true
          description: This field always returns null, please use /local-admin-password/ endpoint instead.
    ComputerMdmCapability:
      type: object
      properties:
        capable:
          type: boolean
          example: true
        capableUsers:
          type: array
          items:
            type: string
          example: [admin, rootadmin]
          deprecated: true
          description: Deprecated. Use userManagementInfo instead.
        userManagementInfo:
          type: array
          items:
            $ref: '#/components/schemas/ComputerUserManagementInfo'
    ComputerUserManagementInfo:
      type: object
      properties:
        capableUser:
          type: string
          example: admin
        managementId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
        - capableUser
        - managementId
      example:
        - capableUser: admin
          managementId: 123e4567-e89b-42d3-a456-426614174000
        - capableUser: rootadmin
          managementId: 123e4567-e89b-42d3-a456-426614174001
    ComputerDiskEncryption:
      type: object
      properties:
        bootPartitionEncryptionDetails:
          $ref: '#/components/schemas/ComputerPartitionEncryption'
        individualRecoveryKeyValidityStatus:
          type: string
          enum:
            - VALID
            - INVALID
            - UNKNOWN
            - NOT_APPLICABLE
          example: VALID
        institutionalRecoveryKeyPresent:
          type: boolean
          example: true
        diskEncryptionConfigurationName:
          type: string
          example: Test configuration
        fileVault2Enabled:
          type: boolean
          example: true
          readOnly: true
        fileVault2EnabledUserNames:
          type: array
          items:
            type: string
          example: [admin]
        fileVault2EligibilityMessage:
          type: string
          example: Not a boot partition
    ComputerPartitionEncryption:
      type: object
      properties:
        partitionName:
          type: string
          example: main
        partitionFileVault2State:
          $ref: '#/components/schemas/ComputerPartitionFileVault2State'
        partitionFileVault2Percent:
          type: integer
          example: 100
    ComputerPartitionFileVault2State:
      type: string
      example: ENCRYPTING
      enum:
        - UNKNOWN
        - UNENCRYPTED
        - INELIGIBLE
        - DECRYPTED
        - DECRYPTING
        - ENCRYPTED
        - ENCRYPTING
        - RESTART_NEEDED
        - OPTIMIZING
        - DECRYPTING_PAUSED
        - ENCRYPTING_PAUSED
    ComputerPurchase:
      type: object
      properties:
        leased:
          type: boolean
          example: true
        purchased:
          type: boolean
          example: true
        poNumber:
          type: string
          example: 53-1
        poDate:
          type: string
          format: date
          example: 2019-01-01
        vendor:
          type: string
          example: Example Vendor
        warrantyDate:
          type: string
          format: date
          example: 2019-01-01
        appleCareId:
          type: string
          example: abcd
        leaseDate:
          type: string
          format: date
          example: 2019-01-01
        purchasePrice:
          type: string
          example: $500
        lifeExpectancy:
          type: integer
          example: 5
        purchasingAccount:
          type: string
          example: admin
        purchasingContact:
          type: string
          example: yes
        extensionAttributes:
          type: array
          items:
            $ref: '#/components/schemas/ComputerExtensionAttribute'
    ComputerApplication:
      type: object
      properties:
        name:
          type: string
          example: Microsoft Word
        path:
          type: string
          example: /usr/local/app
        version:
          type: string
          example: 1.0.0
        macAppStore:
          type: boolean
          example: true
        sizeMegabytes:
          type: integer
          example: 25
        bundleId:
          type: string
          example: 1
        updateAvailable:
          type: boolean
          example: false
        externalVersionId:
          type: string
          example: 1
          description: The app's external version ID. It can be used in the iTunes Search API to decide if the app needs to be updated
    ComputerApplicationV3:
      type: object
      properties:
        name:
          type: string
          example: Microsoft Word
        path:
          type: string
          example: /usr/local/app
        version:
          type: string
          example: 1.0.0
        cfBundleShortVersionString:
          type: string
          example: 1.0.0
          nullable: false
        cfBundleVersion:
          type: string
          example: 1.0.0
          nullable: false
        macAppStore:
          type: boolean
          example: true
        sizeMegabytes:
          type: integer
          example: 25
        bundleId:
          type: string
          example: 1
        updateAvailable:
          type: boolean
          example: false
        externalVersionId:
          type: string
          example: 1
          description: The app's external version ID. It can be used in the iTunes Search API to decide if the app needs to be updated
    ComputerService:
      type: object
      properties:
        name:
          type: string
          example: SomeService
    ComputerStorage:
      type: object
      properties:
        bootDriveAvailableSpaceMegabytes:
          type: integer
          format: int64
          readOnly: true
          example: 3072
        disks:
          type: array
          items:
            $ref: '#/components/schemas/ComputerDisk'
    ComputerDisk:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: 170
        device:
          type: string
          readOnly: true
          example: disk0
        model:
          type: string
          readOnly: true
          example: APPLE HDD TOSHIBA MK5065GSXF
        revision:
          type: string
          readOnly: true
          example: 5
        serialNumber:
          type: string
          readOnly: true
          example: a8598f013366
        sizeMegabytes:
          description: Disk Size in MB.
          type: integer
          format: int64
          readOnly: true
          example: 262144
        smartStatus:
          description: S.M.A.R.T Status
          type: string
          readOnly: true
          example: OK
        type:
          description: Connection type attribute.
          example: NO
          type: string
          readOnly: true
        partitions:
          type: array
          items:
            $ref: '#/components/schemas/ComputerPartition'
    ComputerPartition:
      type: object
      properties:
        name:
          type: string
          readOnly: true
          example: Foo
        sizeMegabytes:
          description: Partition Size in MB.
          type: integer
          format: int64
          readOnly: true
          example: 262144
        availableMegabytes:
          description: Available space in MB.
          type: integer
          format: int64
          readOnly: true
          example: 131072
        partitionType:
          type: string
          enum:
            - BOOT
            - RECOVERY
            - OTHER
          readOnly: true
          example: BOOT
        percentUsed:
          description: Percentage of space used.
          type: integer
          minimum: 0
          maximum: 100
          readOnly: true
          example: 25
        fileVault2State:
          $ref: '#/components/schemas/ComputerPartitionFileVault2State'
        fileVault2ProgressPercent:
          description: Percentage progress of current FileVault 2 operation.
          type: integer
          nullable: true
          example: 45
        lvmManaged:
          type: boolean
          example: true
          readOnly: true
    ComputerUserAndLocation:
      type: object
      properties:
        username:
          type: string
          example: Madison Anderson
        realname:
          type: string
          example: 13-inch MacBook
        email:
          type: string
          example: email@com.pl
        position:
          type: string
          example: IT Team Lead
        phone:
          type: string
          example: 123-456-789
        departmentId:
          type: string
          example: 1
        buildingId:
          type: string
          example: 1
        room:
          type: string
          example: 5
        extensionAttributes:
          type: array
          items:
            $ref: '#/components/schemas/ComputerExtensionAttribute'
    ComputerConfigurationProfile:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: 1
        username:
          type: string
          readOnly: true
          example: username
        lastInstalled:
          type: string
          format: date-time
          example: 2018-10-31T18:04:13Z
        removable:
          type: boolean
          readOnly: true
          example: true
        displayName:
          type: string
          readOnly: true
          example: Displayed profile
        profileIdentifier:
          type: string
          readOnly: true
          example: 0ae590fe-9b30-11ea-bb37-0242ac130002
    ComputerSoftwareUpdate:
      type: object
      properties:
        name:
          type: string
          example: BEdit
        version:
          type: string
          example: 1.15.2
        packageName:
          type: string
          example: com.apple.pkg.AdditionalEssentials
    ComputerPrinter:
      type: object
      properties:
        name:
          type: string
          example: My Printer
        type:
          type: string
          example: XYZ 1122
        uri:
          type: string
          example: ipp://10.0.0.5
        location:
          type: string
          example: 7th floor
    ComputerAttachment:
      type: object
      properties:
        id:
          type: string
          example: 1
        name:
          type: string
          example: Attachment.pdf
        fileType:
          type: string
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          example: 1024
          description: File size in bytes
    ComputerHardware:
      type: object
      properties:
        make:
          type: string
          readOnly: true
          example: Apple
        model:
          type: string
          readOnly: true
          example: 13-inch MacBook Pro (Mid 2012)
        modelIdentifier:
          type: string
          readOnly: true
          example: MacBookPro9,2
        serialNumber:
          type: string
          readOnly: true
          example: C02ZC2QYLVDL
        processorSpeedMhz:
          description: Processor Speed in MHz.
          type: integer
          format: int64
          readOnly: true
          example: 2100
        processorCount:
          type: integer
          readOnly: true
          example: 2
        coreCount:
          type: integer
          readOnly: true
          example: 2
        processorType:
          type: string
          readOnly: true
          example: Intel Core i5
        processorArchitecture:
          type: string
          readOnly: true
          example: i386
        busSpeedMhz:
          type: integer
          format: int64
          readOnly: true
          example: 2133
        cacheSizeKilobytes:
          description: Cache Size in KB.
          type: integer
          format: int64
          readOnly: true
          example: 3072
        networkAdapterType:
          type: string
          example: Foo
        macAddress:
          type: string
          example: 6A:2C:4B:B7:65:B5
        altNetworkAdapterType:
          type: string
          example: Bar
        altMacAddress:
          type: string
          example: 82:45:58:44:dc:01
        totalRamMegabytes:
          description: Total RAM Size in MB.
          type: integer
          format: int64
          readOnly: true
          example: 4096
        openRamSlots:
          description: Available RAM slots.
          type: integer
          readOnly: true
          example: 0
        batteryCapacityPercent:
          description: Remaining percentage of battery power.
          type: integer
          minimum: 0
          maximum: 100
          readOnly: true
          example: 85
        batteryHealth:
          type: string
          readOnly: true
          description: |
            - NON_GENUINE: The battery isn’t a genuine Apple battery.
            - NORMAL: The battery is operating normally.
            - SERVICE_RECOMMENDED: The system recommends battery service.
            - UNKNOWN: The system couldn’t determine battery health information.
            - UNSUPPORTED: The device doesn’t support battery health reporting.
          default: UNKNOWN
          enum:
            - NON_GENUINE
            - NORMAL
            - SERVICE_RECOMMENDED
            - UNKNOWN
            - UNSUPPORTED
        smcVersion:
          type: string
          readOnly: true
          example: 2.2f38
        nicSpeed:
          type: string
          readOnly: true
          example: N/A
        opticalDrive:
          type: string
          readOnly: true
          example: MATSHITA DVD-R UJ-8A8
        bootRom:
          type: string
          readOnly: true
          example: MBP91.00D3.B08
        bleCapable:
          type: boolean
          readOnly: true
          example: false
        supportsIosAppInstalls:
          type: boolean
          readOnly: true
          example: false
        appleSilicon:
          type: boolean
          readOnly: true
          example: false
        provisioningUdid:
          type: string
          readOnly: true
          example: 00000AAA888-IH866799UUJD991
        extensionAttributes:
          type: array
          items:
            $ref: '#/components/schemas/ComputerExtensionAttribute'
    ComputerLocalUserAccount:
      type: object
      properties:
        uid:
          type: string
          example: 501
        userGuid:
          type: string
          readOnly: true
          example: 844F1177-0CF5-40C6-901F-38EDD9969C1C
        username:
          type: string
          example: jamf
        fullName:
          type: string
          example: John Jamf
        admin:
          type: boolean
          example: true
        homeDirectory:
          type: string
          example: '/Users/jamf'
        homeDirectorySizeMb:
          description: Home directory size in MB.
          type: integer
          format: int64
          readOnly: true
          example: 131072
        fileVault2Enabled:
          type: boolean
          example: true
        userAccountType:
          type: string
          example: LOCAL
          enum:
            - LOCAL
            - MOBILE
            - UNKNOWN
        passwordMinLength:
          type: integer
          example: 4
        passwordMaxAge:
          type: integer
          example: 5
        passwordMinComplexCharacters:
          type: integer
          example: 5
        passwordHistoryDepth:
          type: integer
          example: 5
        passwordRequireAlphanumeric:
          type: boolean
          example: true
        computerAzureActiveDirectoryId:
          type: string
          example: 1
        userAzureActiveDirectoryId:
          type: string
          example: 1
        azureActiveDirectoryId:
          type: string
          example: ACTIVATED
          enum:
            - ACTIVATED
            - DEACTIVATED
            - UNRESPONSIVE
            - UNKNOWN
    ComputerSecurity:
      type: object
      properties:
        sipStatus:
          type: string
          example: ENABLED
          enum:
            - NOT_COLLECTED
            - NOT_AVAILABLE
            - DISABLED
            - ENABLED
        gatekeeperStatus:
          type: string
          example: APP_STORE_AND_IDENTIFIED_DEVELOPERS
          enum:
            - NOT_COLLECTED
            - DISABLED
            - APP_STORE_AND_IDENTIFIED_DEVELOPERS
            - APP_STORE
        xprotectVersion:
          type: string
          example: 1.2.3
        autoLoginDisabled:
          type: boolean
          example: false
        remoteDesktopEnabled:
          description: Collected for macOS 10.14.4 or later
          type: boolean
          example: true
        activationLockEnabled:
          description: Collected for macOS 10.15.0 or later
          type: boolean
          example: true
        recoveryLockEnabled:
          type: boolean
          example: true
        firewallEnabled:
          type: boolean
          example: true
        secureBootLevel:
          description: Collected for macOS 10.15.0 or later
          type: string
          example: FULL_SECURITY
          enum:
            - NO_SECURITY
            - MEDIUM_SECURITY
            - FULL_SECURITY
            - NOT_SUPPORTED
            - UNKNOWN
        externalBootLevel:
          description: Collected for macOS 10.15.0 or later
          type: string
          example: ALLOW_BOOTING_FROM_EXTERNAL_MEDIA
          enum:
            - ALLOW_BOOTING_FROM_EXTERNAL_MEDIA
            - DISALLOW_BOOTING_FROM_EXTERNAL_MEDIA
            - NOT_SUPPORTED
            - UNKNOWN
        bootstrapTokenAllowed:
          description: Collected for macOS 11 or later
          type: boolean
          example: true
        bootstrapTokenEscrowedStatus:
          description: Collected for macOS 11 or later
          type: string
          example: ESCROWED
          enum:
            - ESCROWED
            - NOT_ESCROWED
            - NOT_SUPPORTED
        lastAttestationAttempt:
          type: string
          example: 1970-01-01T00:00:00Z
          readOnly: true
        lastSuccessfulAttestation:
          type: string
          example: 1970-01-01T00:00:00Z
          readOnly: true
        attestationStatus:
          type: string
          example: PENDING
          enum:
            - PENDING
            - SUCCESS
            - CERTIFICATE_INVALID
            - DEVICE_PROPERTIES_MISMATCH
            - MDA_UNSUPPORTED_DUE_TO_HARDWARE
            - MDA_UNSUPPORTED_DUE_TO_SOFTWARE
          readOnly: true
    ComputerCertificate:
      type: object
      properties:
        commonName:
          type: string
          example: jamf.com
        identity:
          type: boolean
          example: true
        expirationDate:
          type: string
          format: date-time
          example: 2030-10-31T18:04:13Z
        username:
          type: string
          example: test
        lifecycleStatus:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
        certificateStatus:
          type: string
          enum:
            - EXPIRING
            - EXPIRED
            - REVOKED
            - PENDING_REVOKE
            - ISSUED
          example: ISSUED
        subjectName:
          type: string
          example: CN=jamf.com
        serialNumber:
          type: string
          example: 40f3d9fb
        sha1Fingerprint:
          type: string
          example: ed361458724d06082b2314acdb82e1f586f085f5
        issuedDate:
          type: string
          example: 2022-05-23T14:54:10Z
    ComputerOperatingSystem:
      type: object
      properties:
        name:
          type: string
          example: Mac OS X
          readOnly: true
        version:
          type: string
          example: 10.9.5
          readOnly: true
        build:
          type: string
          example: 13A603
          readOnly: true
        supplementalBuildVersion:
          type: string
          example: 13A953
          description: Collected for macOS 13.0 or later
          readOnly: true
        rapidSecurityResponse:
          type: string
          example: (a)
          description: Collected for macOS 13.0 or later
          readOnly: true
        activeDirectoryStatus:
          type: string
          example: Not Bound
          readOnly: true
        fileVault2Status:
          type: string
          enum:
            - NOT_APPLICABLE
            - NOT_ENCRYPTED
            - BOOT_ENCRYPTED
            - SOME_ENCRYPTED
            - ALL_ENCRYPTED
          example: ALL_ENCRYPTED
        softwareUpdateDeviceId:
          type: string
          example: J132AP
          readOnly: true
        extensionAttributes:
          type: array
          items:
            $ref: '#/components/schemas/ComputerExtensionAttribute'
    ComputerIbeacon:
      type: object
      properties:
        name:
          type: string
          example: room A
    ComputerPackageReceipts:
      type: object
      description: 'All package receipts are listed by their package name'
      properties:
        installedByJamfPro:
          type: array
          items:
            type: string
            example: com.jamf.protect.JamfProtect
        installedByInstallerSwu:
          type: array
          items:
            type: string
            example: com.apple.pkg.Core
        cached:
          type: array
          items:
            type: string
            example: com.jamf.protect.JamfProtect
    ComputerContentCaching:
      type: object
      properties:
        computerContentCachingInformationId:
          type: string
          readOnly: true
          example: 1
        parents:
          type: array
          items:
            $ref: '#/components/schemas/ComputerContentCachingParent'
          readOnly: true
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/ComputerContentCachingAlert'
          readOnly: true
        activated:
          type: boolean
          readOnly: true
          example: false
        active:
          type: boolean
          readOnly: true
          example: false
        actualCacheBytesUsed:
          type: integer
          format: int64
          readOnly: true
          example: 0
        cacheDetails:
          type: array
          items:
            $ref: '#/components/schemas/ComputerContentCachingCacheDetail'
          readOnly: true
        cacheBytesFree:
          type: integer
          format: int64
          readOnly: true
