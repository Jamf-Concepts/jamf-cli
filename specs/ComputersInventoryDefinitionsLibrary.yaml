      type: object
      properties:
        definitionId:
          description: An identifier of extension attribute definition.
          nullable: false
          type: string
          example: 23
        name:
          description: A human-readable name by which attribute can be referred to.
          nullable: false
          readOnly: true
          type: string
          example: Some Attribute
