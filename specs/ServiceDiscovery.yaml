components:
  schemas:
    ServiceDiscoveryVersion:
      description: Service discovery enrollment version
      enum:
        - none
        - mdm-byod
        - mdm-adde
      example: mdm-byod
      type: string
    WellKnownSetting:
      properties:
        enrollmentType:
          $ref: '#/components/schemas/ServiceDiscoveryVersion'
        orgName:
          description: Organization display name
          example: Acme Corporation
          type: string
        serverUuid:
          description: Server UUID identifier
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          type: string
      required:
        - enrollmentType
        - serverUuid
      type: object
    WellKnownSettingsRequest:
      properties:
        wellKnownSettings:
          description: Array of well-known settings to update
          items:
            $ref: '#/components/schemas/WellKnownSetting'
          type: array
      required:
        - wellKnownSettings
      type: object
    WellKnownSettingsResponse:
      properties:
        wellKnownSettings:
          description: Array of well-known settings for all AxM organizations
          items:
            $ref: '#/components/schemas/WellKnownSetting'
          type: array
      required:
        - wellKnownSettings
      type: object
info:
  title: Jamf Pro API - ServiceDiscovery
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/service-discovery-enrollment/well-known-settings:
    get:
      description: |
        Returns current settings for all AxM organizations.
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellKnownSettingsResponse'
          description: Well-known settings retrieved successfully
        401:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Authentication required
        403:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Insufficient permissions
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Internal server error
      summary: Get service discovery well-known settings for all organizations
      tags:
        - service-discovery-enrollment
      x-required-privileges:
        - Read User-Initiated Enrollment
    put:
      description: |
        Accepts JSON payload to update enrollment types for AxM organizations.
        Requires "Update User-Initiated Enrollment" privilege.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellKnownSettingsRequest'
        required: true
      responses:
        204:
          description: Well-known settings updated successfully
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad request. Invalid enrollment type or malformed request.
        401:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Authentication required
        403:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Insufficient permissions
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Internal server error
      summary: Update service discovery well-known settings
      tags:
        - service-discovery-enrollment
      x-required-privileges:
        - Update User-Initiated Enrollment
servers:
  - url: /api
