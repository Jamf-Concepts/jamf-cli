components:
  parameters:
    export-fields:
      description: 'Export fields parameter, used to change default order or ignore some of the response properties. Default is empty array, which means that all fields of the response entity will be serialized. Example: export-fields=id,username'
      explode: true
      in: query
      name: export-fields
      schema:
        default: []
        items:
          type: string
        type: array
      style: form
    export-labels:
      description: 'Export labels parameter, used to customize fieldnames/columns in the exported file. Default is empty array, which means that response properties names will be used. Number of the provided labels must match the number of export-fields Example: export-labels=identifier,name with matching: export-fields=id,username'
      explode: true
      in: query
      name: export-labels
      schema:
        default: []
        items:
          type: string
        type: array
      style: form
    page:
      explode: true
      in: query
      name: page
      schema:
        default: 0
        type: integer
      style: form
    page-size:
      explode: true
      in: query
      name: page-size
      schema:
        default: 100
        type: integer
      style: form
  schemas:
    ApiError:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ApiErrorCause'
          type: array
        httpStatus:
          description: HTTP status of the response
          example: 400
          type: integer
      type: object
    ApiErrorCause:
      properties:
        code:
          description: Error-specific code that can be used to identify localization string, etc.
          example: "8675309"
          type: string
        description:
          description: A general description of error for troubleshooting/debugging. Generally this text should not be displayed to a user; instead refer to errorCode and it's localized text
          example: I've just picked up a fault in the AE35 unit. It's going to go 100% failure in 72 hours
          type: string
        field:
          description: Name of the field that caused the error.
          example: Name
          type: string
        id:
          description: id of object with error. Optional.
          example: "3"
          nullable: true
          type: string
      required:
        - field
      type: object
    AppInstallersCategory:
      nullable: true
      properties:
        id:
          default: -1
          description: An identifier of a category to which the deployment is assigned. A value of '-1' means no assignment.
          example: "1"
          readOnly: true
          type: string
        name:
          description: A name of a category to which the deployment is assigned. A value of null means no assignment or no permission to read categories.
          example: Category Katowice
          nullable: true
          readOnly: true
          type: string
      type: object
    AppInstallersInstallationSummary:
      properties:
        available:
          description: Number of computers with an available app from the App Installer deployment in Self Service. If the App Installer deployment has distribution method different than 'SELF_SERVICE', this value will be always indicate 0.
          example: 1
          type: integer
        failed:
          description: Number of computers with failed installation of app from App Installer deployment.
          example: 1
          type: integer
        inProgress:
          description: Number of computers with in progress installation of app from App Installer deployment.
          example: 1
          type: integer
        installed:
          description: Number of computers with installed app from App Installer deployment.
          example: 1
          type: integer
        unqualified:
          description: Number of computers in scope for App Installer deployment but assign to another deployment.
          example: 1
          type: integer
      type: object
    AppInstallersSite:
      nullable: true
      properties:
        id:
          default: -1
          description: An identifier of a site to which the deployment is assigned. A value of '-1' means no assignment.
          example: "1"
          readOnly: true
          type: string
        name:
          description: A name of a site to which the deployment is assigned. A value of null means no assignment or no permission to read the sites.
          example: Site Katowice
          nullable: true
          readOnly: true
          type: string
      type: object
    AppInstallersSmartGroup:
      nullable: true
      properties:
        id:
          default: -1
          description: An identifier of a smart group to which the deployment is assigned. A value of '-1' means no assignment.
          example: "1"
          readOnly: true
          type: string
        name:
          description: A name of a smart group to which the deployment is assigned. A value of null means no assignment or no permission to read the smart groups.
          example: Smart Group Katowice
          nullable: true
          readOnly: true
          type: string
      type: object
    AppTitleDeployment:
      properties:
        appTitleId:
          description: ID of app titles to be deployed
          example: "2"
          type: string
        categoryId:
          default: -1
          description: A category that this deployment should be assigned to, '-1' means no assignment
          example: "1"
          type: string
        deploymentType:
          description: |
            Defines the 'deployment type' for an App Title.
            - **INSTALL_AUTOMATICALLY** - the app will be installed as soon as possible
            - **SELF_SERVICE** - the app will be available in Self Service where user can decide if the app should be installed
          enum:
            - INSTALL_AUTOMATICALLY
            - SELF_SERVICE
          example: INSTALL_AUTOMATICALLY
          type: string
        enabled:
          default: false
          description: Is deployment active or is it a draft.
          example: false
          type: boolean
        id:
          example: "1"
          readOnly: true
          type: string
        installPredefinedConfigProfiles:
          default: false
          description: Determines whether the predefined configuration profiles will be automatically installed on client computers
          example: false
          type: boolean
        name:
          description: Human readable name of the deployment
          example: Jamf Connect for IT
          maxLength: 255
          minLength: 1
          type: string
        notificationSettings:
          description: Computer notification settings for running app with pending update; Settings are used only if version of the app supports notifications
          example:
            completeMessage: null
            deadline: null
            deadlineMessage: null
            notificationInterval: null
            notificationMessage: null
            quitDelay: null
            relaunch: null
            suppress: null
          nullable: true
          properties:
            completeMessage:
              description: Custom notification displayed on computers when an app update has been successfully completed. Default value will be used if set to null.
              example: My custom complete message
              maxLength: 150
              minLength: 1
              nullable: true
              type: string
            deadline:
              description: Duration in hours before the app is forcefully closed.
              example: 604800
              format: int64
              minimum: 1
              nullable: true
              type: integer
            deadlineMessage:
              description: Custom notification message displayed on computers when app is about to be forcefully closed. Default value will be used if set to null.
              example: My custom deadline notification message
              maxLength: 150
              minLength: 1
              nullable: true
              type: string
            notificationInterval:
              description: Custom interval in hours to display notifications on computers. Default value will be used if set to null.
              example: 86400
              format: int64
              minimum: 1
              nullable: true
              type: integer
            notificationMessage:
              description: Custom notification message to display on computers when app update is available but the app is running. Default value will be used if set to null.
              example: My custom notification message
              maxLength: 150
              minLength: 1
              nullable: true
              type: string
            quitDelay:
              description: Additional duration in minutes before the app is forcefully closed. Default value will be used if set to null.
              example: 604800
              format: int64
              minimum: 1
              nullable: true
              type: integer
            relaunch:
              description: Determines whether the app should be restarted after a successful update.
              example: false
              nullable: true
              type: boolean
            suppress:
              description: Determines whether all notifications should be suppressed.
              example: false
              nullable: true
              type: boolean
          type: object
        selfServiceSettings:
          description: Self Service settings to be used when deployment type is set to SELF_SERVICE
          example:
            categories: null
            description: null
            forceViewDescription: false
            includeInComplianceCategory: false
            includeInFeaturedCategory: false
          nullable: true
          properties:
            categories:
              description: List of categories
              example:
                - featured: false
                  id: 7
                - featured: true
                  id: 8
              items:
                properties:
                  featured:
                    default: false
                    description: App will be featured in given displayed category
                    example: false
                    type: boolean
                  id:
                    description: category id
                    example: "1"
                    type: string
                required:
                  - id
                type: object
              nullable: true
              type: array
            description:
              description: Custom text to display as a description for the app
              example: My description
              maxLength: 4000
              minLength: 1
              nullable: true
              type: string
            forceViewDescription:
              default: false
              description: Computer user will be forced to view description when installing the app
              example: false
              type: boolean
            includeInComplianceCategory:
              default: false
              description: App will be displayed in 'Compliance' category if system configuration supports it
              example: false
              type: boolean
            includeInFeaturedCategory:
              default: false
              description: App will be displayed in 'Featured' category
              example: false
              type: boolean
          type: object
        siteId:
          default: -1
          description: A site that this deployment should be assigned to, '-1' means no assigment
          example: "1"
          type: string
        smartGroupId:
          default: -1
          description: A smart group to which the app should be deployed. Default value, which means that the app installer will not be deployed, will be used if it is set to null and deployment is not active
          example: "1"
          type: string
        titleAvailableInAis:
          default: true
          description: If the app title is available in App Installer Service
          example: false
          readOnly: true
          type: boolean
        triggerAdminNotifications:
          default: false
          description: Determines whether events related to this deployment will trigger admin notifications
          example: false
          type: boolean
        updateBehavior:
          description: |
            Strategy for app updates.
            - **MANUAL** - the app will not get automatic updates without admin interaction
            - **AUTOMATIC** - the app will get automatic updates
          enum:
            - MANUAL
            - AUTOMATIC
          example: AUTOMATIC
          type: string
      required:
        - name
        - appTitleId
        - deploymentType
        - updateBehavior
      type: object
    AppTitleDeploymentRead:
      allOf:
        - $ref: '#/components/schemas/AppTitleDeployment'
        - properties:
            latestAvailableVersion:
              description: Latest available app version
              example: "10.1"
              type: string
            selectedVersion:
              description: App version to use for this deployment, contains value only if 'update behavior' is set to **MANUAL**
              example: ""
              type: string
            versionRemoved:
              default: false
              description: If the app title version was removed from App Installer Service
              example: false
              type: boolean
          type: object
    AppTitleDeploymentSummary:
      properties:
        app:
          $ref: '#/components/schemas/AppTitleDeploymentSummaryApp'
        category:
          $ref: '#/components/schemas/AppInstallersCategory'
        computerStatuses:
          $ref: '#/components/schemas/AppInstallersInstallationSummary'
        deploymentType:
          description: |
            Defines the 'deployment type' for an App Title.
            - **INSTALL_AUTOMATICALLY** - the app will be installed as soon as possible
            - **SELF_SERVICE** - the app will be available in Self Service where user can decide if the app should be installed
          enum:
            - INSTALL_AUTOMATICALLY
            - SELF_SERVICE
          example: INSTALL_AUTOMATICALLY
          readOnly: true
          type: string
        enabled:
          default: false
          description: Is deployment active or is it a draft.
          example: false
          readOnly: true
          type: boolean
        id:
          description: Deployment id
          example: "1"
          readOnly: true
          type: string
        name:
          description: Human readable name of the deployment
          example: Jamf Connect for IT
          readOnly: true
          type: string
        site:
          $ref: '#/components/schemas/AppInstallersSite'
        smartGroup:
          $ref: '#/components/schemas/AppInstallersSmartGroup'
        updateBehavior:
          description: |
            Strategy for app updates.
            - **MANUAL** - the app will not get automatic updates without admin interaction
            - **AUTOMATIC** - the app will get automatic updates
          enum:
            - MANUAL
            - AUTOMATIC
          example: AUTOMATIC
          readOnly: true
          type: string
      type: object
    AppTitleDeploymentSummaryApp:
      properties:
        bundleId:
          description: Bundle ID of app title from deployment
          example: com.jamf.JamfConnect
          nullable: true
          readOnly: true
          type: string
        deployedVersion:
          description: App version to be deployed on end user's computers
          example: "1"
          readOnly: true
          type: string
        iconUrl:
          description: URL that provides an icon for the application
          example: http://localhost:8080/example_icon
          nullable: true
          readOnly: true
          type: string
        id:
          description: App Title identifier
          example: 0B3
          readOnly: true
          type: string
        latestVersion:
          description: Latest version of app title from deployment
          example: "1"
          nullable: true
          readOnly: true
          type: string
        mediaSourceType:
          description: |
            Indication on the source which app is downloaded from
            Values:
            - **EXTERNAL_URL** - app is downloaded from external source which usually means vendor site
            - **JAMF_SERVER** - app is downloaded from JAMF server
          enum:
            - EXTERNAL_URL
            - JAMF_SERVER
          example: EXTERNAL_URL
          readOnly: true
          type: string
        selectedVersion:
          description: App version to use for this deployment, contains value only if 'update behavior' is set to **MANUAL**
          example: ""
          readOnly: true
          type: string
        titleAvailableInAis:
          description: If the app title is available in App Installer Service
          example: false
          readOnly: true
          type: boolean
        versionRemoved:
          default: false
          description: If selected app title version was removed from App Installer Service
          example: false
          type: boolean
      type: object
    AppTitleDeploymentsSummaryResult:
      properties:
        results:
          items:
            $ref: '#/components/schemas/AppTitleDeploymentSummary'
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    AppTitleVersion:
      properties:
        version:
          description: App Installer version
          example: 89.0.2
          nullable: true
          type: string
      type: object
    DeploymentComputer:
      properties:
        computerName:
          description: Human readable name of the computer.
          example: Harry's computer
          type: string
        error:
          description: Optional error code describing deployment failure.
          example: FEATURE_DOES_NOT_SUPPORT_OS_VERSION
          type: string
        id:
          description: ID of computer.
          example: "1"
          type: string
        retryable:
          description: Is it possible to retry app installation for the current computer.
          example: true
          type: boolean
        status:
          description: Current status of deploying app on computer.
          enum:
            - UNQUALIFIED
            - AVAILABLE
            - IN_PROGRESS
            - INSTALLED
            - FAILED
          example: IN_PROGRESS
          type: string
      required:
        - id
        - computerName
        - status
        - retryable
      type: object
    DeploymentComputersResult:
      properties:
        results:
          items:
            $ref: '#/components/schemas/DeploymentComputer'
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    ExportField:
      description: Field to be included in the export operation.
      properties:
        fieldLabelOverride:
          description: Name which should be used for the label in the response - can be in any language. When null the fieldName itself will be used as the label.
          example: identiteit
          nullable: true
          type: string
        fieldName:
          description: English name of the field to be exported.
          example: id
          type: string
      type: object
    ExportParameters:
      properties:
        fields:
          description: Used to change default order or ignore some of the fields. When null or empty array, all fields will be exported.
          items:
            $ref: '#/components/schemas/ExportField'
          nullable: true
          type: array
        filter:
          example: id>=100
          nullable: true
          type: string
        page:
          default: 0
          example: 0
          nullable: true
          type: integer
        pageSize:
          default: 100
          example: 100
          nullable: true
          type: integer
        sort:
          default:
            - id:desc
          description: 'Sorting criteria in the format: [<property>[:asc/desc]. Default direction when not stated is ascending.'
          example:
            - id:asc
          items:
            type: string
          nullable: true
          type: array
      type: object
    HistorySearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/ObjectHistory'
          type: array
        totalCount:
          example: 1
          minimum: 0
          type: integer
      type: object
    HrefResponse:
      properties:
        href:
          example: https://yourJamfProUrl.jamf/api/v1/resource/1
          type: string
        id:
          example: "1"
          minLength: 1
          type: string
      type: object
    ObjectHistory:
      properties:
        date:
          example: "2019-02-04T21:09:31.661Z"
          type: string
        details:
          example: Is SSO Enabled false\nSelected SSO Provider
          nullable: true
          type: string
        id:
          example: 1
          minimum: 1
          type: integer
        note:
          example: Sso settings update
          type: string
        username:
          example: admin
          type: string
      type: object
    ObjectHistoryNote:
      properties:
        note:
          example: A generic note can sometimes be useful, but generally not.
          type: string
      required:
        - note
      type: object
info:
  description: Deploy App Installer titles to computers, manage each deployment's version and update behaviour, and read per-computer installation state.
  title: Jamf Pro API - App Installer Deployments
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/app-installers/deployments:
    get:
      description: |-
        Read App Installer deployments summary.

        **Required Permissions:** `applications:read`
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page-size'
        - description: 'Sorting criteria in the format: property:asc/desc. Default sort is id:asc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=name:desc'
          explode: true
          in: query
          name: sort
          schema:
            default:
              - id:asc
            items:
              type: string
            type: array
        - description: 'Query in the RSQL format, allowing to filter app titles collection. Default filter is empty query - returning all results for the requested page. Fields allowed in the query: `id`, `name`, `app.deployedVersion`, `app.bundleId`, `deploymentType`, `updateBehavior`, `app.versionAction`. Example: name=="*appInstaller*"'
          in: query
          name: filter
          schema:
            default: ""
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTitleDeploymentsSummaryResult'
          description: Success.
      summary: Read App Installer deployments summary
      tags:
        - app-installers
      x-required-privileges:
        - Read Mac Applications
    post:
      description: |-
        Create a new App Installer deployment. The deployment has a specific app version and might be scoped to a smart group.

        **Required Permissions:** `applications:create`
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTitleDeployment'
        description: app installer to create
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrefResponse'
          description: App Installer Deployment was created
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Cloud Services Connection has not been established.
      summary: Create a new App Installer deployment
      tags:
        - app-installers
      x-jamf-expected-status: 201
      x-required-privileges:
        - Create Mac Applications
  /v1/app-installers/deployments/computers/installation-retry:
    post:
      description: |-
        Retry installation for all computers whose installation failed in any App Installer deployment.

        **Required Permissions:** `applications:update`
      parameters: []
      responses:
        204:
          description: Successful retry installation.
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Failed computers do not exist in any App Installer deployment.
      summary: Retry installation for all computers whose installation failed in any App Installer deployment.
      tags:
        - app-installers
      x-action: true
      x-jamf-expected-status: 204
      x-required-privileges:
        - Update Mac Applications
  /v1/app-installers/deployments/export:
    post:
      description: |-
        Export App Installer deployment summary

        **Required Permissions:** `applications:read`
      parameters:
        - $ref: '#/components/parameters/export-fields'
        - $ref: '#/components/parameters/export-labels'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page-size'
        - description: 'Sorting criteria in the format: property:asc/desc. Default sort is id:desc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=id:desc,name:asc '
          explode: true
          in: query
          name: sort
          schema:
            default:
              - id:asc
            items:
              type: string
            type: array
        - description: 'Query in the RSQL format, allowing to filter history notes collection. Default filter is empty query - returning all results for the requested page. Fields allowed in the query: `id`, `name`, `app.deployedVersion`, `bundleId`, `deploymentType`, `updateBehavior`, `app.versionAction`. This param can be combined with paging and sorting. Example: name=="*appInstaller*"'
          in: query
          name: filter
          schema:
            default: ""
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportParameters'
        description: Optional. Override query parameters since they can make URI exceed 2,000 character limit.
      responses:
        200:
          content:
            text/csv:
              schema:
                example: |
                  id,name
                  1,Deployment1
                  2,Deployment2
                format: binary
          description: Export successful
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Export fields specified incorrectly - non-existing column or duplicate on the list.
        503:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Export currently unavailable, all export-related resources are in use. Try again later.
      summary: Export App Installer deployment summary
      tags:
        - app-installers
      x-action: true
      x-required-privileges:
        - Read Mac Applications
  /v1/app-installers/deployments/{id}:
    delete:
      description: |-
        Delete an new App Installer deployment. The given application is left installed on the end user’s computer. Future updates won’t be deployed to the selected Smart Group.

        **Required Permissions:** `applications:delete`
      parameters:
        - description: App Title deployment identifier
          example: "123"
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: App Installer deployment record was deleted
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Cloud Services Connection has not been established.
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Specified App Installer deployment object does not exist.
      summary: Delete an App Installer deployment
      tags:
        - app-installers
      x-jamf-expected-status: 204
      x-required-privileges:
        - Delete Mac Applications
    get:
      description: |-
        Get details about App Installer deployment.

        **Required Permissions:** `applications:read`
      parameters:
        - description: App Title deployment identifier
          example: "123"
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTitleDeploymentRead'
          description: Success.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Cloud Services Connection has not been established.
      summary: Get details about App Installer deployment.
      tags:
        - app-installers
      x-required-privileges:
        - Read Mac Applications
    put:
      description: |-
        Updates App Installer deployment.

        **Required Permissions:** `applications:update`
      parameters:
        - description: App Title deployment identifier
          example: "123"
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTitleDeployment'
        description: App Installer deployment object to update
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTitleDeploymentRead'
          description: Success.
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Cloud Services Connection has not been established.
      summary: Updates App Installer deployment.
      tags:
        - app-installers
      x-required-privileges:
        - Update Mac Applications
  /v1/app-installers/deployments/{id}/computers:
    get:
      description: |-
        Get a list of all computers assigned to specific App Installers deployment together with its name and overall installation status.

        **Required Permissions:** `applications:read`, `devices:read`
      parameters:
        - description: App Title deployment identifier
          example: "123"
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page-size'
        - description: 'Sorting criteria in the format: property:asc/desc. Default sort is id:asc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=computerName:desc,status:asc'
          explode: true
