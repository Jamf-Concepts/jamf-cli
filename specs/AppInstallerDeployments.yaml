openapi: 3.0.1
info:
  title: Jamf Pro API - App Installer Deployments
  description: Manage App Installer deployment configurations in Jamf Pro. Deployments define which App Installer titles are deployed to which smart groups, along with update behavior and notification settings.
  version: 0.0.1
paths:
  /v1/app-installers/deployments:
    get:
      tags:
      - app-installer-deployments
      summary: Get all App Installer deployments
      description: Retrieves all App Installer deployment configurations (enabled or not). Results are paginated; the response carries the unfiltered totalCount so callers can page through the full set.
      parameters:
      - name: page
        in: query
        description: Zero-based page index. Defaults to 0 when omitted.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: page-size
        in: query
        description: Number of results per page. Defaults to 100 when omitted.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 1000
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AppInstallerDeploymentSearchResults'
      x-required-privileges:
      - Read App Installers
    post:
      tags:
      - app-installer-deployments
      summary: Create an App Installer deployment
      description: Creates a new App Installer deployment configuration
      requestBody:
        description: App Installer deployment to create
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/AppInstallerDeploymentCreate'
        required: true
      responses:
        201:
          description: Deployment created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AppInstallerDeploymentRef'
      x-required-privileges:
      - Create App Installers
  /v1/app-installers/deployments/{id}:
    get:
      tags:
      - app-installer-deployments
      summary: Get an App Installer deployment by ID
      description: Retrieves a specific App Installer deployment by its ID
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AppInstallerDeployment'
        404:
          description: Deployment not found
      x-required-privileges:
      - Read App Installers
    put:
      tags:
      - app-installer-deployments
      summary: Update an App Installer deployment
      description: Updates an existing App Installer deployment configuration
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      requestBody:
        description: Updated deployment configuration
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/AppInstallerDeploymentCreate'
        required: true
      responses:
        200:
          description: Deployment updated
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AppInstallerDeployment'
      x-required-privileges:
      - Update App Installers
    delete:
      tags:
      - app-installer-deployments
      summary: Delete an App Installer deployment
      description: Deletes an App Installer deployment by ID
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      responses:
        204:
          description: Deployment deleted
      x-required-privileges:
      - Delete App Installers
  /v1/app-installers/deployments/{id}/computers:
    get:
      tags:
      - app-installer-deployments
      summary: Get computers for an App Installer deployment
      description: Retrieves per-computer installation status for a deployment
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DeploymentComputerSearchResults'
        404:
          description: Deployment not found
      x-required-privileges:
      - Read App Installers
  /v1/app-installers/deployments/{id}/installation-summary:
    get:
      tags:
      - app-installer-deployments
      summary: Get installation summary for an App Installer deployment
      description: Retrieves aggregate installation status counts for a deployment
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/InstallationSummary'
        404:
          description: Deployment not found
      x-required-privileges:
      - Read App Installers
  /v1/app-installers/deployments/{id}/computers/installation-retry:
    post:
      tags:
      - app-installer-deployments
      summary: Retry all failed installations for a deployment
      description: Issues a retry for all failed App Installer installations in a deployment
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      responses:
        204:
          description: Retry submitted
        404:
          description: Deployment not found
      x-action: true
      x-required-privileges:
      - Update App Installers
  /v1/app-installers/deployments/computers/installation-retry:
    post:
      tags:
      - app-installer-deployments
      summary: Retry all failed installations across all deployments
      description: Issues a retry for all failed App Installer installations across every deployment in a single server-side call. Surfaced on the deployment installation-retry command as --all.
      responses:
        204:
          description: Retry submitted
      x-action: true
      x-required-privileges:
      - Update App Installers
  /v1/app-installers/deployments/{id}/computers/{computerId}/installation-retry:
    post:
      tags:
      - app-installer-deployments
      summary: Retry a failed installation on a specific computer
      description: Issues a retry for a failed App Installer installation on a single computer within a deployment
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      - name: computerId
        in: path
        description: ID of the computer
        required: true
        schema:
          type: string
      responses:
        204:
          description: Retry submitted
        404:
          description: Deployment or computer not found
      x-action: true
      x-required-privileges:
      - Update App Installers
  /v1/app-installers/deployments/{id}/version-update:
    post:
      tags:
      - app-installer-deployments
      summary: Update an App Installer deployment to the latest version
      description: Triggers a version update for the deployment's app title
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      responses:
        204:
          description: Version update triggered
        404:
          description: Deployment not found
      x-action: true
      x-required-privileges:
      - Update App Installers
  /v1/app-installers/deployments/export:
    post:
      tags:
      - app-installer-deployments
      summary: Export App Installer deployments
      description: Exports all App Installer deployment configurations as CSV.
      responses:
        200:
          description: Export successful
          content:
            text/csv:
              schema:
                type: string
                format: binary
      x-action: true
      x-required-privileges:
      - Read App Installers
  /v1/app-installers/deployments/{id}/history:
    get:
      tags:
      - app-installer-deployments
      summary: Get history for an App Installer deployment
      description: Retrieves the object history (notes and change details) for a deployment. Results are paginated.
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index. Defaults to 0 when omitted.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: page-size
        in: query
        description: Number of results per page. Defaults to 100 when omitted.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 2000
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property:asc/desc. Default sort is date:desc.'
        required: false
        schema:
          type: array
          items:
            type: string
          default:
          - date:desc
      - name: filter
        in: query
        description: 'RSQL filter over history fields: username, date, note, details.'
        required: false
        schema:
          type: string
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/HistorySearchResults'
        404:
          description: Deployment not found
      x-required-privileges:
      - Read App Installers
    post:
      tags:
      - app-installer-deployments
      summary: Add a history note to an App Installer deployment
      description: Adds a note to the deployment's object history
      parameters:
      - name: id
        in: path
        description: ID of the deployment
        required: true
        schema:
          type: string
      requestBody:
        description: History note to add
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/ObjectHistoryNote'
        required: true
      responses:
        201:
          description: History note created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ObjectHistoryNote'
      x-required-privileges:
      - Update App Installers
components:
  schemas:
    AppInstallerDeploymentSearchResults:
      type: object
      properties:
        totalCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AppInstallerDeploymentListItem'
    AppInstallerDeploymentListItem:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        enabled:
          type: boolean
        deploymentType:
          type: string
          enum:
          - INSTALL_AUTOMATICALLY
          - SELF_SERVICE
        updateBehavior:
          type: string
          enum:
          - AUTOMATIC
          - MANUAL
        app:
          $ref: '#/components/schemas/AppInstallerApp'
        site:
          $ref: '#/components/schemas/IdName'
        smartGroup:
          $ref: '#/components/schemas/IdName'
        category:
          $ref: '#/components/schemas/IdName'
        computerStatuses:
          $ref: '#/components/schemas/ComputerStatuses'
    AppInstallerApp:
      type: object
      description: Resolved app-catalog reference as returned in the list response. All fields are read-only server-assigned values.
      properties:
        id:
          type: string
          description: App Installer title ID
          readOnly: true
        bundleId:
          type: string
          readOnly: true
        iconUrl:
          type: string
          readOnly: true
        latestVersion:
          type: string
          readOnly: true
        selectedVersion:
          type: string
          readOnly: true
        deployedVersion:
          type: string
          readOnly: true
        versionRemoved:
          type: boolean
          readOnly: true
        titleAvailableInAis:
          type: boolean
          readOnly: true
        mediaSourceType:
          type: string
          readOnly: true
    AppInstallerDeployment:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        enabled:
          type: boolean
        appTitleId:
          type: string
          description: ID of the App Installer title to deploy
        deploymentType:
          type: string
          enum:
          - INSTALL_AUTOMATICALLY
          - SELF_SERVICE
        updateBehavior:
          type: string
          enum:
          - AUTOMATIC
          - MANUAL
        siteId:
          type: string
        smartGroupId:
          type: string
        installPredefinedConfigProfiles:
          type: boolean
        titleAvailableInAis:
          type: boolean
          readOnly: true
        triggerAdminNotifications:
          type: boolean
        notificationSettings:
          $ref: '#/components/schemas/NotificationSettings'
        selfServiceSettings:
          $ref: '#/components/schemas/SelfServiceSettings'
        selectedVersion:
          type: string
        latestAvailableVersion:
          type: string
          readOnly: true
        versionRemoved:
          type: boolean
          readOnly: true
    AppInstallerDeploymentCreate:
      type: object
      required:
      - name
      - appTitleId
      - deploymentType
      - updateBehavior
      properties:
        name:
          type: string
        enabled:
          type: boolean
        appTitleId:
          type: string
          description: ID of the App Installer title to deploy
        siteId:
          type: string
        categoryId:
          type: string
        smartGroupId:
          type: string
        deploymentType:
          type: string
          enum:
          - INSTALL_AUTOMATICALLY
          - SELF_SERVICE
        updateBehavior:
          type: string
          description: Required on create. Must be a valid enum value; the server rejects a missing, empty, or unrecognised value with 400 INVALID_FIELD.
          enum:
          - AUTOMATIC
          - MANUAL
        notificationSettings:
          $ref: '#/components/schemas/NotificationSettings'
        selfServiceSettings:
          $ref: '#/components/schemas/SelfServiceSettings'
        installPredefinedConfigProfiles:
          type: boolean
        triggerAdminNotifications:
          type: boolean
    NotificationSettings:
      type: object
      properties:
        notificationMessage:
          type: string
        notificationInterval:
          type: integer
        deadlineMessage:
          type: string
        deadline:
          type: integer
        quitDelay:
          type: integer
        completeMessage:
          type: string
        relaunch:
          type: boolean
        suppress:
          type: boolean
    SelfServiceSettings:
      type: object
      properties:
        includeInFeaturedCategory:
          type: boolean
        includeInComplianceCategory:
          type: boolean
        forceViewDescription:
          type: boolean
        description:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SelfServiceCategory'
    SelfServiceCategory:
      type: object
      properties:
        id:
          type: string
        featured:
          type: boolean
    DeploymentComputerSearchResults:
      type: object
      properties:
        totalCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentComputer'
    DeploymentComputer:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        error:
          type: string
        retryable:
          type: boolean
        computerName:
          type: string
    InstallationSummary:
      type: object
      properties:
        installed:
          type: integer
        available:
          type: integer
        inProgress:
          type: integer
        failed:
          type: integer
        unqualified:
          type: integer
    ComputerStatuses:
      type: object
      properties:
        installed:
          type: integer
        available:
          type: integer
        inProgress:
          type: integer
        failed:
          type: integer
        unqualified:
          type: integer
    AppInstallerDeploymentRef:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
    IdName:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    HistorySearchResults:
      type: object
      properties:
        totalCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ObjectHistory'
    ObjectHistory:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        date:
          type: string
        note:
          type: string
        details:
          type: string
    ObjectHistoryNote:
      type: object
      properties:
        note:
          type: string
