openapi: 3.0.1
info:
  title: Jamf Pro API - Set Recovery Lock Command Definition
  description: This MDM commands exist to be re-used by multiple other Swagger files.
  version: 0.0.1
paths: {}
components:
  schemas:
    SetRecoveryLockCommand:
      allOf:
        - $ref: 'MdmDefinitionsLibrary.yaml#/components/schemas/MdmCommandBase'
        - type: object
          properties:
            newPassword:
              type: string
              format: password
              required: true
              example: newQuerty1234
              description: The new password for Recovery Lock. Set as an empty string to clear the Recovery Lock password.
