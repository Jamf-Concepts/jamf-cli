components:
  schemas:
    ComputerSectionV2:
      type: string
      example: general
      enum:
        - GENERAL
        - DISK_ENCRYPTION
        - PURCHASING
        - APPLICATIONS
        - STORAGE
        - USER_AND_LOCATION
        - CONFIGURATION_PROFILES
        - PRINTERS
        - SERVICES
        - HARDWARE
        - LOCAL_USER_ACCOUNTS
        - CERTIFICATES
        - ATTACHMENTS
        - PACKAGE_RECEIPTS
        - SECURITY
        - OPERATING_SYSTEM
        - LICENSED_SOFTWARE
        - IBEACONS
        - SOFTWARE_UPDATES
        - EXTENSION_ATTRIBUTES
        - CONTENT_CACHING
        - GROUP_MEMBERSHIPS
    ComputerInventoryV2:
      type: object
      properties:
        id:
          type: string
          example: 1
          minLength: 1
          readOnly: true
        udid:
          type: string
          example: 123
        general:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerGeneral'
        diskEncryption:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerDiskEncryption'
        purchasing:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerPurchase'
        applications:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerApplication'
        storage:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerStorage'
        userAndLocation:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerUserAndLocation'
        configurationProfiles:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerConfigurationProfile'
        printers:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerPrinter'
        services:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerService'
        hardware:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerHardware'
        localUserAccounts:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerLocalUserAccount'
        certificates:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerCertificate'
        attachments:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerAttachment'
        packageReceipts:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerPackageReceipts'
        security:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerSecurity'
        operatingSystem:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerOperatingSystem'
        licensedSoftware:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerLicensedSoftware'
        ibeacons:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerIbeacon'
        softwareUpdates:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerSoftwareUpdate'
        extensionAttributes:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerExtensionAttribute'
        contentCaching:
          $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerContentCaching'
        groupMemberships:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/GroupMembership'
    ComputerInventorySearchResultsV2:
      type: object
      properties:
        totalCount:
          minimum: 0
          type: integer
          example: 3
        results:
          type: array
          items:
            $ref: '#/components/schemas/ComputerInventoryV2'
