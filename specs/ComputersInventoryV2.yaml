                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read Computers
    patch:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Update specific fields on a computer
      description: Update specific fields on a computer, then return the updated computer object.
      parameters:
        - name: id
          in: path
          description: instance id of computer record
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerInventoryUpdateRequest'
      responses:
        204:
          description: Details of computer were updated
        404:
          description: Specified computer object does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update Computers
  /v2/computers-inventory/{id}/attachments:
    post:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Upload attachment and assign to computer
      description: Upload attachment and assign to computer
      parameters:
        - name: id
          in: path
          description: instance id of computer record
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  description: The file to upload
                  format: binary
        required: true
      responses:
        201:
          description: Successfully uploaded attachment
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/HrefResponse'
        404:
          description: Specified computer object does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update Computers
  /v2/computers-inventory/{id}/attachments/{attachmentId}:
    get:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Download attachment file
      description: Download attachment file
      parameters:
        - name: id
          in: path
          description: instance id of computer record
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          description: instance id of attachment object
          required: true
          schema:
            type: string
      responses:
        200:
          description: Attachment successfully downloaded
          content:
            'text/plain':
              schema:
                type: string
                format: binary
                description: Downloaded binary file, Content-Type will be dynamic, based on a file extension
        404:
          description: Specified computer object or attachment does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read Computers
    delete:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Remove attachment
      description: Remove attachment
      parameters:
        - name: id
          in: path
