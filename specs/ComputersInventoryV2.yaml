openapi: 3.0.1
info:
  title: Jamf Pro API - computers
  version: 0.0.1
paths:
  /v2/computers-inventory/{id}:
    get:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Return General section of a Computer
      description: Return General section of a Computer
      parameters:
        - name: id
          in: path
          description: instance id of computer record
          required: true
          schema:
            type: string
        - name: section
          in: query
          description: 'section of computer details, if not specified, General section data is returned.
            Multiple section parameters are supported, e.g. section=general&section=hardware'
          required: false
          schema:
            type: array
            example: [GENERAL]
            default: [GENERAL]
            items:
              $ref: '#/components/schemas/ComputerSectionV2'
      responses:
        200:
          description: Details of computer were found
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ComputerInventoryV2'
        404:
          description: Specified computer object does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read Computers
    delete:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Remove specified Computer record
      description: Remove specified Computer record
      parameters:
        - name: id
          in: path
          description: instance id of computer record
          required: true
          schema:
            type: string
      responses:
        204:
          description: Computer record successfully removed
        404:
          description: Specified computer object id does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Delete Computers
  /v2/computers-inventory:
    get:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Return paginated Computer Inventory records
      description: Return paginated Computer Inventory records
      parameters:
        - name: section
          in: query
          description: 'section of computer details, if not specified, General section data is returned.
              Multiple section parameters are supported, e.g. section=GENERAL&section=HARDWARE'
          required: false
          schema:
            type: array
            example: [GENERAL]
            default: [GENERAL]
            items:
              $ref: '#/components/schemas/ComputerSectionV2'
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page'
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page-size'
        - name: sort
          in: query
          description:  |
            Sorting criteria in the format: `property:asc/desc`. Default sort
            is `general.name:asc`. Multiple sort criteria are supported and must be separated with
            a comma.

            Fields allowed in the sort: `general.name`, `udid`, `id`, `general.assetTag`,
            `general.jamfBinaryVersion`, `general.lastContactTime`, `general.lastEnrolledDate`, `general.lastCloudBackupDate`,
            `general.reportDate`,
            `general.mdmCertificateExpiration`, `general.platform`, `general.lastLoggedInUsernameSelfService`, `general.lastLoggedInUsernameSelfServiceTimestamp`,
            `general.mdmCertificateExpiration`, `general.platform`, `general.lastLoggedInUsernameBinary`, `general.lastLoggedInUsernameBinaryTimestamp`
            `hardware.make`, `hardware.model`,
            `operatingSystem.build`, `operatingSystem.supplementalBuildVersion`, `operatingSystem.rapidSecurityResponse`, `operatingSystem.name`, `operatingSystem.version`,
            `userAndLocation.realname`,
            `purchasing.lifeExpectancy`, `purchasing.warrantyDate`

            Example: `sort=udid:desc,general.name:asc`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            default: [general.name:asc]
        - name: filter
          in: query
          description:  |
            Query in the RSQL format, allowing to filter computer inventory collection.
            Default filter is empty query - returning all results for the requested page.
            
            Fields allowed in the query: `general.name`, `udid`, `id`, `general.assetTag`, `general.barcode1`, `general.barcode2`,
            `general.enrolledViaAutomatedDeviceEnrollment`, `general.lastIpAddress`, `general.itunesStoreAccountActive`,
            `general.jamfBinaryVersion`, `general.lastContactTime`, `general.lastEnrolledDate`, `general.lastCloudBackupDate`,
            `general.reportDate`, `general.lastReportedIp`, `general.lastReportedIpV4`, `general.lastReportedIpV6`, `general.managementId`, `general.remoteManagement.managed`,
            `general.mdmCapable.capable`, `general.mdmCertificateExpiration`, `general.platform`, `general.supervised`, `general.userApprovedMdm`, `general.declarativeDeviceManagementEnabled`, 
            `general.lastLoggedInUsernameSelfService`, `general.lastLoggedInUsernameSelfServiceTimestamp`, 
            `general.mdmCapable.capable`, `general.mdmCertificateExpiration`, `general.platform`, `general.supervised`, `general.userApprovedMdm`, `general.declarativeDeviceManagementEnabled`, `general.lastLoggedInUsernameBinary`, `general.lastLoggedInUsernameBinaryTimestamp`,
            `hardware.bleCapable`, `hardware.macAddress`, `hardware.make`, `hardware.model`, `hardware.modelIdentifier`, `hardware.serialNumber`,
            `hardware.supportsIosAppInstalls`,`hardware.appleSilicon`, `operatingSystem.activeDirectoryStatus`, `operatingSystem.fileVault2Status`,
            `operatingSystem.build`, `operatingSystem.supplementalBuildVersion`, `operatingSystem.rapidSecurityResponse`, `operatingSystem.name`, `operatingSystem.version`, `security.activationLockEnabled`,
            `security.recoveryLockEnabled`,`security.firewallEnabled`,`userAndLocation.buildingId`, `userAndLocation.departmentId`, `userAndLocation.email`, `userAndLocation.realname`,
            `userAndLocation.phone`, `userAndLocation.position`,`userAndLocation.room`, `userAndLocation.username`, `diskEncryption.fileVault2Enabled`,
            `purchasing.appleCareId`, `purchasing.lifeExpectancy`, `purchasing.purchased`, `purchasing.leased`, `purchasing.vendor`, `purchasing.warrantyDate`,
            
            This param can be combined with paging and sorting.
            Example: `filter=general.name=="Orchard"`
          schema:
            type: string
            default: ''
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ComputerInventorySearchResultsV2'
      x-required-privileges:
        - Read Computers
    post:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Create Computer Inventory record
      description: Creates Computer Inventory record
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ComputerInventoryCreateRequestV2'
      responses:
        201:
          description: Successful response - Computer Inventory record created
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/HrefResponse'
      x-required-privileges:
        - Create Computers
  /v2/computers-inventory-detail/{id}:
    get:
      deprecated: true
      x-deprecation-date: 2025-11-06
      tags:
        - computer-inventory
      summary: Return all sections of a computer
