      responses:
        204:
          description: Attachment successfully removed
        404:
          description: Specified computer object or attachment does not exist.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update Computers
