components:
  schemas:
    ConfigurationProfile:
      properties:
        displayName:
          example: Test WiFi
          type: string
        identifier:
          example: ac2-server4.D0EFAC2D-326C-4BB6-87E6-2BCB88490AAA
          type: string
        uuid:
          example: D29DD9FB-0D5B-422F-A3A2-ABBC5848E949
          type: string
        version:
          example: "1"
          type: string
      type: object
    DetailsV2:
      description: will be populated if the type is ios or visionos.
      properties:
        applications:
          items:
            $ref: '#/components/schemas/MobileDeviceApplication'
          type: array
        attachments:
          items:
            $ref: '#/components/schemas/MobileDeviceAttachmentV2'
          type: array
        availableMb:
          example: 26646
          type: integer
        batteryHealth:
          default: UNKNOWN
          description: |
            - NON_GENUINE: The battery isn’t a genuine Apple battery.
            - NORMAL: The battery is operating normally.
            - SERVICE_RECOMMENDED: The system recommends battery service.
            - UNKNOWN: The system couldn’t determine battery health information.
            - UNSUPPORTED: The device doesn’t support battery health reporting.
          enum:
            - NON_GENUINE
            - NORMAL
            - SERVICE_RECOMMENDED
            - UNKNOWN
            - UNSUPPORTED
          type: string
        batteryLevel:
          example: 100
          type: integer
        bleCapable:
          example: false
          type: boolean
        capacityMb:
          example: 27503
          type: integer
        certificates:
          items:
            $ref: '#/components/schemas/MobileDeviceCertificateV2'
          type: array
        cloudBackupEnabled:
          example: false
          type: boolean
        computer:
          $ref: '#/components/schemas/IdAndNameV2'
        configurationProfiles:
          items:
            $ref: '#/components/schemas/ConfigurationProfile'
          type: array
        deviceLocatorServiceEnabled:
          example: false
          type: boolean
        doNotDisturbEnabled:
          example: false
          type: boolean
        ebooks:
          items:
            $ref: '#/components/schemas/MobileDeviceEbook'
          type: array
        iTunesStoreAccountActive:
          example: false
          type: boolean
        lastBackupTimestamp:
          example: "2018-10-15T16:39:56Z"
          format: date-time
          type: string
        lastCloudBackupTimestamp:
          example: "2018-10-15T16:39:56.307Z"
          format: date-time
          type: string
        locationServicesEnabled:
          example: false
          type: boolean
        mdmCapableUsers:
          items:
            $ref: '#/components/schemas/MobileDeviceMdmCapableUser'
          type: array
        model:
          example: iPad 5th Generation (Wi-Fi)
          type: string
        modelIdentifier:
          example: ipad6,11
          type: string
        modelNumber:
          example: MP2F2LL
          type: string
        network:
          $ref: '#/components/schemas/NetworkV2'
        percentageUsed:
          example: 3
          type: integer
        provisioningProfiles:
          items:
            $ref: _MonolithLibrary.yaml#/components/schemas/MobileDeviceProvisioningProfiles
          type: array
        purchasing:
          $ref: '#/components/schemas/PurchasingV2'
        security:
          $ref: '#/components/schemas/SecurityV2'
        serviceSubscriptions:
          items:
            $ref: _MonolithLibrary.yaml#/components/schemas/MobileDeviceServiceSubscriptions
          type: array
        shared:
          example: false
          type: boolean
        supervised:
          example: true
          type: boolean
        unlockToken:
          example: VU5MT0NLVE9LRU4=
          type: string
      type: object
    ExtensionAttributeV2:
      properties:
        extensionAttributeCollectionAllowed:
          example: false
          type: boolean
        id:
          example: "1"
          readOnly: true
          type: string
        name:
          example: Example EA
          type: string
        type:
          enum:
            - STRING
            - INTEGER
            - DATE
          example: STRING
          type: string
        value:
          items:
            example: EA Value
            type: string
          type: array
      type: object
    IdAndNameV2:
      properties:
        id:
          example: "1"
          type: string
        name:
          example: A name
          type: string
      type: object
    LocationV2:
      properties:
        buildingId:
          example: "1"
          type: string
        departmentId:
          example: "1"
          type: string
        emailAddress:
          example: ITBob@jamf.com
          type: string
        phoneNumber:
          example: 555-555-5555
          type: string
        position:
          example: IT Team Lead
          type: string
        realName:
          example: IT Bob
          type: string
        room:
          example: 4th Floor - Quad 3
          type: string
        username:
          example: admin
          type: string
      type: object
    MobileDeviceApplication:
      properties:
        identifier:
          example: com.apple.airport.mobileairportutility
          type: string
        name:
          example: AirPort Utility
          type: string
        shortVersion:
          example: "7.0"
          type: string
        version:
          example: "135.24"
          type: string
      type: object
    MobileDeviceAttachmentV2:
      properties:
        id:
          example: "1"
          readOnly: true
          type: string
        name:
          example: Bob's Attachment
          type: string
      type: object
    MobileDeviceCertificateV2:
      properties:
        certificateStatus:
          enum:
            - EXPIRING
            - EXPIRED
            - REVOKED
            - PENDING_REVOKE
            - ISSUED
          example: ISSUED
          type: string
        commonName:
          example: 3B259E4B-FAD5-4860-B1DD-336ADA786EBA
          type: string
        expirationDateEpoch:
          example: "2030-10-31T18:04:13Z"
          format: date-time
          type: string
        identity:
          example: false
          type: boolean
        issuedDateEpoch:
          example: "2022-05-23T14:54:10Z"
          type: string
        lifecycleStatus:
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
          type: string
        serialNumber:
          example: 5c28fdae
          type: string
        sha1Fingerprint:
          example: 050cfe8ec9d170be7bf8f1a3cac2c52f3c6ddb20
          type: string
        subjectName:
          example: CN=Fleet Docker Jamf Pro JSS Built-in Certificate Authority
          type: string
      type: object
    MobileDeviceDetailsGetV2:
      allOf:
        - $ref: '#/components/schemas/MobileDeviceDetailsV2'
        - properties:
            groups:
              items:
                $ref: _MonolithLibrary.yaml#/components/schemas/MobileDeviceInventoryGroup
              type: array
            managementId:
              example: 73226fb6-61df-4c10-9552-eb9bc353d507
              readOnly: true
              type: string
          type: object
    MobileDeviceDetailsV2:
      properties:
        assetTag:
          example: "12345"
          type: string
        bluetoothMacAddress:
          example: ee:00:7c:f0:e5:aa
          type: string
        declarativeDeviceManagementEnabled:
          example: true
          type: boolean
        deviceOwnershipLevel:
          example: institutional
          type: string
        enforceName:
          description: Enforce the mobile device name. Device must be supervised. If set to true, Jamf Pro will revert the Mobile Device Name to the ‘name’ value each time the device checks in.
          example: false
          type: boolean
        enrollmentMethod:
          example: User-initiated - no invitation
          type: string
        enrollmentSessionTokenValid:
          example: false
          type: boolean
        extensionAttributes:
          items:
            $ref: '#/components/schemas/ExtensionAttributeV2'
          type: array
        id:
          example: "1"
          readOnly: true
          type: string
        initialEntryTimestamp:
          example: "2018-10-15T16:39:56.307Z"
          format: date-time
          type: string
        ios:
          $ref: '#/components/schemas/DetailsV2'
        ipAddress:
          example: 10.0.0.1
          type: string
        lastContactTimestamp:
          example: "2018-10-15T16:39:56Z"
          format: date-time
          type: string
        lastEnrollmentTimestamp:
          example: "2018-10-15T16:39:56.307Z"
          format: date-time
          type: string
        lastInventoryUpdateTimestamp:
          example: "2018-10-15T16:39:56Z"
          format: date-time
          type: string
        location:
          $ref: '#/components/schemas/LocationV2'
        managed:
          example: true
          type: boolean
        mdmProfileExpirationTimestamp:
          example: "2018-10-15T16:39:56.307Z"
          format: date-time
          type: string
        name:
          description: Mobile device name.
          example: Jon's iPad
          type: string
        osBuild:
          example: 15F79
          type: string
        osRapidSecurityResponse:
          description: Collected for iOS 16 and iPadOS 16.1 or later
          example: (a)
          type: string
        osSupplementalBuildVersion:
          description: Collected for iOS 16 and iPadOS 16.1 or later
          example: 20B101
          type: string
        osVersion:
          example: "11.4"
          type: string
        serialNumber:
          example: DMQVGC0DHLF0
          type: string
        site:
          $ref: _MonolithLibrary.yaml#/components/schemas/V1SiteBase
        softwareUpdateDeviceId:
          example: J132AP
          type: string
        timeZone:
          example: Europe/Warsaw
          type: string
        tvos:
          $ref: '#/components/schemas/TvOsDetails'
        type:
          description: Based on the value of this either iOS, tvOS, watch or visionOS objects will be populated.
          enum:
            - ios
            - tvos
            - watchos
            - visionos
            - unknown
          example: ios
          type: string
        udid:
          example: 0dad565fb40b010a9e490440188063a378721069
          type: string
        visionos:
          $ref: '#/components/schemas/DetailsV2'
        watchos:
          $ref: '#/components/schemas/WatchOsDetailsV2'
        wifiMacAddress:
          example: ee:00:7c:f0:e5:ff
          type: string
      type: object
    MobileDeviceEbook:
      properties:
        author:
          example: Homer J Simpson
          type: string
        title:
          example: The Odyssey
          type: string
        version:
          example: "0.1"
          type: string
      type: object
    MobileDeviceMdmCapableUser:
      properties:
        managementId:
          example: 8835fe1c-eb9d-42e5-8277-f708ae011a9d
          type: string
        userShortName:
          example: testUser
          type: string
      type: object
    MobileDeviceSearchResultsV2:
      properties:
        results:
          items:
            $ref: '#/components/schemas/MobileDeviceV2'
          type: array
        totalCount:
          example: 3
          minimum: 0
          type: integer
      type: object
    MobileDeviceV2:
      properties:
        id:
          example: "1"
          readOnly: true
          type: string
        managementId:
          example: 73226fb6-61df-4c10-9552-eb9bc353d507
          readOnly: true
          type: string
        model:
          example: iPad 5th Generation (Wi-Fi)
          type: string
        modelIdentifier:
          example: iPad6,11
          type: string
        name:
          example: iPad
          type: string
        phoneNumber:
          example: 651-555-5555 Ext111
          type: string
        serialNumber:
          example: DMQVGC0DHLA0
          type: string
        softwareUpdateDeviceId:
          example: J132AP
          type: string
        type:
          enum:
            - ios
            - tvos
            - watchos
            - visionos
            - unknown
          example: ios
          type: string
        udid:
          example: 0dad565fb40b010a9e490440188063a378721069
          type: string
        username:
          example: admin
          type: string
        wifiMacAddress:
          example: C4:84:66:92:78:00
          type: string
      type: object
    NetworkV2:
      properties:
        carrierSettingsVersion:
          example: "33.1"
          type: string
        cellularTechnology:
          example: Unknown
          type: string
        currentCarrierNetwork:
          example: Verizon Wireless
          type: string
        currentMobileCountryCode:
          example: "311"
          type: string
        currentMobileNetworkCode:
          example: "480"
          type: string
        dataRoamingEnabled:
          example: true
          type: boolean
        eid:
          description: EID or "embedded identity document" is a number associated with the eSIM on a device
          example: "12547444452496388545569920380795"
          readOnly: true
          type: string
        homeCarrierNetwork:
          example: Verizon
          type: string
        homeMobileCountryCode:
          example: US
          type: string
        homeMobileNetworkCode:
          example: "480"
          type: string
        iccid:
          example: "8991101200003204514"
          type: string
        imei:
          example: 59 105109 176278 3
          type: string
        meid:
          example: "15302309236898"
          type: string
        personalHotspotEnabled:
          example: false
          type: boolean
        phoneNumber:
          example: 555-555-5555 ext 5
          type: string
        preferredVoiceNumber:
          example: 555-555-5555
          type: string
        roaming:
          example: false
          type: boolean
        voiceRoamingEnabled:
          example: false
          type: boolean
      type: object
    PurchasingV2:
      properties:
        appleCareId:
          example: "9546567.0"
          type: string
        leaseExpiresDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        leased:
          example: false
          type: boolean
        lifeExpectancy:
          example: 7
          type: integer
        poDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        poNumber:
          example: "8675309"
          type: string
        purchasePrice:
          example: $399
          type: string
        purchased:
          example: true
          type: boolean
        purchasingAccount:
          example: IT Budget
          type: string
        purchasingContact:
          example: Nick in IT
          type: string
        vendor:
          example: Apple
          type: string
        warrantyExpiresDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
      type: object
    SecurityV2:
      properties:
        activationLockEnabled:
          example: false
          type: boolean
        attestationStatus:
          enum:
            - PENDING
            - SUCCESS
            - CERTIFICATE_INVALID
            - DEVICE_PROPERTIES_MISMATCH
            - MDA_UNSUPPORTED_DUE_TO_HARDWARE
            - MDA_UNSUPPORTED_DUE_TO_SOFTWARE
          example: SUCCESS
          readOnly: true
          type: string
        blockLevelEncryptionCapable:
          example: true
          type: boolean
        bootstrapToken:
          description: The bootstrap token for the device
          example: dGVzdCB0b2tlbg==
          readOnly: true
          type: string
        bootstrapTokenEscrowed:
          description: Indicates the bootstrap token escrow status for the device
          enum:
            - ESCROWED
            - NOT_ESCROWED
            - NOT_SUPPORTED
          example: NOT_SUPPORTED
          type: string
        dataProtected:
          example: false
          type: boolean
        fileLevelEncryptionCapable:
          example: true
          type: boolean
        hardwareEncryption:
          example: 3
          type: integer
        jailBreakDetected:
          example: false
          type: boolean
        lastAttestationAttemptDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          readOnly: true
          type: string
        lastSuccessfulAttestationDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          readOnly: true
          type: string
        passcodeCompliant:
          example: true
          type: boolean
        passcodeCompliantWithProfile:
          example: true
          type: boolean
        passcodePresent:
          example: false
          type: boolean
      type: object
    TvOsDetails:
      description: will be populated if the type is appleTv.
      properties:
        airplayPassword:
          example: "1234"
          format: password
          type: string
        applications:
          items:
            $ref: '#/components/schemas/MobileDeviceApplication'
          type: array
        certificates:
          items:
            $ref: '#/components/schemas/MobileDeviceCertificateV2'
          type: array
        configurationProfiles:
          items:
            $ref: '#/components/schemas/ConfigurationProfile'
          type: array
        deviceId:
          example: "1"
          type: string
        locales:
          example: "null"
          type: string
        model:
          example: Apple TV 3rd Generation Rev 2
          type: string
        modelIdentifier:
          example: AppleTV3,2
          type: string
        modelNumber:
          example: MD199LL
          type: string
        purchasing:
          $ref: '#/components/schemas/PurchasingV2'
        supervised:
          example: true
          type: boolean
      type: object
    UpdateIosV2:
      properties:
        purchasing:
          $ref: '#/components/schemas/PurchasingV2'
      type: object
    UpdateMobileDeviceV2:
      properties:
        assetTag:
          example: "8675309"
          type: string
        enforceName:
          description: Enforce the mobile device name. Device must be supervised. If set to true, Jamf Pro will revert the Mobile Device Name to the ‘name’ value each time the device checks in.
          example: true
          type: boolean
        ios:
          $ref: '#/components/schemas/UpdateIosV2'
        location:
          $ref: '#/components/schemas/LocationV2'
        name:
          description: Mobile Device Name. When updated, Jamf Pro sends an MDM settings command to the device (device must be supervised).
          example: Jan's Mobile Device
          type: string
        siteId:
          example: "1"
          type: string
        timeZone:
          description: IANA time zone database name
          example: Europe/Warsaw
          type: string
        tvos:
          $ref: '#/components/schemas/UpdateTvOs'
        updatedExtensionAttributes:
          items:
            $ref: '#/components/schemas/ExtensionAttributeV2'
          type: array
      type: object
    UpdateTvOs:
      properties:
        airplayPassword:
          example: "12345"
          format: password
          type: string
        purchasing:
          $ref: '#/components/schemas/PurchasingV2'
      type: object
    WatchOsDetailsV2:
      description: will be populated if the type is watchos.
      properties:
        applications:
          items:
            $ref: '#/components/schemas/MobileDeviceApplication'
          type: array
        attachments:
          items:
            $ref: '#/components/schemas/MobileDeviceAttachmentV2'
          type: array
        availableMb:
          example: 26646
          type: integer
        batteryLevel:
          example: 100
          type: integer
        bleCapable:
          example: false
          type: boolean
        capacityMb:
          example: 27503
          type: integer
        certificates:
          items:
            $ref: '#/components/schemas/MobileDeviceCertificateV2'
          type: array
        configurationProfiles:
          items:
            $ref: '#/components/schemas/ConfigurationProfile'
          type: array
        deviceLocatorServiceEnabled:
          example: false
          type: boolean
        doNotDisturbEnabled:
          example: false
          type: boolean
        iTunesStoreAccountActive:
          example: false
          type: boolean
        lastCloudBackupTimestamp:
          example: "2018-10-15T16:39:56.307Z"
          format: date-time
          type: string
        model:
          example: Apple Watch Ultra
          type: string
        modelIdentifier:
          example: Watch6,18
          type: string
        modelNumber:
          example: A2622
          type: string
        percentageUsed:
          example: 3
          type: integer
        provisioningProfiles:
          items:
            $ref: _MonolithLibrary.yaml#/components/schemas/MobileDeviceProvisioningProfiles
          type: array
        security:
          $ref: '#/components/schemas/SecurityV2'
        supervised:
          example: true
          type: boolean
        unlockToken:
          example: VU5MT0NLVE9LRU4=
          type: string
      type: object
info:
  title: Jamf Pro API - MobileDevice
  version: 0.0.1
openapi: 3.0.1
paths:
  /v2/mobile-devices:
    get:
      description: |
        Gets Mobile Device objects.
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: 'Sorting criteria in the format: property:asc/desc. Default sort is id:asc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=date:desc,name:asc '
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - id:asc
            items:
              type: string
            type: array
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDeviceSearchResultsV2'
          description: Successful response
      summary: |
        Get Mobile Device objects
      tags:
        - mobile-devices
      x-required-privileges:
        - Read Mobile Devices
  /v2/mobile-devices/{id}:
    get:
      description: Get MobileDevice
      parameters:
        - description: instance id of mobile device record
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDeviceV2'
          description: Successful response
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified mobile device object does not exist.
      summary: |
        Get Mobile Device
      tags:
        - mobile-devices
      x-required-privileges:
        - Read Mobile Devices
    patch:
      description: Updates fields on a mobile device that are allowed to be modified by users.
      parameters:
        - description: instance id of mobile device record
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMobileDeviceV2'
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDeviceDetailsV2'
          description: Successful response
        403:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Account not allowed to modify device
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified mobile device object does not exist.
      summary: |
        Update fields on a mobile device that are allowed to be modified by users
      tags:
        - mobile-devices
      x-required-privileges:
        - Update Mobile Devices
  /v2/mobile-devices/{id}/detail:
    get:
      description: Get MobileDevice
      parameters:
        - description: instance id of mobile device record
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDeviceDetailsGetV2'
          description: Successful response
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified mobile device object does not exist.
      summary: |
        Get Mobile Device
      tags:
        - mobile-devices
      x-required-privileges:
        - Read Mobile Devices
servers:
  - url: /api
