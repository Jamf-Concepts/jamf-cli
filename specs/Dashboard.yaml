components:
  schemas:
    DashboardApiError:
      properties:
        description:
          default: ""
          example: Could not collect dashboard data for licensed software
          nullable: false
          type: string
        httpStatusCode:
          default: 500
          example: 500
          nullable: false
          type: integer
        id:
          default: ""
          example: "3"
          nullable: false
          type: string
      type: object
    DashboardItem:
      properties:
        details:
          items:
            description: Additional details that will be found in a legend of the widgets on the dashboard
            properties:
              label:
                example: 10.2.001.4
                type: string
              value:
                example: "24"
                type: string
            title: DashboardDetail
            type: object
          type: array
        enabled:
          default: true
          description: Logical to decide whether widget should be enabled or disabled; i.e. Policy
          type: boolean
        error:
          $ref: '#/components/schemas/DashboardApiError'
        id:
          example: "1"
          type: string
        info:
          description: Additional information such as identifiers for a specific policy within a software patch
          example: "3"
          nullable: true
          type: string
        metrics:
          items:
            properties:
              enabled:
                default: true
                description: Logical to decide whether metric should be enabled or disabled; i.e. Policy can be at Retrying-Disabled status
                type: boolean
              tag:
                enum:
                  - Completed
                  - Remaining
                  - Site License
                  - No Licenses
                  - Over
                  - Failed
                  - Retrying
                  - Retrying-disabled
                  - Pending
                  - Expiring
                  - Active
                  - Inactive
                  - Computers
                  - Devices
                  - Users
                  - In Use
                  - N/A
                  - Latest Version
                  - Other Versions
                example: Completed
                type: string
              value:
                description: Usually a number associated with the tag; i.e. 23 Pending Computers
                example: "2"
                type: string
            title: DashboardMetric
            type: object
          type: array
        subtitle:
          example: Adobe Patch Policy
          nullable: true
          type: string
        title:
          example: Patch Report
          nullable: true
          type: string
      type: object
    DashboardObject:
      description: Dashboard object consisting of object type, object's ID, and whether it should display on the Jamf Pro dashboard
      nullable: false
      properties:
        enabled:
          example: true
          type: boolean
        objectId:
          example: "1"
          type: string
        objectType:
          enum:
            - TYPE_IOS_CONFIGURATION_PROFILE
            - TYPE_MACOS_CONFIGURATION_PROFILE
            - TYPE_USER_GROUP
            - TYPE_LICENSED_SOFTWARE
            - TYPE_PATCH_SOFTWARE_TITLE_CONFIGURATION
            - TYPE_PATCH_POLICY
            - TYPE_POLICY
            - TYPE_COMPUTER_GROUP
            - TYPE_MOBILE_DEVICE_GROUP
            - TYPE_DIGICERT_PKI_MANAGER_SETTINGS
          example: TYPE_IOS_CONFIGURATION_PROFILE
          type: string
      required:
        - enabled
        - objectId
        - objectType
      type: object
    DashboardSetup:
      description: Response object that has lists of information for widgets, and what setup tasks to display.
      properties:
        featureOptions:
          additionalProperties:
            items:
              $ref: '#/components/schemas/DashboardItem'
            type: array
          example:
            TYPE_PATCH_SOFTWARE_TITLE_CONFIGURATION:
              - details:
                  - label: 10.2.001.4
                    value: "24"
                enabled: true
                error:
                  description: Null pointer exception example error
                  httpStatusCode: "500"
                  id: "3"
                id: "1"
                info: "3"
                metrics:
                  - enabled: true
                    tag: Completed
                    value: "2"
                subtitle: Adobe Patch Policy
                title: Patch Report
          properties:
            feature:
              enum:
                - TYPE_IOS_CONFIGURATION_PROFILE
                - TYPE_MACOS_CONFIGURATION_PROFILE
                - TYPE_USER_GROUP
                - TYPE_LICENSED_SOFTWARE
                - TYPE_PATCH_SOFTWARE_TITLE_CONFIGURATION
                - TYPE_PATCH_POLICY
                - TYPE_POLICY
                - TYPE_COMPUTER_GROUP
                - TYPE_MOBILE_DEVICE_GROUP
                - TYPE_DIGICERT_PKI_MANAGER_SETTINGS
              example: TYPE_POLICY
              type: string
          type: object
        setupTaskOptions:
          additionalProperties:
            $ref: '#/components/schemas/DashboardSetupTask'
          example:
            TYPE_SSL_SETUP_TASK:
              available: true
              error:
                description: Null pointer exception example error
                httpStatusCode: "500"
                id: ""
          properties:
            setupTask:
              enum:
                - TYPE_LDAP_SERVER_SETUP_TASK
                - TYPE_PUSH_NOTIFICATION_SETTINGS_SETUP_TASK
                - TYPE_SMTP_SERVER_SETUP_TASK
                - TYPE_SSL_SETUP_TASK
              example: TYPE_SSL_SETUP_TASK
              type: string
          type: object
      type: object
    DashboardSetupTask:
      properties:
        available:
          default: false
          example: true
          nullable: false
          type: boolean
        error:
          $ref: '#/components/schemas/DashboardApiError'
      type: object
info:
  title: Jamf Pro API - Dashboard
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/dashboard:
    get:
      description: |
        Get all the dashboard information for widgets and setup tasks
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSetup'
          description: OK
        503:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiErrorCause
          description: Dashboard service is unavailable
      summary: |
        Get all the dashboard setup information
      tags:
        - dashboard
      x-authentication-required: true
  /v1/dashboard/toggle:
    post:
      description: |
        Add or remove dashboard detail by the type of object, and the object's ID. Duplicates will not be added again.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardObject'
        description: Dashboard object with the associated type and ID with a toggle to add or remove the object
        required: true
      responses:
        202:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Object toggled on/off for the Jamf Pro dashboard
      summary: |
        Add or remove an object to the Jamf Pro dashboard
      tags:
        - dashboard
      x-action: true
      x-authentication-required: true
servers:
  - url: /api
