components:
  schemas:
    Script:
      properties:
        categoryId:
          example: "1"
          type: string
        categoryName:
          example: Developer Tools
          type: string
        id:
          example: "1"
          minLength: 1
          readOnly: true
          type: string
        info:
          example: Installs utilities for developers
          type: string
        name:
          example: Install Developer Utils Script
          type: string
        notes:
          example: Should be able to be re-run without problem.
          type: string
        osRequirements:
          example: 10.10.x
          type: string
        parameter10:
          example: "7"
          type: string
        parameter11:
          example: "8"
          type: string
        parameter4:
          example: "1"
          type: string
        parameter5:
          example: "2"
          type: string
        parameter6:
          example: "3"
          type: string
        parameter7:
          example: "4"
          type: string
        parameter8:
          example: "5"
          type: string
        parameter9:
          example: "6"
          type: string
        priority:
          enum:
            - BEFORE
            - AFTER
            - AT_REBOOT
          example: AFTER
          type: string
        scriptContents:
          example: echo "Trivial script."
          type: string
      required:
        - name
      type: object
    ScriptsSearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/Script'
          minItems: 0
          type: array
        totalCount:
          example: 3
          minimum: 0
          type: integer
      type: object
info:
  title: Jamf Pro API - Script
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/scripts:
    get:
      description: Search for sorted and paged scripts
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: 'Sorting criteria in the format: property:asc/desc. Default sort is name:asc. Multiple sort criteria are supported and must be separated with a comma. Fields allowed in the query: `id`, `name`, `info`, `notes`, `priority`, `categoryId`, `categoryName`, `parameter4` up to `parameter11`, `osRequirements`, `scriptContents`. Example: sort=date:desc,name:asc '
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - name:asc
            items:
              type: string
            type: array
          style: form
        - description: 'Query in the RSQL format, allowing to filter scripts collection. Default search is empty query - returning all results for the requested page. Fields allowed in the query: `id`, `name`, `info`, `notes`, `priority`, `categoryId`, `categoryName`, `parameter4` up to `parameter11`, `osRequirements`, `scriptContents`. This param can be combined with paging and sorting. Example: filter=categoryName=="Category" and name=="*script name*"'
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptsSearchResults'
          description: Found scripts matching search params.
      summary: |
        Search for sorted and paged Scripts
      tags:
        - scripts
      x-required-privileges:
        - Read Scripts
    post:
      description: Creates a script
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Script'
        description: new script to create. ids defined in this body will be ignored
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Script created successfully
      summary: |
        Create a Script
      tags:
        - scripts
      x-required-privileges:
        - Create Scripts
  /v1/scripts/{id}:
    delete:
      description: Deletes a script at the specified id
      parameters:
        - description: Script object identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: Successful response
      summary: |
        Delete a Script at the specified id
      tags:
        - scripts
      x-required-privileges:
        - Delete Scripts
    get:
      description: Retrieves a full script object
      parameters:
        - description: Script object identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Script with that ID does not exist
      summary: |
        Retrieve a full script object
      tags:
        - scripts
      x-required-privileges:
        - Read Scripts
    put:
      description: Replaces the script at the id with the supplied information
      parameters:
        - description: Script object identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Script'
        description: new script to upload to existing id. ids defined in this body will be ignored
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Script'
          description: Script at id was updated
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Script with that id does not exist
      summary: |
        Replace the script at the id with the supplied information
      tags:
        - scripts
      x-required-privileges:
        - Update Scripts
  /v1/scripts/{id}/download:
    get:
      description: Download a text file of the script contents
      parameters:
        - description: id of the script to be downloaded
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            text/plain:
              schema:
                format: binary
                type: string
          description: The script of the specified id
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Not found
      summary: |
        Download a text file of the Script contents
      tags:
        - scripts
      x-required-privileges:
        - Read Scripts
  /v1/scripts/{id}/history:
    get:
      description: |
        Gets specified Script history object
      parameters:
        - description: id of script history record
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: 'Sorting criteria in the format: property:asc/desc. Default sort is date:desc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=date:desc,name:asc '
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - date:desc
            items:
              type: string
            type: array
          style: form
        - description: 'Query in the RSQL format, allowing to filter history notes collection. Default filter is empty query - returning all results for the requested page. Fields allowed in the query: username, date, note, details. This param can be combined with paging and sorting. Example: filter=username!=admin and details==*disabled* and date<2019-12-15'
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HistorySearchResults
          description: OK
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified script does not exist.
      summary: |
        Get specified Script history object
      tags:
        - scripts
      x-required-privileges:
        - Read Scripts
    post:
      description: |
        Adds specified Script history object notes
      parameters:
        - description: instance id of script history record
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistoryNote
        description: history notes to create
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistory
          description: Notes of script history were added
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified script does not exist.
        503:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Script history can not be saved
      summary: |
        Add specified Script history object notes
      tags:
        - scripts
      x-required-privileges:
        - Update Scripts
servers:
  - url: /api
