              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified computer object does not exist.
      summary: Update specific fields on a computer
      tags:
        - computer-inventory
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Update Computers
  /v1/computers-inventory/filevault:
    get:
      deprecated: true
      description: Return paginated FileVault information for all computers
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
      responses:
