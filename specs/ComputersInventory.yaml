info:
  title: Jamf Pro API - ComputersInventory
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/computers-inventory:
    get:
      deprecated: true
      description: Return paginated Computer Inventory records
      parameters:
        - description: section of computer details, if not specified, General section data is returned. Multiple section parameters are supported, e.g. section=GENERAL&section=HARDWARE
          explode: true
          in: query
          name: section
          required: false
          schema:
            default:
              - GENERAL
            example:
              - GENERAL
            items:
              $ref: '#/components/schemas/ComputerSection'
            type: array
          style: form
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: |
            Sorting criteria in the format: `property:asc/desc`. Default sort
            is `general.name:asc`. Multiple sort criteria are supported and must be separated with
            a comma.

            Fields allowed in the sort: `general.name`, `udid`, `id`, `general.assetTag`,
            `general.jamfBinaryVersion`, `general.lastContactTime`, `general.lastEnrolledDate`, `general.lastCloudBackupDate`,
            `general.reportDate`,
            `general.mdmCertificateExpiration`, `general.platform`, `general.lastLoggedInUsernameSelfService`, `general.lastLoggedInUsernameSelfServiceTimestamp`,
            `general.lastLoggedInUsernameBinary`, `general.lastLoggedInUsernameBinaryTimestamp`,
            `general.lastLoggedInUsernameMdm`, `general.lastLoggedInUsernameMdmTimestamp`
            `hardware.make`, `hardware.model`,
            `operatingSystem.build`, `operatingSystem.supplementalBuildVersion`, `operatingSystem.rapidSecurityResponse`, `operatingSystem.name`, `operatingSystem.version`,
            `userAndLocation.realname`,
            `purchasing.lifeExpectancy`, `purchasing.warrantyDate`

            Example: `sort=udid:desc,general.name:asc`.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - general.name:asc
            items:
              type: string
            type: array
          style: form
        - description: "Query in the RSQL format, allowing to filter computer inventory collection.\nDefault filter is empty query - returning all results for the requested page.\n\nFields allowed in the query: `general.name`, `udid`, `id`, `general.assetTag`, `general.barcode1`, `general.barcode2`,\n`general.enrolledViaAutomatedDeviceEnrollment`, `general.lastIpAddress`, `general.itunesStoreAccountActive`,\n`general.jamfBinaryVersion`, `general.lastContactTime`, `general.lastEnrolledDate`, `general.lastCloudBackupDate`,\n`general.reportDate`, `general.lastReportedIp`, `general.lastReportedIpV4`, `general.lastReportedIpV6`, `general.managementId`, `general.remoteManagement.managed`,\n`general.mdmCapable.capable`, `general.mdmCertificateExpiration`, `general.platform`, `general.supervised`, `general.userApprovedMdm`, `general.declarativeDeviceManagementEnabled`, \n`general.lastLoggedInUsernameSelfService`, `general.lastLoggedInUsernameSelfServiceTimestamp`,\n`general.lastLoggedInUsernameBinary`, `general.lastLoggedInUsernameBinaryTimestamp`,\n`general.lastLoggedInUsernameMdm`, `general.lastLoggedInUsernameMdmTimestamp`,\n`hardware.bleCapable`, `hardware.macAddress`, `hardware.make`, `hardware.model`, `hardware.modelIdentifier`, `hardware.serialNumber`,\n`hardware.supportsIosAppInstalls`,`hardware.appleSilicon`, `operatingSystem.activeDirectoryStatus`, `operatingSystem.fileVault2Status`,\n`operatingSystem.build`, `operatingSystem.supplementalBuildVersion`, `operatingSystem.rapidSecurityResponse`, `operatingSystem.name`, `operatingSystem.version`, `security.activationLockEnabled`,\n`security.recoveryLockEnabled`,`security.firewallEnabled`,`userAndLocation.buildingId`, `userAndLocation.departmentId`, `userAndLocation.email`, `userAndLocation.realname`,\n`userAndLocation.phone`, `userAndLocation.position`,`userAndLocation.room`, `userAndLocation.username`, `diskEncryption.fileVault2Enabled`,\n`purchasing.appleCareId`, `purchasing.lifeExpectancy`, `purchasing.purchased`, `purchasing.leased`, `purchasing.vendor`, `purchasing.warrantyDate`,\n\nThis param can be combined with paging and sorting.\nExample: `filter=general.name==\"Orchard\"`\n"
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerInventorySearchResults'
          description: Successful response
      summary: Return paginated Computer Inventory records
      tags:
        - computer-inventory
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Read Computers
    post:
      deprecated: true
      description: Creates Computer Inventory record
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputerInventoryCreateRequest'
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Successful response - Computer Inventory record created
      summary: Create Computer Inventory record
      tags:
        - computer-inventory
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Create Computers
  /v1/computers-inventory-detail/{id}:
    get:
      deprecated: true
      description: Return all sections of a computer
      parameters:
        - description: instance id of computer record
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
