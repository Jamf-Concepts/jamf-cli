    pagesize:
      name: pagesize
      in: query
      schema:
        type: integer
        default: 100
      deprecated: true
    sort:
      name: sort
      in: query
      description: 'Sorting criteria in the format: property,asc/desc. Default sort
        order is descending. Multiple sort criteria are supported and must be entered
        on separate lines in Swagger UI. In the URI the ''sort'' query param is not
        duplicated for each sort criterion, e.g., ...&sort=name%2Casc,date%2Cdesc'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
        default:
          - date:desc
          - username:asc
    filter:
      name: filter
      in: query
      description: 'Query in the RSQL format, allowing to filter history notes collection.
        Default filter is empty query - returning all results for the requested page.
        Fields allowed in the query: username, date, note, details.
        This param can be combined with paging and sorting.
        Example: filter=username!=admin and details==*disabled* and date<2019-12-15'
      schema:
        type: string
        default: ''
    export-fields:
      name: export-fields
      in: query
      description: 'Export fields parameter, used to change default order
        or ignore some of the response properties. Default is empty array, which means that all fields
        of the response entity will be serialized. Example: export-fields=id,username'
      schema:
        type: array
        items:
          type: string
        default: []
    export-labels:
      name: export-labels
      in: query
      description: 'Export labels parameter, used to customize fieldnames/columns in the exported file.
        Default is empty array, which means that response properties names will be used.
        Number of the provided labels must match the number of export-fields
        Example: export-labels=identifier,name with matching: export-fields=id,username'
      schema:
        type: array
        items:
          type: string
        default: [ ]
