        - deviceEnrollmentProgramInstanceId
        - locationInformation
        - purchasingInformation
        - preventActivationLock
        - enableDeviceBasedActivationLock
        - autoAdvanceSetup
    PrestagePurchasingInformationV2:
      type: object
      properties:
        id:
          type: string
          example: -1
        leased:
          type: boolean
          example: true
        purchased:
          type: boolean
          example: true
        appleCareId:
          type: string
          example: abcd
        poNumber:
          type: string
          example: 53-1
        vendor:
          type: string
          example: Example Vendor
        purchasePrice:
          type: string
          example: $500
        lifeExpectancy:
          type: integer
          example: 5
        purchasingAccount:
          type: string
          example: admin
        purchasingContact:
          type: string
          example: yes
        leaseDate:
