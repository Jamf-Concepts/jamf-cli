components:
  schemas:
    OauthTokens:
      nullable: false
      properties:
        accessToken:
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiIsImtpZCI6ImEyNDc2MmUwOTc1NDllMzIzZTVlYzY5OGE2Zjk0NjZiIn0..D230129dYtmQLPYeZxKD2gBz9M3MA-8xpOg1IHMNpYgoK_zQLMwpNdWqdWO7xGPj2vc8xZOT6h0sY6pre15s_g
          nullable: false
          type: string
        idToken:
          example: .e30.N2sF3wD4cHMnoi667YFNPK7u7UfOnxdbt7cZPPF3JJUw_UDeOhS5r7O6fyaQVD0VowLukQILVb_PdnxayNKYrg
          nullable: false
          type: string
      type: object
info:
  title: Jamf Pro API - OauthTokenSession
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/oauth2/session-tokens:
    get:
      description: Retrieve the access token and user information for the current session.
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokens'
          description: Successful response
        400:
          description: Unable to retrieve tokens
      summary: |
        Retrieve the access token and user information for the current session.
      tags:
        - sso-oauth-session-tokens
      x-authentication-required: true
servers:
  - url: /api
