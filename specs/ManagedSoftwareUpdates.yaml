openapi: 3.0.1
info:
  title: Jamf Pro API - Managed Software Update Statuses
  version: 0.0.1
paths:
  /v1/managed-software-updates/update-statuses:
    get:
      tags:
        - managed-software-updates
      summary: Retrieve Managed Software Update Statuses
      description: |
        Retrieve Managed Software Update Statuses
      x-required-privileges:
        - Read Computers
        - Read Mobile Devices
      parameters:
        - name: filter
          in: query
          description: 'Query in the RSQL format, allowing to filter Managed Software Updates collection.
                      Default filter is empty query - returning all results for the requested page.
                      Fields allowed in the query: osUpdatesStatusId, device.deviceId, device.objectType,
                      downloaded, downloadPercentComplete, productKey, status, deferralsRemaining, maxDeferrals,
                      nextScheduledInstall, created and updated.'
          schema:
            type: string
            default: ''
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ManagedSoftwareUpdateStatuses'
              examples:
                ComputerManagedSoftwareUpdateStatus:
                  value:
                    results:
                    - osUpdatesStatusId: "1"
                      device:
                        deviceId: 1
                        objectType: "COMPUTER"
                        href: "/v1/computers-inventory/1"
                      downloadPercentComplete: 0.8
                      downloaded: true
                      productKey: "macOSUpdate19F77"
                      status: "DOWNLOADING"
                      deferralsRemaining: 5
                      maxDeferrals: 5
                      nextScheduledInstall: "2022-12-25T21:09:31.661Z"
                      pastNotifications: [ "2022-12-22T21:09:31.661Z", "2022-12-23T21:09:31.661Z", "2022-12-24T21:09:31.661Z" ]
                      created: "2022-12-22T21:09:00.661Z"
                      updated: "2022-12-24T21:09:31.661Z"
                    totalCount: 1
                MobileDeviceManagedSoftwareUpdateStatus:
                  value:
                    results:
                    - osUpdatesStatusId: "1"
                      device:
                        deviceId: 1
                        objectType: "MOBILE_DEVICE"
                        href: "/v2/mobile-devices/1"
                      downloadPercentComplete: 0.8
                      downloaded: true
                      productKey: "iOSUpdate19F77"
                      status: "DOWNLOADING"
                      created: "2022-12-22T21:09:00.661Z"
                      updated: "2022-12-22T21:09:00.661Z"
                    totalCount: 1
