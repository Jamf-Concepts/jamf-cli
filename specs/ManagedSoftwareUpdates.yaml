  /v1/managed-software-updates/available-updates:
    get:
      tags:
        - managed-software-updates
      summary: Retrieve available macOS and iOS Managed Software Updates
      description: |
        Retrieves available macOS and iOS Managed Software Updates
      x-authentication-required: true
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AvailableOsUpdates'
components:
  schemas:
    ManagedSoftwareUpdateStatuses:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/ManagedSoftwareUpdateStatus'
    ManagedSoftwareUpdateStatus:
      type: object
      properties:
        osUpdatesStatusId:
          type: string
          example: "1"
        device:
          type: object
          properties:
            deviceId:
              type: string
            objectType:
              type: string
              enum: [ "COMPUTER", "MOBILE_DEVICE", "APPLE_TV" ]
            href:
              type: string
        downloadPercentComplete:
          type: number
          example: 0.8
        downloaded:
          type: boolean
          example: false
        productKey:
          type: string
          example: "iOSUpdate19F77"
        status:
          type: string
          enum: [ "DOWNLOADING", "IDLE", "INSTALLING", "INSTALLED", "ERROR", "DOWNLOAD_FAILED", "DOWNLOAD_REQUIRES_COMPUTER", "DOWNLOAD_INSUFFICIENT_SPACE", "DOWNLOAD_INSUFFICIENT_POWER", "DOWNLOAD_INSUFFICIENT_NETWORK", "INSTALL_INSUFFICIENT_SPACE", "INSTALL_INSUFFICIENT_POWER", "INSTALL_PHONE_CALL_IN_PROGRESS", "INSTALL_FAILED", "UNKNOWN" ]
          example: "DOWNLOADING"
        deferralsRemaining:
          type: integer
          description: not applicable to all managed software update statuses
          example: 4
        maxDeferrals:
          type: integer
          description: not applicable to all managed software update statuses
          example: 5
        nextScheduledInstall:
          type: string
          description: not applicable to all managed software update statuses
          format: date-time
          example: "2022-12-25T21:09:31.661Z"
        pastNotifications:
          type: array
          description: not applicable to all managed software update statuses
          items:
            type: string
            format: date-time
          example: [ "2022-12-22T21:09:31.661Z", "2022-12-23T21:09:31.661Z", "2022-12-24T21:09:31.661Z" ]
        created:
          type: string
          format: date-time
          example: "2022-12-22T21:09:00.661Z"
        updated:
          type: string
          format: date-time
          example: "2022-12-24T21:09:31.661Z"
    AvailableOsUpdates:
      type: object
      properties:
        availableUpdates:
          type: object
          nullable: false
          properties:
            macOS:
              type: array
              items:
                type: string
              example: [ "12.0.1", "11.6.1", "11.6", "11.5.2" ]
            iOS:
              type: array
              items:
                type: string
              example: [ "16.1.1", "16.0.1", "15.7.1", "9.1" ]
