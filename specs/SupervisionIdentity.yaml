components:
  schemas:
    SupervisionIdentity:
      properties:
        commonName:
          example: Jamf Identity - Supervision Identity
          type: string
        displayName:
          example: Supervision Identity
          type: string
        expirationDate:
          example: "2000-10-31"
          type: string
        id:
          example: 1
          type: integer
      type: object
    SupervisionIdentityCertificateUpload:
      properties:
        certificateData:
          description: The base 64 encoded supervision identity certificate data
          example: VTI5dFpTQnlZVzVrYjIwZ1ltbDBJRzltSUhSbGVIUWdkRzhnZFhObElHRnVaQ0J6WldVZ2FXWWdZVzU1YjI1bElHRmpkSFZoYkd4NUlIUnlhV1Z6SUhSdklHUmxZMjlrWlNCcGRBPT0=
          format: byte
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
        displayName:
          example: Supervision Identity
          type: string
        password:
          example: jamf1234
          format: password
          type: string
      required:
        - displayName
        - password
      type: object
    SupervisionIdentityCreate:
      properties:
        displayName:
          example: Supervision Identity
          type: string
        password:
          example: jamf1234
          format: password
          type: string
      required:
        - displayName
        - password
      type: object
    SupervisionIdentitySearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/SupervisionIdentity'
          type: array
        totalCount:
          example: 1
          minimum: 0
          type: integer
      type: object
    SupervisionIdentityUpdate:
      properties:
        displayName:
          example: Supervision Identity
          type: string
      required:
        - displayName
      type: object
info:
  title: Jamf Pro API - SupervisionIdentity
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/supervision-identities:
    get:
      description: Search for sorted and paged supervision identities
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/size
        - $ref: _MonolithLibrary.yaml#/components/parameters/pagesize
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: 'Sorting criteria in the format: property:asc/desc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=date:desc,name:asc '
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default: id:asc
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionIdentitySearchResults'
          description: Successful response
      summary: |
        Search for sorted and paged Supervision Identities
      tags:
        - supervision-identities-preview
      x-required-privileges:
        - Read Apple Configurator Enrollment
    post:
      description: Creates a Supervision Identity for the supplied information
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisionIdentityCreate'
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionIdentity'
          description: Success
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Something went wrong
      summary: |
        Create a Supervision Identity for the supplied information
      tags:
        - supervision-identities-preview
      x-required-privileges:
        - Update Apple Configurator Enrollment
  /v1/supervision-identities/upload:
    post:
      description: Uploads the Supervision Identity .p12 file
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisionIdentityCertificateUpload'
        description: The base 64 encoded .p12 file alone with other needed information
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionIdentity'
          description: Success
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Something went wrong
      summary: |
        Upload the Supervision Identity .p12 file
      tags:
        - supervision-identities-preview
      x-action: true
      x-required-privileges:
        - Update Apple Configurator Enrollment
  /v1/supervision-identities/{id}:
    delete:
      description: Deletes a Supervision Identity with the supplied id
      parameters:
        - description: Supervision Identity identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: integer
          style: simple
      responses:
        204:
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Supervision Identity with that id does not exist
      summary: |
        Delete a Supervision Identity with the supplied id
      tags:
        - supervision-identities-preview
      x-required-privileges:
        - Update Apple Configurator Enrollment
    get:
      description: Retrieves a Supervision Identity with the supplied id
      parameters:
        - description: Supervision Identity identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: integer
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionIdentity'
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Supervision Identity with that id does not exist
      summary: |
        Retrieve a Supervision Identity with the supplied id
      tags:
        - supervision-identities-preview
      x-required-privileges:
        - Read Apple Configurator Enrollment
    put:
      description: Updates a Supervision Identity with the supplied information
      parameters:
        - description: Supervision Identity identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: integer
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisionIdentityUpdate'
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisionIdentity'
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Supervision Identity with that id does not exist
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Something went wrong
      summary: |
        Update a Supervision Identity with the supplied information
      tags:
        - supervision-identities-preview
      x-required-privileges:
        - Update Apple Configurator Enrollment
  /v1/supervision-identities/{id}/download:
    get:
      description: Download the Supervision Identity .p12 file
      parameters:
        - description: Supervision Identity identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: integer
          style: simple
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Not Found
      summary: |
        Download the Supervision Identity .p12 file
      tags:
        - supervision-identities-preview
      x-required-privileges:
        - Read Apple Configurator Enrollment
servers:
  - url: /api
