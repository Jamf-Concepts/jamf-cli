components:
  schemas:
    InventoryPreloadRecord:
      required:
      - deviceType
      - serialNumber
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        serialNumber:
          type: string
          example: C02L29ECF8J1
        deviceType:
          type: string
          example: Computer
          enum:
          - Computer
          - Mobile Device
          - Unknown
        username:
          type: string
          example: admin
        fullName:
          type: string
          example: Name
        emailAddress:
          type: string
          example: ITBob@jamf.com
        phoneNumber:
          type: string
          example: 555-555-5555
        position:
          type: string
          example: IT Team Lead
        department:
          type: string
          example: IT
        building:
          type: string
          example: Eau Claire
        room:
          type: string
          example: 4th Floor - Quad 3
        poNumber:
          type: string
          example: 8675309
        poDate:
          type: string
          example: 2019-02-04T21:09:31.661Z
        warrantyExpiration:
          type: string
          example: 2012-07-21
        appleCareId:
          type: string
          example: 5678
        lifeExpectancy:
          type: string
          example: 5 years
        purchasePrice:
          type: string
          example: $399
        purchasingContact:
          type: string
          example: Nick in IT
        purchasingAccount:
          type: string
          example: IT Budget
        leaseExpiration:
          type: string
          example: 2015-06-19
        barCode1:
          type: string
          example: 123456789
        barCode2:
          type: string
          example: 123456789
        assetTag:
          type: string
          example: ABCDEFG12345
        vendor:
          type: string
          example: Apple
        extensionAttributes:
          type: array
          items:
            $ref: 'DefinitionsLibrary.yaml#/components/schemas/InventoryPreloadExtensionAttribute'
    InventoryPreloadRecordSearchResults:
      type: object
      properties:
        totalCount:
          minimum: 0
          type: integer
          example: 10
        results:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPreloadRecord'
    InventoryPreloadCsvError:
      type: object
      properties:
        code:
          type: string
          example: SIZE_EXCEEDED
        description:
          type: string
          example: Field 'vendor' exceeds max size 60
        field:
          type: string
          example: vendor
        value:
          type: string
          example: abcdefghijklmnopqrstuwxyzabcdefghijklmnopqrstuwxyzabcdefghijklmnopqrstuwxyz
        serialNumber:
          type: string
          example: R7QFDE2YCFN4
        line:
          type: integer
          example: 5
        fieldSize:
          type: integer
          example: 60
        deviceType:
          type: string
          example: Computer

    InventoryPreloadInvalidCsvResponse:
      type: object
      properties:
        httpsStatus:
          type: integer
          example: 400
        errors:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPreloadCsvError'
