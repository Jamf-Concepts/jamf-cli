      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/pagesize'
      - name: sort
        in: query
        schema:
          type: string
          default: ASC
          enum:
          - ASC
          - DESC
      - name: sortBy
        in: query
        schema:
          type: string
          default: id
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryPreloadRecordSearchResults'
            text/csv:
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecordSearchResults'
      deprecated: true
      x-deprecation-date: 2020-01-01
      x-required-privileges:
      - Read Inventory Preload Records
