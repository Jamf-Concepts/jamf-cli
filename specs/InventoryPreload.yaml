openapi: 3.0.1
info:
  title: Jamf Pro API - Inventory Preload
  version: 1.0.1
paths:
  /v1/inventory-preload/csv-template:
    get:
      tags:
      - inventory-preload
      summary: |
         Retrieve the Inventory Preload CSV template
      description: Retrieves the Inventory Preload CSV template.
      responses:
        200:
          description: OK
          content:
            text/csv:
              schema:
                type: object
      deprecated: true
      x-deprecation-date: 2020-04-21
      x-required-privileges:
      - Read Inventory Preload Records
  /v1/inventory-preload:
    get:
      tags:
      - inventory-preload
      summary: |
         Return all Inventory Preload records
      description: Returns all Inventory Preload records.
      parameters:
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page'
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/size'
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/pagesize'
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page-size'
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property:asc/desc. Default sort
          is id:asc. Multiple sort criteria are supported and must be separated with
          a comma. Example: sort=date:desc,name:asc '
        schema:
          type: string
          default: id:asc
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecordSearchResults'
            text/csv:
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecordSearchResults'
      deprecated: true
      x-deprecation-date: 2020-04-22
      x-required-privileges:
      - Read Inventory Preload Records
    post:
      tags:
      - inventory-preload
      summary: |
        Create a new Inventory Preload record using JSON or CSV
      description: |
        Create a new Inventory Preload record using JSON or CSV.
        A CSV template can be downloaded from /api/inventory-preload/csv-template.
        Serial number and device type are required. All other fields are optional.
        When a matching serial number exists in the Inventory Preload data, the record will be overwritten with the CSV data.
        If the CSV file contains a new username and an email address is provided, the new user is created in Jamf Pro.
        If the CSV file contains an existing username, the following user-related fields are updated in Jamf Pro.
        Full Name,
        Email Address,
        Phone Number,
        Position.
        This endpoint does not do full validation of each record in the CSV data.
        To do full validation, use the /inventory-preload/validate-csv endpoint first.
      requestBody:
        description: Inventory Preload record or records to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryPreloadRecord'
          text/csv:
            schema:
              $ref: '#/components/schemas/InventoryPreloadRecord'
        required: true
      responses:
        201:
          description: Created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecord'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      deprecated: true
      x-deprecation-date: 2020-04-21
      x-required-privileges:
      - Create Inventory Preload Records
    delete:
      tags:
      - inventory-preload
      summary: |
         Delete all Inventory Preload records
      description: Deletes all Inventory Preload records.
      responses:
        204:
          description: OK
      deprecated: true
      x-deprecation-date: 2020-04-24
      x-required-privileges:
      - Delete Inventory Preload Records
  /v1/inventory-preload/{id}:
    get:
      tags:
      - inventory-preload
      summary: |
         Get an Inventory Preload record
      description: Retrieves an Inventory Preload record.
      parameters:
      - name: id
        in: path
        required: true
        description: Inventory Preload identifier
        schema:
          type: integer
      responses:
        200:
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecord'
        404:
          description: Inventory Preload record with specified id does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      deprecated: true
      x-deprecation-date: 2020-04-23
      x-required-privileges:
      - Read Inventory Preload Records
    put:
      tags:
      - inventory-preload
      summary: |
         Update an Inventory Preload record
      description: Updates an Inventory Preload record.
      parameters:
      - name: id
        in: path
        required: true
        description: Inventory Preload identifier
        schema:
          type: integer
      requestBody:
        description: Inventory Preload record to update
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/InventoryPreloadRecord'
        required: true
      responses:
        200:
          description: OK
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecord'
        404:
          description: Inventory Preload record with specified id does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      deprecated: true
      x-deprecation-date: 2020-04-23
      x-required-privileges:
      - Update Inventory Preload Records
    delete:
      tags:
      - inventory-preload
      summary: |
         Delete an Inventory Preload record
      description: Deletes an Inventory Preload record.
      parameters:
      - name: id
        in: path
        required: true
        description: Inventory Preload identifier
        schema:
          type: integer
      responses:
        204:
          description: OK
        404:
          description: Inventory Preload record with specified id does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      deprecated: true
      x-deprecation-date: 2020-04-24
      x-required-privileges:
      - Delete Inventory Preload Records
  /v1/inventory-preload/history:
    get:
      tags:
      - inventory-preload
      summary: |
         Get Inventory Preload history entries
      description: Gets Inventory Preload history entries.
      parameters:
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page'
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/size'
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/pagesize'
      - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page-size'
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property:asc/desc. Default sort
          is date:desc. Multiple sort criteria are supported and must be separated
          with a comma. Example: sort=date:desc,name:asc '
        schema:
          type: string
          default: date:desc
      responses:
        200:
          description: OK
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/HistorySearchResults'
      deprecated: true
      x-deprecation-date: 2020-04-24
      x-required-privileges:
      - Read Inventory Preload Records
    post:
      tags:
      - inventory-preload
      summary: |
         Add Inventory Preload history object notes
      description: Adds Inventory Preload history object notes.
      requestBody:
        description: History notes to create
        content:
          'application/json':
            schema:
              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ObjectHistoryNote'
        required: true
      responses:
        201:
          description: Notes of Inventory Preload history were added
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ObjectHistory'
        503:
          description: Inventory Preload history can not be saved
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      deprecated: true
      x-deprecation-date: 2020-04-24
      x-required-privileges:
      - Update Inventory Preload Records
  /v1/inventory-preload/validate-csv:
    post:
      tags:
      - inventory-preload
      summary: |
        Validate a given CSV file
      description: |
        Validate a given CSV file.
        Serial number and device type are required. All other fields are optional.
        A CSV template can be downloaded from /api/inventory-preload/csv-template.
      requestBody:
        description: Inventory Preload records to be validated. A CSV template can
          be downloaded from /api/inventory-preload/csv-template
        content:
          text/csv:
            schema:
              type: object
        required: true
      responses:
        200:
          description: Ok
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/InventoryPreloadCsvValidationSuccess'
        412:
          description: Precondition Failed
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/InventoryPreloadInvalidCsvResponse'
      deprecated: true
      x-deprecation-date: 2020-04-21
      x-required-privileges:
      - Create Inventory Preload Records
      x-action: true
  /inventory-preload/csv-template:
    get:
      tags:
      - inventory-preload
      summary: |
         Get the Inventory Preload CSV template
      description: Retrieves the Inventory Preload CSV template.
      responses:
