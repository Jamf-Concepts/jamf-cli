components:
  schemas:
    InventoryPreloadCsvError:
      properties:
        code:
          example: SIZE_EXCEEDED
          type: string
        description:
          example: Field 'vendor' exceeds max size 60
          type: string
        deviceType:
          example: Computer
          type: string
        field:
          example: vendor
          type: string
        fieldSize:
          example: 60
          type: integer
        line:
          example: 5
          type: integer
        serialNumber:
          example: R7QFDE2YCFN4
          type: string
        value:
          example: abcdefghijklmnopqrstuwxyzabcdefghijklmnopqrstuwxyzabcdefghijklmnopqrstuwxyz
          type: string
      type: object
    InventoryPreloadInvalidCsvResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/InventoryPreloadCsvError'
          type: array
        httpsStatus:
          example: 400
          type: integer
      type: object
    InventoryPreloadRecord:
      properties:
        appleCareId:
          example: "5678"
          type: string
        assetTag:
          example: ABCDEFG12345
          type: string
        barCode1:
          example: "123456789"
          type: string
        barCode2:
          example: "123456789"
          type: string
        building:
          example: Eau Claire
          type: string
        department:
          example: IT
          type: string
        deviceType:
          enum:
            - Computer
            - Mobile Device
            - Unknown
          example: Computer
          type: string
        emailAddress:
          example: ITBob@jamf.com
          type: string
        extensionAttributes:
          items:
            $ref: _MonolithLibrary.yaml#/components/schemas/InventoryPreloadExtensionAttribute
          type: array
        fullName:
          example: Name
          type: string
        id:
          example: 1
          readOnly: true
          type: integer
        leaseExpiration:
          example: "2015-06-19"
          type: string
        lifeExpectancy:
          example: 5 years
          type: string
        phoneNumber:
          example: 555-555-5555
          type: string
        poDate:
          example: "2019-02-04T21:09:31.661Z"
          type: string
        poNumber:
          example: "8675309"
          type: string
        position:
          example: IT Team Lead
          type: string
        purchasePrice:
          example: $399
          type: string
        purchasingAccount:
          example: IT Budget
          type: string
        purchasingContact:
          example: Nick in IT
          type: string
        room:
          example: 4th Floor - Quad 3
          type: string
        serialNumber:
          example: C02L29ECF8J1
          type: string
        username:
          example: admin
          type: string
        vendor:
          example: Apple
          type: string
        warrantyExpiration:
          example: "2012-07-21"
          type: string
      required:
        - deviceType
        - serialNumber
      type: object
    InventoryPreloadRecordSearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/InventoryPreloadRecord'
          type: array
        totalCount:
          example: 10
          minimum: 0
          type: integer
      type: object
info:
  title: Jamf Pro API - InventoryPreload
  version: 0.0.1
openapi: 3.0.1
paths:
  /inventory-preload:
    delete:
      deprecated: true
      description: Deletes all Inventory Preload records.
      responses:
        204:
          description: OK
      summary: |
        Delete all Inventory Preload records
      tags:
        - inventory-preload
      x-deprecation-date: "2020-01-01"
      x-required-privileges:
        - Delete Inventory Preload Records
    get:
      deprecated: true
      description: Returns all Inventory Preload records.
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/pagesize
        - explode: true
          in: query
          name: sort
          required: false
          schema:
            default: ASC
            enum:
              - ASC
              - DESC
            type: string
          style: form
        - explode: true
          in: query
          name: sortBy
          required: false
          schema:
            default: id
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/InventoryPreloadRecordSearchResults'
                type: array
            text/csv:
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecordSearchResults'
          description: OK
      summary: |
        Return all Inventory Preload records
      tags:
        - inventory-preload
      x-deprecation-date: "2020-01-01"
      x-required-privileges:
        - Read Inventory Preload Records
    post:
      deprecated: true
      description: |
        Create a new Inventory Preload record using JSON or CSV.
        A CSV template can be downloaded from /api/inventory-preload/csv-template.
        Serial number and device type are required. All other fields are optional.
        When a matching serial number exists in the Inventory Preload data, the record will be overwritten with the CSV data.
        If the CSV file contains a new username and an email address is provided, the new user is created in Jamf Pro.
        If the CSV file contains an existing username, the following user-related fields are updated in Jamf Pro.
        Full Name,
        Email Address,
        Phone Number,
        Position.
        This endpoint does not do full validation of each record in the CSV data.
        To do full validation, use the /inventory-preload/validate-csv endpoint first.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryPreloadRecord'
          text/csv:
            schema:
              $ref: '#/components/schemas/InventoryPreloadRecord'
        description: Inventory Preload record or records to be created
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPreloadRecord'
          description: Created
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
      summary: |
        Create a new Inventory Preload record using JSON or CSV
      tags:
        - inventory-preload
      x-deprecation-date: "2020-01-01"
      x-required-privileges:
        - Create Inventory Preload Records
  /inventory-preload/csv-template:
    get:
      deprecated: true
      description: Retrieves the Inventory Preload CSV template.
      responses:
        200:
          content:
            text/csv:
              schema:
                type: object
          description: OK
      summary: |
        Get the Inventory Preload CSV template
      tags:
        - inventory-preload
      x-deprecation-date: "2020-01-01"
      x-required-privileges:
        - Read Inventory Preload Records
