openapi: 3.0.1
info:
  title: Jamf Pro API - enrollment
  version: 0.0.1
paths:
  /v3/enrollment/languages:
    get:
      tags:
        - enrollment
      summary: |
        Get an array of the language codes that have Enrollment messaging
      description: Returns an array of the language codes that have enrollment messaging
        currently configured.
      parameters:
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page'
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page-size'
        - name: sort
          in: query
          description: |
            Sorting criteria in the format: property:asc/desc. Default sort
            is `languageCode:asc`. Multiple sort criteria are supported and must be separated
            with a comma. Example: `sort=date:desc,name:asc`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            default: [languageCode:asc]
      responses:
        200:
          description: Found languages matching search params.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ProcessTextsSearchResults'
      x-required-privileges:
        - Read User-Initiated Enrollment
  /v3/enrollment/languages/{languageId}:
    get:
      tags:
        - enrollment
      summary: |
        Retrieve the Enrollment messaging for a language
      description: Retrieves the enrollment messaging for a language.
      parameters:
        - name: languageId
          in: path
          description: Two letter ISO 639-1 Language Code
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/EnrollmentProcessTextObject'
        404:
          description: Language not found
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read User-Initiated Enrollment
    put:
      tags:
        - enrollment
      summary: |
        Edit Enrollment messaging for a language
      description: Edit enrollment messaging for a language.
      parameters:
        - name: languageId
          in: path
          description: Two letter ISO 639-1 Language Code
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/EnrollmentProcessTextObject'
        required: false
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/EnrollmentProcessTextObject'
        400:
          description: Bad request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update User-Initiated Enrollment
    delete:
      tags:
        - enrollment
      summary: |
        Delete the Enrollment messaging for a language
      description: Delete the enrollment messaging for a language.
      parameters:
        - name: languageId
          in: path
          description: Two letter ISO 639-1 Language Code
          required: true
          schema:
            type: string
      responses:
        204:
          description: Successful deletetion
        404:
          description: Language not found
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update User-Initiated Enrollment
  /v3/enrollment/languages/delete-multiple:
    post:
      tags:
        - enrollment
      summary: |
        Delete multiple configured languages from User-Initiated Enrollment settings
      description: Delete multiple configured languages from User-Initiated Enrollment settings
      requestBody:
        description: ids of each language to delete
        content:
          'application/json':
            schema:
              $ref: 'DefinitionsLibrary.yaml#/components/schemas/Ids'
        required: true
      responses:
        204:
          description: All languages ids passed in request sucessfully deleted.
        400:
          description: 'Request processed.  Returns ids and error codes of any language
                      unable to be deleted.  Expected error codes: INVALID_ID - id does not
                      exist SYSTEM_EXCEPTION - a system exception occurred trying to delete
                      the language.'
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update User-Initiated Enrollment
      x-action: true
  /v3/enrollment/language-codes:
    get:
      tags:
        - enrollment
      summary: |
        Retrieve the list of languages and corresponding ISO 639-1 Codes
      description: Retrieves the list of languages and corresponding ISO 639-1 Codes.
      responses:
        200:
          description: List of languages and corresponding ISO 639-1 Codes.
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LanguageCode'
      x-required-privileges:
        - Read User-Initiated Enrollment
  /v3/enrollment/filtered-language-codes:
    get:
      tags:
        - enrollment
      summary: |
        Retrieve the list of languages and corresponding ISO 639-1 Codes but only those not already added to Enrollment
      description: Retrieves the list of languages and corresponding ISO 639-1 Codes,
        but only those not already added to Enrollment.
      responses:
        200:
          description: Retrieves the list of languages and corresponding ISO 639-1
            Codes, but only those not already added to Enrollment.
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LanguageCode'
      x-required-privileges:
        - Read User-Initiated Enrollment
components:
  schemas:
    LanguageCode:
      type: object
      properties:
        value:
          type: string
          example: en
        name:
          type: string
          example: English
    ProcessTextsSearchResults:
      type: object
      properties:
        totalCount:
          minimum: 0
          type: integer
          example: 10
        results:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentProcessTextObject'
    EnrollmentProcessTextObject:
      type: object
      properties:
        languageCode:
          type: string
          example: en
        name:
          type: string
          example: English
        title:
          type: string
          example: Enroll Your Device
        loginDescription:
          type: string
          example: Log in to enroll your device.
        username:
          type: string
          example: admin
        password:
          type: string
          example: 12345
        loginButton:
          type: string
          example: Log in
        deviceClassDescription:
          type: string
          example: Specify if this device is institutionally owned or personally owned.
        deviceClassPersonal:
          type: string
          example: Personally Owned
        deviceClassPersonalDescription:
          type: string
          example: |
            For personally owned devices, IT administrators **can**

                     *   Lock the device
                     *   Apply institutional settings
                     *   Install and remove institutional data
                     *   Install and remove institutional apps


                     For personally owned devices, IT administrators **cannot**

                     *   Wipe all data and settings from your device
                     *   Track the location of your device
                     *   Remove anything they did not install
                     *   Add/remove configuration profiles
                     *   Add/remove provisioning profiles
        deviceClassEnterprise:
          type: string
          example: Institutionally Owned
        deviceClassEnterpriseDescription:
          type: string
          example: |
            For institutionally owned devices, IT administrators **can**

                     *   Wipe all data and settings from the device
                     *   Lock the device
                     *   Remove the passcode
                     *   Apply institutional settings
                     *   Install and remove institutional data
                     *   Install and remove institutional apps
                     *   Add/remove configuration profiles
                     *   Add/remove provisioning profiles

                     For institutionally owned devices, IT administrators **cannot**:

                     *   Remove anything they did not install
        deviceClassButton:
          type: string
          example: Enroll
        personalEula:
          type: string
          example: Personal Eula
        enterpriseEula:
          type: string
          example: Enterprise Eula
        eulaButton:
          type: string
          example: Accept
        siteDescription:
          type: string
          example: Select the site to use for enrolling this computer or mobile device.
        certificateText:
          type: string
          example: To continue with enrollment, you need to install the CA certificate for your organization.
        certificateButton:
          type: string
          example: Continue
        certificateProfileName:
          type: string
          example: CA Certificate
        certificateProfileDescription:
          type: string
          example: CA Certificate for mobile device management
        personalText:
          type: string
          default: ""
          readOnly: true
          deprecated: true
          description: >
            **Deprecated as of 11.25.** This field always returns empty string in GET responses
            and ignores any input values in PUT requests.
        personalButton:
          type: string
          default: ""
          readOnly: true
          deprecated: true
          description: >
            **Deprecated as of 11.25.** This field always returns empty string in GET responses
            and ignores any input values in PUT requests.
        personalProfileName:
          type: string
          default: ""
          readOnly: true
          deprecated: true
          description: >
            **Deprecated as of 11.25.** This field always returns empty string in GET responses
            and ignores any input values in PUT requests.
        personalProfileDescription:
          type: string
          default: ""
          readOnly: true
          deprecated: true
          description: >
            **Deprecated as of 11.25.** This field always returns empty string in GET responses
            and ignores any input values in PUT requests.
        userEnrollmentText:
          type: string
          default: Enter your Managed Apple id to install the MDM Profile.
        userEnrollmentButton:
          type: string
          default: Continue
        userEnrollmentProfileName:
          type: string
          default: MDM Profile
        userEnrollmentProfileDescription:
          type: string
          default: MDM Profile for mobile device management
        enterpriseText:
          type: string
          example: To continue with enrollment, you need to install the MDM profile for your organization.
        enterpriseButton:
          type: string
          example: Continue
        enterpriseProfileName:
          type: string
          example: MDM Profile
        enterpriseProfileDescription:
          type: string
          example: MDM Profile for mobile device management
        enterprisePending:
          type: string
          example: To continue with enrollment, install the CA Certificate and MDM Profile that were downloaded to your computer.
        quickAddText:
          type: string
          example: Download and install this package.
        quickAddButton:
          type: string
          example: Download
        quickAddName:
          type: string
          default: QuickAdd.pkg
        quickAddPending:
          type: string
          example: Install the downloaded QuickAdd.pkg.
        completeMessage:
          type: string
          example: The enrollment process is complete.
        failedMessage:
          type: string
          example: The enrollment process could not be completed. Contact your IT administrator.
        tryAgainButton:
          type: string
          example: Try Again
        checkNowButton:
          type: string
          example: Proceed
        checkEnrollmentMessage:
          type: string
          example: Tap "Proceed" to view the enrollment status for this device.
        logoutButton:
          type: string
          example: Log Out
