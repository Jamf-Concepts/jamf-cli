          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Enrollment Customization with that id does not exist
      summary: |
        Get a single Panel for a single Enrollment Customization
      tags:
