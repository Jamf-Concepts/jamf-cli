      - Read Enrollment Customizations
    put:
      tags:
      - enrollment-customization-preview
      summary: |
         Update a single LDAP Panel for a single Enrollment Customization
      description: Update a single LDAP panel for a single enrollment customization.
        If multiple LDAP access groups are defined with the same name and id, only
        one will be saved.
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      - name: panel-id
        in: path
        required: true
        description: Panel object identifier
        schema:
          type: integer
      requestBody:
        description: Enrollment Customization Panel to update
        content:
