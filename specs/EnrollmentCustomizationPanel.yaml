components:
  schemas:
    Markdown:
      type: object
      properties:
        markdown:
          type: string
          example: '**markdown**'
    EnrollmentCustomizationPanelList:
      type: object
      properties:
        panels:
          type: array
          items:
            $ref: '#/components/schemas/GetEnrollmentCustomizationPanel'
    EnrollmentCustomizationPanel:
      required:
      - rank
      - displayName
      type: object
      properties:
        displayName:
          type: string
          example: A Panel
        rank:
          type: integer
          example: 0
    GetEnrollmentCustomizationPanel:
      allOf:
      - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
      - type: object
        properties:
          id:
            type: integer
            example: 2
          type:
            type: string
            example: text
    EnrollmentCustomizationPanelText:
      allOf:
      - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
      - required:
        - backButtonText
        - body
        - continueButtonText
        - title
        type: object
        properties:
          body:
            type: string
            example: Welcome!
          subtext:
            type: string
            example: World!
          title:
            type: string
            example: My text panel
          backButtonText:
            type: string
            example: Back
          continueButtonText:
            type: string
            example: Continue
    GetEnrollmentCustomizationPanelText:
      allOf:
      - $ref: '#/components/schemas/EnrollmentCustomizationPanelText'
      - type: object
        properties:
          id:
            type: integer
            example: 2
          type:
            type: string
            example: text
    EnrollmentCustomizationPanelSsoAuth:
      allOf:
      - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
      - required:
        - groupEnrollmentAccessName
        - isGroupEnrollmentAccessEnabled
        - isUseJamfConnect
        - longNameAttribute
        - shortNameAttribute
        type: object
        properties:
          isUseJamfConnect:
            type: boolean
            example: false
          longNameAttribute:
            type: string
            example: long name
          shortNameAttribute:
            type: string
            example: name
          isGroupEnrollmentAccessEnabled:
            type: boolean
            example: false
          groupEnrollmentAccessName:
            type: string
            example: GroupNameA
            default: ""
    GetEnrollmentCustomizationPanelSsoAuth:
      allOf:
      - $ref: '#/components/schemas/EnrollmentCustomizationPanelSsoAuth'
      - type: object
        properties:
          id:
            type: integer
            example: 2
          type:
            type: string
            example: sso
    EnrollmentCustomizationLdapGroupAccess:
      type: object
      properties:
        ldapServerId:
          type: integer
          example: 1
        groupName:
          type: string
          example: admins
    EnrollmentCustomizationPanelLdapAuth:
      allOf:
      - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
      - required:
        - backButtonText
        - continueButtonText
        - passwordLabel
        - usernameLabel
        - title
        type: object
        properties:
          usernameLabel:
            type: string
            example: Username
          passwordLabel:
            type: string
            example: Password
          title:
            type: string
            pattern: '\S' # Matches a non-empty string
            example: My Ldap Panel
          backButtonText:
            type: string
            example: Back
          continueButtonText:
            type: string
            example: Continue
          ldapGroupAccess:
            type: array
            items:
              $ref: '#/components/schemas/EnrollmentCustomizationLdapGroupAccess'
    GetEnrollmentCustomizationPanelLdapAuth:
      allOf:
      - $ref: '#/components/schemas/EnrollmentCustomizationPanelLdapAuth'
      - type: object
        properties:
          id:
            type: integer
            example: 2
          type:
            type: string
            example: ldap
