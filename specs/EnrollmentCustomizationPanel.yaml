          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Enrollment Customization with that id does not exist
      summary: |
        Get all Panels for single Enrollment Customization
      tags:
        - enrollment-customization-preview
      x-required-privileges:
        - Read Enrollment Customizations
