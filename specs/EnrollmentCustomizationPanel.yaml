  /v1/enrollment-customization/{id}/ldap:
    post:
      tags:
      - enrollment-customization-preview
      summary: |
         Create an LDAP Panel for a single Enrollment Customization
      description: Create an LDAP panel for a single enrollment customization. If
        multiple LDAP access groups are defined with the same name and id, only one
        will be saved.
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      requestBody:
        description: Enrollment Customization Panel to create
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/EnrollmentCustomizationPanelLdapAuth'
        required: true
      responses:
        201:
          description: LDAP panel was created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GetEnrollmentCustomizationPanelLdapAuth'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
      - Update Enrollment Customizations
