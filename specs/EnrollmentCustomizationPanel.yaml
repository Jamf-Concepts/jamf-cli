components:
  schemas:
    EnrollmentCustomizationLdapGroupAccess:
      properties:
        groupName:
          example: admins
          type: string
        ldapServerId:
          example: 1
          type: integer
      type: object
    EnrollmentCustomizationPanel:
      properties:
        displayName:
          example: A Panel
          type: string
        rank:
          example: 0
          type: integer
      required:
        - displayName
        - rank
      type: object
    EnrollmentCustomizationPanelLdapAuth:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
        - properties:
            backButtonText:
              example: Back
              type: string
            continueButtonText:
              example: Continue
              type: string
            ldapGroupAccess:
              items:
                $ref: '#/components/schemas/EnrollmentCustomizationLdapGroupAccess'
              type: array
            passwordLabel:
              example: Password
              type: string
            title:
              example: My Ldap Panel
              pattern: \S
              type: string
            usernameLabel:
              example: Username
              type: string
          required:
            - backButtonText
            - continueButtonText
            - passwordLabel
            - title
            - usernameLabel
          type: object
    EnrollmentCustomizationPanelList:
      properties:
        panels:
          items:
            $ref: '#/components/schemas/GetEnrollmentCustomizationPanel'
          type: array
      type: object
    EnrollmentCustomizationPanelSsoAuth:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
        - properties:
            groupEnrollmentAccessName:
              default: ""
              example: GroupNameA
              type: string
            isGroupEnrollmentAccessEnabled:
              example: false
              type: boolean
            isUseJamfConnect:
              example: false
              type: boolean
            longNameAttribute:
              example: long name
              type: string
            shortNameAttribute:
              example: name
              type: string
          required:
            - groupEnrollmentAccessName
            - isGroupEnrollmentAccessEnabled
            - isUseJamfConnect
            - longNameAttribute
            - shortNameAttribute
          type: object
    EnrollmentCustomizationPanelText:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
        - properties:
            backButtonText:
              example: Back
              type: string
            body:
              example: Welcome!
              type: string
            continueButtonText:
              example: Continue
              type: string
            subtext:
              example: World!
              type: string
            title:
              example: My text panel
              type: string
          required:
            - backButtonText
            - body
            - continueButtonText
            - title
          type: object
    GetEnrollmentCustomizationPanel:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCustomizationPanel'
        - properties:
            id:
              example: 2
              type: integer
            type:
              example: text
              type: string
          type: object
    GetEnrollmentCustomizationPanelLdapAuth:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCustomizationPanelLdapAuth'
        - properties:
            id:
              example: 2
              type: integer
            type:
              example: ldap
              type: string
          type: object
    GetEnrollmentCustomizationPanelSsoAuth:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCustomizationPanelSsoAuth'
        - properties:
            id:
              example: 2
              type: integer
            type:
              example: sso
              type: string
          type: object
    GetEnrollmentCustomizationPanelText:
      allOf:
        - $ref: '#/components/schemas/EnrollmentCustomizationPanelText'
        - properties:
            id:
              example: 2
              type: integer
            type:
              example: text
              type: string
          type: object
    Markdown:
      properties:
        markdown:
          example: '**markdown**'
          type: string
      type: object
info:
  title: Jamf Pro API - EnrollmentCustomizationPanel
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/enrollment-customization/parse-markdown:
    post:
      description: Parse the given string as markdown text and return Html output
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Markdown'
        description: Enrollment Customization Panel to create
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Markdown'
          description: Success
      summary: |
        Parse the given string as markdown text and return Html output
      tags:
        - enrollment-customization-preview
      x-required-privileges:
        - Read Enrollment Customizations
  /v1/enrollment-customization/{id}/all:
    get:
