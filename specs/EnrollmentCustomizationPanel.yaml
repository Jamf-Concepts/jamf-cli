openapi: 3.0.1
info:
  title: Jamf Pro API - Enrollment Customization Panel
  version: 0.0.1
paths:
  /v1/enrollment-customization/parse-markdown:
    post:
      tags:
      - enrollment-customization-preview
      summary: |
         Parse the given string as markdown text and return Html output
      description: Parse the given string as markdown text and return Html output
      requestBody:
        description: Enrollment Customization Panel to create
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/Markdown'
        required: true
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/Markdown'
      x-required-privileges:
      - Read Enrollment Customizations
  /v1/enrollment-customization/{id}/all:
    get:
      tags:
      - enrollment-customization-preview
      summary: |
         Get all Panels for single Enrollment Customization
      description: Get all panels for single enrollment customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/EnrollmentCustomizationPanelList'
        404:
          description: Enrollment Customization with that id does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
      - Read Enrollment Customizations
  /v1/enrollment-customization/{id}/all/{panel-id}:
    get:
      tags:
      - enrollment-customization-preview
      summary: |
         Get a single Panel for a single Enrollment Customization
      description: Get a single panel for a single enrollment customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      - name: panel-id
        in: path
        required: true
        description: Panel object identifier
        schema:
          type: integer
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GetEnrollmentCustomizationPanel'
        404:
          description: Enrollment Customization with that id does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
      - Read Enrollment Customizations
    delete:
      tags:
      - enrollment-customization-preview
      summary: |
         Delete a single Panel from an Enrollment Customization
      description: Delete a single panel from an Enrollment Customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      - name: panel-id
        in: path
        required: true
        description: Panel object identifier
        schema:
          type: integer
      responses:
        204:
          description: Success
      x-required-privileges:
      - Update Enrollment Customizations
  /v1/enrollment-customization/{id}/text:
    post:
      tags:
      - enrollment-customization-preview
      summary: |
         Create a Text Panel for a single Enrollment Customization
      description: Create a Text panel for a single enrollment customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      requestBody:
        description: Enrollment Customization Panel to create
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/EnrollmentCustomizationPanelText'
        required: true
      responses:
        201:
          description: Text panel was created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GetEnrollmentCustomizationPanelText'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
      - Update Enrollment Customizations
  /v1/enrollment-customization/{id}/text/{panel-id}:
    get:
      tags:
      - enrollment-customization-preview
      summary: |
         Get a single Text Panel for a single Enrollment Customization
      description: Get a single Text panel for a single enrollment customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      - name: panel-id
        in: path
        required: true
        description: Panel object identifier
        schema:
          type: integer
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GetEnrollmentCustomizationPanelText'
        404:
          description: Enrollment Customization with that id does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
      - Read Enrollment Customizations
    put:
      tags:
      - enrollment-customization-preview
      summary: |
         Update a single Text Panel for a single Enrollment Customization
      description: Update a single Text panel for a single enrollment customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      - name: panel-id
        in: path
        required: true
        description: Panel object identifier
        schema:
          type: integer
      requestBody:
        description: Enrollment Customization Panel to update
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/EnrollmentCustomizationPanelText'
        required: true
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GetEnrollmentCustomizationPanelText'
        404:
          description: Enrollment Customization or Panel does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
      - Update Enrollment Customizations
    delete:
      tags:
      - enrollment-customization-preview
      summary: |
         Delete a Text single Panel from an Enrollment Customization
      description: Delete a Text single panel from an Enrollment Customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      - name: panel-id
        in: path
        required: true
        description: Panel object identifier
        schema:
          type: integer
      responses:
        204:
          description: Success
      x-required-privileges:
      - Update Enrollment Customizations
  /v1/enrollment-customization/{id}/text/{panel-id}/markdown:
    get:
      tags:
      - enrollment-customization-preview
      summary: |
         Get the markdown output of a single Text Panel for a single Enrollment
      description: Get the markdown output of a single Text panel for a single enrollment
        customization
      parameters:
      - name: id
        in: path
        required: true
        description: Enrollment Customization identifier
        schema:
          type: integer
      - name: panel-id
        in: path
        required: true
        description: Panel object identifier
        schema:
          type: integer
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/Markdown'
        404:
          description: Enrollment Customization with that id does not exist
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
      - Read Enrollment Customizations
