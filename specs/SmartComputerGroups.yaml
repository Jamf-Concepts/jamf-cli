components:
  schemas:
    ComputerSmartGroupCriteriaV2:
      properties:
        andOr:
          description: Whether this criterion should be ANDed or ORed with the previous criterion. Must be exactly "AND" or "OR" (case-insensitive input accepted, stored as lowercase).
          enum:
            - and
            - or
          example: and
          type: string
        closingParen:
          description: Whether to add a closing parenthesis after this criterion
          example: false
          type: boolean
        name:
          description: The field to search on (e.g., Operating System Version, Computer Name, etc.)
          example: Model
          maxLength: 255
          type: string
        openingParen:
          description: Whether to add an opening parenthesis before this criterion
          example: false
          type: boolean
        priority:
          description: The priority order of this criterion (must start at 0 and increment by 1 per new criteria)
          example: 0
          type: integer
        searchType:
          description: The type of search to perform (e.g., is, is not, like, greater than or equal, etc.)
          example: greater than or equal
          type: string
        value:
          description: The value to search for
          example: "14.0"
          maxLength: 255
          type: string
      required:
        - andOr
        - name
        - priority
        - searchType
        - value
      type: object
    SmartComputerGroupSearch:
      properties:
        description:
          example: My computer group description
          minLength: 0
          type: string
        id:
          example: "1"
          minLength: 1
          readOnly: true
          type: string
        membershipCount:
          example: 231
          type: integer
        name:
          example: My computer group
          minLength: 1
          type: string
        siteId:
          example: "1"
          minLength: 1
          readOnly: true
          type: string
      type: object
    SmartComputerGroupV2:
      properties:
        criteria:
          items:
            $ref: _MonolithLibrary.yaml#/components/schemas/SmartSearchCriterion
          type: array
        description:
          example: New Group Description
          type: string
        name:
          example: New Group Name
          type: string
        siteId:
          example: "-1"
          nullable: true
          type: string
      required:
        - name
      type: object
    SmartComputerGroupV3:
      properties:
        criteria:
          items:
            $ref: '#/components/schemas/ComputerSmartGroupCriteriaV2'
          type: array
        description:
          example: New Group Description
          type: string
        name:
          example: New Group Name
          maxLength: 255
          type: string
        siteId:
          example: "-1"
          nullable: true
          type: string
      required:
        - name
      type: object
    SmartGroupMembership:
      description: the ids of the computers that are members of the smart group
      properties:
        members:
          example:
            - 1
            - 2
            - 3
          items:
            type: integer
          minLength: 0
          type: array
      type: object
    SmartGroupSearchResult:
      properties:
        results:
          items:
            $ref: '#/components/schemas/SmartComputerGroupSearch'
          minItems: 0
          type: array
        totalCount:
          example: 3
          minimum: 0
          type: integer
      type: object
