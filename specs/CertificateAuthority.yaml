openapi: 3.0.1
info:
  title: Jamf Pro API - Certificate Authority
  version: 0.0.1
paths:
  /v1/pki/certificate-authority/active:
    get:
      tags:
        - certificate-authority
      summary:
        Returns X.509 details of the active Certificate Authority (CA)
      description:
        Returns X.509 details of the active Certificate Authority (CA)
      responses:
        200:
          description: Successful response displays the details of the active Certificate Authority (CA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRecord'
      x-authentication-required: false
  /v1/pki/certificate-authority/active/pem:
    get:
      tags:
        - certificate-authority
      summary:
        Returns active Certificate Authority (CA) in PEM format
      description:
        Returns active Certificate Authority (CA) in PEM format
      responses:
        200:
          description: Successful response returns certificate in PEM format.
          content:
            application/pem-certificate-chain:
              schema:
                type: string
                format: binary
      x-authentication-required: false
  /v1/pki/certificate-authority/active/der:
    get:
      tags:
        - certificate-authority
      summary:
        Returns X.509 of active Certificate Authority (CA) in DER format
      description:
        Returns X.509 of active Certificate Authority (CA) in DER format
      responses:
        200:
          description: Successful response returns certificate in DER format
          content:
            application/pkix-cert:
              schema:
                type: string
                format: binary
      x-authentication-required: false
  /v1/pki/certificate-authority/{id}:
    get:
      tags:
        - certificate-authority
      summary:
        Returns X.509 details of Certificate Authority (CA) with provided ID
      description:
        Returns X.509 details of Certificate Authority (CA) with provided ID
      parameters:
        - name: id
          in: path
          description: UUID of the Certificate Authority (CA)
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful response displays the details of the Certificate Authority (CA) with provided ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRecord'
        400:
          description: Invalid ID parameter
          content:
            application/json:
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        404:
          description: Certificate with that ID does not exist
          content:
            application/json:
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read PKI
  /v1/pki/certificate-authority/{id}/pem:
    get:
      tags:
        - certificate-authority
      summary:
        Returns current Certificate Authority (CA) with provided ID in PEM format
      description:
        Returns current Certificate Authority (CA) with provided ID in PEM format
      parameters:
        - name: id
          in: path
          description: UUID of the Certificate Authority (CA)
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful response returns certificate in PEM format
          content:
            application/pem-certificate-chain:
              schema:
                type: string
                format: binary
        400:
          description: Invalid ID parameter
          content:
            application/json:
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        404:
          description: Certificate with that ID does not exist
          content:
           application/json:
              schema:
               $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read PKI
  /v1/pki/certificate-authority/{id}/der:
    get:
      tags:
        - certificate-authority
      summary:
        Returns X.509 current Certificate Authority (CA) with provided ID in DER format
      description:
        Returns X.509 current Certificate Authority (CA) with provided ID in DER format
      parameters:
        - name: id
          in: path
          description: UUID of the Certificate Authority (CA)
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful response returns certificate in DER format
          content:
            application/pkix-cert:
              schema:
                type: string
                format: binary
        400:
          description: Invalid ID parameter
          content:
            application/json:
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        404:
          description: Certificate with that ID does not exist
          content:
            application/json:
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read PKI
components:
  schemas:
    Signature:
      type: object
      properties:
        algorithm:
          type: string
          example: SHA256withRSA
        algorithmOid:
          type: string
          example: 1.2.840.113549.1.1.11
        value:
          type: string
          example: 
    CertificateRecord:
      type: object
      properties:
        subjectX500Principal:
          type: string
          example: CN=Jamf JSS Built-in Certificate Authority
        issuerX500Principal:
          type: string
          example: CN=Jamf JSS Built-in Certificate Authority
        serialNumber:
          type: string
          example: 00bc43bea0
        version:
          type: integer
          example: 3
        notAfter:
          type: integer
          example: 1927739379
        notBefore:
          type: integer
          example: 1612120179
        signature:
          $ref: '#/components/schemas/Signature'
        keyUsage:
          type: array
          items:
            type: string
          example:
            - digitalSignature
            - keyEncipherment
            - keyCertSign
            - cRLSign
        keyUsageExtended:
          type: array
          items:
            type: string
          example:
            - 1.3.6.1.5.5.7.3.1
        sha1Fingerprint:
          type: string
          example: 448a7cc4d899d6a1821258133c24c023a5f558d9
        sha256Fingerprint:
          type: string
          example: 660958e14891c67491822687d9ac0e3574562664458111ad875b680995ca472b
