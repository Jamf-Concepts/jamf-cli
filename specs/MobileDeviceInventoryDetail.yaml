        lastInstalled:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        removable:
          example: true
          type: boolean
        username:
          example: admin
          type: string
        uuid:
          example: D29DD9FB-0D5B-422F-A3A2-ABBC5848E949
