components:
  schemas:
    EnrollmentMethodPrestage:
      properties:
        mobileDevicePrestageId:
          example: "5"
          type: string
        profileName:
          example: All Mobiles
          type: string
      type: object
    MobileDeviceApplicationInventoryDetail:
      properties:
        appClip:
          example: false
          type: boolean
        bundleSize:
          example: "1024"
          type: string
        dynamicSize:
          example: "1423"
          type: string
        identifier:
          example: com.apple.airport.mobileairportutility
          type: string
        managementStatus:
          example: Managed
          type: string
        name:
          example: AirPort Utility
          type: string
        shortVersion:
          example: "7.0"
          type: string
        validationStatus:
          example: true
          type: boolean
        version:
          example: "135.24"
          type: string
      type: object
    MobileDeviceCertificate:
      properties:
        commonName:
          example: 3B259E4B-FAD5-4860-B1DD-336ADA786EBA
          type: string
        expirationDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        identity:
          example: false
          type: boolean
      type: object
    MobileDeviceEbookInventoryDetail:
      properties:
        author:
          example: Homer J Simpson
          type: string
        kind:
          example: PDF
          type: string
        managementState:
          example: Managed
          type: string
        title:
          example: The Odyssey
          type: string
        version:
          example: "0.1"
          type: string
      type: object
    MobileDeviceExtensionAttribute:
      properties:
        extensionAttributeCollectionAllowed:
          example: false
          type: boolean
        id:
          example: "1"
          readOnly: true
          type: string
        inventoryDisplay:
          example: General
          type: string
        name:
          example: Example EA
          type: string
        type:
          enum:
            - STRING
            - INTEGER
            - DATE
          example: STRING
          type: string
        value:
          items:
            example: EA Value
            type: string
          type: array
      type: object
    MobileDeviceGeneral:
      properties:
        assetTag:
          example: "8675309"
          type: string
        declarativeDeviceManagementEnabled:
          example: true
          type: boolean
        deviceOwnershipType:
          description: |
            The enrollment method used for the device. **Note:** The `PersonalDeviceProfile` enrollment method was removed as of 11.25.
          enum:
            - Institutional
            - UserEnrollment
            - AccountDrivenUserEnrollment
            - AccountDrivenDeviceEnrollment
          example: Institutional
          type: string
        displayName:
          example: Banezicron
          type: string
        enrollmentMethodPrestage:
          $ref: '#/components/schemas/EnrollmentMethodPrestage'
        enrollmentSessionTokenValid:
          example: false
          type: boolean
        extensionAttributes:
          items:
            $ref: '#/components/schemas/MobileDeviceExtensionAttribute'
          type: array
        ipAddress:
          example: 10.0.0.1
          type: string
        lastContactDate:
          description: The date and time of the most recent device contact via MDM or DDM channels.
          example: "2022-10-17T11:48:56.307Z"
          format: date-time
          type: string
        lastEnrolledDate:
          example: "2022-10-17T11:48:56.307Z"
          format: date-time
          type: string
        lastInventoryUpdateDate:
          example: "2022-10-17T11:48:56.307Z"
          format: date-time
          type: string
        lastLoggedInUsernameMdm:
          example: admin
          nullable: true
          type: string
        lastLoggedInUsernameMdmTimestamp:
          example: "2018-10-31T18:04:13Z"
          format: date-time
          nullable: true
          type: string
        lastLoggedInUsernameSelfService:
          example: admin
          nullable: true
          type: string
        lastLoggedInUsernameSelfServiceTimestamp:
          example: "2018-10-31T18:04:13Z"
          format: date-time
          nullable: true
          type: string
        managed:
          example: true
          type: boolean
        managementId:
          example: 9932fad3-29e9-4b71-bc7c-77dcefce819d
          type: string
        mdmProfileExpirationDate:
          example: "2022-10-17T11:48:56.307Z"
          format: date-time
          type: string
        osBuild:
          example: 15F79
          type: string
        osRapidSecurityResponse:
          example: (a)
          type: string
        osSupplementalBuildVersion:
          example: 22A103310o
          type: string
        osVersion:
          example: "11.4"
          type: string
        siteId:
          example: "-1"
          type: string
        softwareUpdateDeviceId:
          example: J132AP
          type: string
        supervised:
          example: true
          type: boolean
        timeZone:
          description: IANA time zone database name
          example: Europe/Warsaw
          type: string
        udid:
          example: 0dad565fb40b010a9e490440188063a378721069
          type: string
      type: object
    MobileDeviceHardware:
      properties:
        availableSpaceMb:
          example: 30
          type: integer
        batteryHealth:
          default: UNKNOWN
          description: |
            - NON_GENUINE: The battery isn’t a genuine Apple battery.
            - NORMAL: The battery is operating normally.
            - SERVICE_RECOMMENDED: The system recommends battery service.
            - UNKNOWN: The system couldn’t determine battery health information.
            - UNSUPPORTED: The device doesn’t support battery health reporting.
          enum:
            - NON_GENUINE
            - NORMAL
            - SERVICE_RECOMMENDED
            - UNKNOWN
            - UNSUPPORTED
          type: string
        batteryLevel:
          example: 60
          type: integer
        bluetoothLowEnergyCapable:
          example: false
          type: boolean
        bluetoothMacAddress:
          example: ee:00:7c:f0:e5:aa
          type: string
        capacityMb:
          example: 100
          type: integer
        deviceId:
          example: c6a49c6d-8c09-4d71-a37d-2f6a9dfbb69b
          type: string
        extensionAttributes:
          items:
            $ref: '#/components/schemas/MobileDeviceExtensionAttribute'
          type: array
        model:
          example: iPad 7th Generation (Wi-Fi)
          type: string
        modelIdentifier:
          example: iPad7,11
          type: string
        modelNumber:
          example: MW742LL
          type: string
        modemFirmwareVersion:
          example: iPad7,11
          type: string
        serialNumber:
          example: 5c28fdae
          type: string
        usedSpacePercentage:
          example: 70
          type: integer
        wifiMacAddress:
          example: ee:00:7c:f0:e5:ff
          type: string
      type: object
    MobileDeviceInventory:
      properties:
        applications:
          items:
            $ref: '#/components/schemas/MobileDeviceApplicationInventoryDetail'
          type: array
        certificates:
          items:
            $ref: '#/components/schemas/MobileDeviceCertificate'
          type: array
        deviceType:
          description: Based on the value of this type either ios, appleTv, watch or visionOS objects will be populated.
          example: iOS
          type: string
        extensionAttributes:
          items:
            $ref: '#/components/schemas/MobileDeviceExtensionAttribute'
          type: array
        groups:
          items:
            $ref: _MonolithLibrary.yaml#/components/schemas/MobileDeviceInventoryGroup
          type: array
        hardware:
          $ref: '#/components/schemas/MobileDeviceHardware'
        mobileDeviceId:
          example: "1"
          minLength: 1
          readOnly: true
          type: string
        profiles:
          items:
            $ref: '#/components/schemas/MobileDeviceProfile'
          type: array
        userAndLocation:
          $ref: '#/components/schemas/MobileDeviceUserAndLocation'
      required:
        - deviceType
      type: object
    MobileDeviceInventorySearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/MobileDeviceResponse'
          type: array
        totalCount:
          example: 2
          nullable: false
          type: integer
      type: object
    MobileDeviceIosGeneral:
      allOf:
        - $ref: '#/components/schemas/MobileDeviceGeneral'
        - properties:
            appAnalyticsEnabled:
              example: false
              type: boolean
            cloudBackupEnabled:
              example: false
              type: boolean
            deviceLocatorServiceEnabled:
              example: false
              type: boolean
            diagnosticAndUsageReportingEnabled:
              example: false
              type: boolean
            doNotDisturbEnabled:
              example: false
              type: boolean
            exchangeDeviceId:
              example: eas-1
              type: string
            itunesStoreAccountActive:
              example: false
              type: boolean
            lastBackupDate:
              example: "2022-10-17T11:48:56.307Z"
              format: date-time
              type: string
            lastCloudBackupDate:
              example: "2022-10-17T11:48:56.307Z"
              format: date-time
              type: string
            locationServicesForSelfServiceMobileEnabled:
              example: false
              type: boolean
            maximumSharediPadUsersStored:
              example: 16
              type: integer
            quotaSize:
              example: 1024
              type: integer
            residentUsers:
              example: 0
              type: integer
            sharedIpad:
              example: false
              type: boolean
            syncedToComputer:
              example: 30
              type: integer
            temporarySessionOnly:
              example: false
              type: boolean
            temporarySessionTimeout:
              example: 30
              type: integer
            tethered:
              example: false
              type: boolean
            userSessionTimeout:
              example: 30
              type: integer
          type: object
    MobileDeviceIosInventory:
      allOf:
        - $ref: '#/components/schemas/MobileDeviceInventory'
        - properties:
            ebooks:
              items:
                $ref: '#/components/schemas/MobileDeviceEbookInventoryDetail'
              type: array
            general:
              $ref: '#/components/schemas/MobileDeviceIosGeneral'
            network:
              $ref: '#/components/schemas/MobileDeviceNetwork'
            provisioningProfiles:
              items:
                $ref: _MonolithLibrary.yaml#/components/schemas/MobileDeviceProvisioningProfiles
              type: array
            purchasing:
              $ref: '#/components/schemas/MobileDevicePurchasing'
            security:
              $ref: '#/components/schemas/MobileDeviceSecurity'
            serviceSubscriptions:
              items:
                $ref: _MonolithLibrary.yaml#/components/schemas/MobileDeviceServiceSubscriptions
              type: array
            sharedUsers:
              items:
                $ref: '#/components/schemas/MobileDeviceSharedUser'
              type: array
            userProfiles:
              items:
                $ref: '#/components/schemas/MobileDeviceUserProfile'
              type: array
          type: object
    MobileDeviceLostModeLocation:
      properties:
        lastLocationUpdate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        lostModeLocationAltitudeMeters:
          example: 7.9
          type: number
        lostModeLocationCourseDegrees:
          example: 15
          type: number
        lostModeLocationHorizontalAccuracyMeters:
          example: 7
          type: number
        lostModeLocationSpeedMetersPerSecond:
          example: 10
          type: number
        lostModeLocationTimestamp:
          example: 2023-04-21 12:30:00 UTC
          type: string
        lostModeLocationVerticalAccuracyMeters:
          example: 5
          type: number
      type: object
    MobileDeviceNetwork:
      description: This section only avaiable for Ios type.
      properties:
        carrierSettingsVersion:
          example: "33.1"
          type: string
        cellularTechnology:
          example: Unknown
          type: string
        currentCarrierNetwork:
          example: Verizon Wireless
          type: string
        currentMobileCountryCode:
          example: "311"
          type: string
        currentMobileNetworkCode:
          example: "480"
          type: string
        dataRoamingEnabled:
          example: true
          type: boolean
        eid:
          description: EID or "embedded identity document" is a number associated with the eSIM on a device
          example: "12547444452496388545569920380795"
          readOnly: true
          type: string
        homeCarrierNetwork:
          example: Verizon
          type: string
        homeMobileCountryCode:
          example: US
          type: string
        homeMobileNetworkCode:
          example: "480"
          type: string
        iccid:
          example: "8991101200003204514"
          type: string
        imei:
          example: 59 105109 176278 3
          type: string
        meid:
          example: "15302309236898"
          type: string
        personalHotspotEnabled:
          example: false
          type: boolean
        phoneNumber:
          example: 555-555-5555 ext 5
          type: string
        preferredVoiceNumber:
          example: 555-555-5555
          type: string
        roaming:
          example: false
          type: boolean
        voiceRoamingEnabled:
          example: false
          type: boolean
      type: object
    MobileDeviceProfile:
      properties:
        displayName:
          example: Test WiFi
          type: string
        identifier:
          example: ac2-server4.D0EFAC2D-326C-4BB6-87E6-2BCB88490AAA
          type: string
        lastInstalled:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        removable:
          example: true
          type: boolean
        uuid:
          example: D29DD9FB-0D5B-422F-A3A2-ABBC5848E949
          type: string
        version:
          example: "1"
          type: string
      type: object
    MobileDevicePurchasing:
      properties:
        appleCareId:
          example: "9546567.0"
          type: string
        extensionAttributes:
          items:
            $ref: '#/components/schemas/MobileDeviceExtensionAttribute'
          type: array
        leaseExpiresDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        leased:
          example: false
          type: boolean
        lifeExpectancy:
          example: 7
          type: integer
        poDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
        poNumber:
          example: "8675309"
          type: string
        purchasePrice:
          example: $399
          type: string
        purchased:
          example: true
          type: boolean
        purchasingAccount:
          example: IT Budget
          type: string
        purchasingContact:
          example: Nick in IT
          type: string
        vendor:
          example: Apple
          type: string
        warrantyExpiresDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          type: string
      type: object
    MobileDeviceResponse:
      discriminator:
        mapping:
          iOS: '#/components/schemas/MobileDeviceIosInventory'
          tvOS: '#/components/schemas/MobileDeviceTvOsInventory'
          visionOS: '#/components/schemas/MobileDeviceVisionOsInventory'
          watchOS: '#/components/schemas/MobileDeviceWatchOsInventory'
        propertyName: deviceType
      oneOf:
        - $ref: '#/components/schemas/MobileDeviceIosInventory'
        - $ref: '#/components/schemas/MobileDeviceTvOsInventory'
        - $ref: '#/components/schemas/MobileDeviceWatchOsInventory'
        - $ref: '#/components/schemas/MobileDeviceVisionOsInventory'
      type: object
    MobileDeviceSection:
      enum:
        - GENERAL
        - HARDWARE
        - USER_AND_LOCATION
        - PURCHASING
        - SECURITY
        - APPLICATIONS
        - EBOOKS
        - NETWORK
        - SERVICE_SUBSCRIPTIONS
        - CERTIFICATES
        - PROFILES
        - USER_PROFILES
        - PROVISIONING_PROFILES
        - SHARED_USERS
        - GROUPS
        - EXTENSION_ATTRIBUTES
      example: GENERAL
      type: string
    MobileDeviceSecurity:
      description: This section only available for Ios type.
      properties:
        activationLockEnabled:
          example: false
          type: boolean
        attestationStatus:
          enum:
            - PENDING
            - SUCCESS
            - CERTIFICATE_INVALID
            - DEVICE_PROPERTIES_MISMATCH
            - MDA_UNSUPPORTED_DUE_TO_HARDWARE
            - MDA_UNSUPPORTED_DUE_TO_SOFTWARE
