info:
  title: Jamf Pro API - MobileDeviceInventoryDetail
  version: 0.0.1
openapi: 3.0.1
paths:
  /v2/mobile-devices/detail:
    get:
      description: Return paginated Mobile Device Inventory records
      parameters:
        - description: section of mobile device details, if not specified, General section data is returned. Multiple section parameters are supported, e.g. section=GENERAL&section=HARDWARE
          explode: true
          in: query
          name: section
          required: false
          schema:
            default:
              - GENERAL
            example:
              - GENERAL
            items:
              $ref: '#/components/schemas/MobileDeviceSection'
            type: array
          style: form
        - description: |
            Controls how the endpoint handles exceptions when processing device data.
            - STRICT (default): Returns a 500 error with details when a device has data processing issues.
              Each problematic device is surfaced one at a time.
            - LENIENT: Returns a 200 response even when devices have processing issues. Problematic sections
              will be null in the response, and all devices (including those with issues) are included.
              Exceptions are logged to the Jamf Pro Server logs.
          explode: true
          in: query
          name: exception-handling
          required: false
          schema:
            default: STRICT
            enum:
              - STRICT
              - LENIENT
            example: STRICT
            type: string
          style: form
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: |
            Sorting criteria in the format: property:asc/desc. Default sort
            is displayName:asc. Multiple sort criteria are supported and must be separated with
            a comma.

            Fields allowed in the sort: `airPlayPassword`, `appAnalyticsEnabled`, `assetTag`, `availableSpaceMb`,
            `batteryLevel`, `batteryHealth`, `bluetoothLowEnergyCapable`, `bluetoothMacAddress`, `capacityMb`,
            `lostModeEnabledDate`, `declarativeDeviceManagementEnabled`, `deviceId`, `deviceLocatorServiceEnabled`,
            `devicePhoneNumber`, `diagnosticAndUsageReportingEnabled`, `displayName`, `doNotDisturbEnabled`,
            `enrollmentSessionTokenValid`, `exchangeDeviceId`, `cloudBackupEnabled`, `osBuild`,
            `osSupplementalBuildVersion`, `osVersion`, `osRapidSecurityResponse`, `ipAddress`, `itunesStoreAccountActive`,
            `mobileDeviceId`, `managementId`, `languages`, `lastBackupDate`, `lastContactDate`, `lastEnrolledDate`, `lastCloudBackupDate`,
            `lastInventoryUpdateDate`, `locales`, `locationServicesForSelfServiceMobileEnabled`, `lostModeEnabled`,
            `managed`, `mdmProfileExpirationDate`, `model`, `modelIdentifier`,
            `modelNumber`, `modemFirmwareVersion`, `preferredVoiceNumber`, `quotaSize`, `residentUsers`,
            `serialNumber`, `sharedIpad`, `supervised`, `tethered`,
            `timeZone`, `udid`, `usedSpacePercentage`, `wifiMacAddress`,
            `deviceOwnershipType`, `building`, `department`, `emailAddress`,
            `fullName`, `userPhoneNumber`, `position`, `room`,
            `username`, `appleCareId`, `leaseExpirationDate`,`lifeExpectancyYears`,
