          readOnly: true
          type: string
        blockLevelEncryptionCapable:
          example: true
          type: boolean
        bootstrapTokenEscrowed:
          description: Indicates the bootstrap token escrow status for the device
          enum:
            - ESCROWED
            - NOT_ESCROWED
            - NOT_SUPPORTED
          example: NOT_SUPPORTED
          type: string
        dataProtected:
          example: false
          type: boolean
        fileLevelEncryptionCapable:
          example: true
          type: boolean
        hardwareEncryption:
          example: 3
          type: integer
        jailBreakDetected:
          example: false
          type: boolean
        lastAttestationAttemptDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          readOnly: true
          type: string
        lastSuccessfulAttestationDate:
          example: "2019-02-04T21:09:31.661Z"
          format: date-time
          readOnly: true
          type: string
        lostModeEnabled:
          example: false
          type: boolean
        lostModeFootnote:
          example: Note
          type: string
        lostModeLocation:
          $ref: '#/components/schemas/MobileDeviceLostModeLocation'
        lostModeMessage:
          example: Lost phone
          type: string
        lostModePersistent:
          example: false
          type: boolean
        lostModePhoneNumber:
          example: 555-555-5555
          type: string
        passcodeCompliant:
          example: true
          type: boolean
        passcodeCompliantWithProfile:
          example: true
          type: boolean
        passcodeLockGracePeriodEnforcedSeconds:
          example: 3
          type: integer
        passcodePresent:
          example: false
          type: boolean
        personalDeviceProfileCurrent:
          default: false
          deprecated: true
          description: |
            **Deprecated as of 11.25.** This field always returns false
          readOnly: true
          type: boolean
      type: object
    MobileDeviceSharedUser:
      properties:
        dataToSync:
          example: true
          type: boolean
        loggedIn:
          example: true
          type: boolean
        managedAppleId:
          example: astark@jamf.edu
