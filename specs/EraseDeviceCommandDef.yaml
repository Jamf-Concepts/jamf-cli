openapi: 3.0.1
info:
  title: Jamf Pro API - Erase Device Command Definition
  description: This MDM commands exist to be re-used by multiple other Swagger files.
  version: 0.0.1
paths: {}
components:
  schemas:
    EraseDeviceCommand:
      allOf:
        - $ref: 'MdmDefinitionsLibrary.yaml#/components/schemas/MdmCommandBase'
        - type: object
          properties:
            preserveDataPlan:
              type: boolean
              example: true
              default: false
              description: If true, preserve the data plan on an iPhone or iPad with eSIM functionality, if one exists. This value is available in iOS 11 and later.
            disallowProximitySetup:
              type: boolean
              example: true
              default: false
              description: If true, disable Proximity Setup on the next reboot and skip the pane in Setup Assistant. This value is available in iOS 11 and later. Prior to iOS 14, don’t use this option with any other option.
            pin:
              type: string
              example: '123456'
              minLength: 6
              maxLength: 6
              description: The six-character PIN for Find My. This value is available in macOS 10.8 and later.
            obliterationBehavior:
              type: string
              example: Default
              description: This key defines the fallback behavior for erasing a device.
              enum:
                  - Default
                  - DoNotObliterate
                  - ObliterateWithWarning
                  - Always
            returnToService:
                $ref: '#/components/schemas/ReturnToService'
    ReturnToService:
      type: object
      description: The configuration settings for Return to Service.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          example: true
        mdmProfileData:
          type: string
          example: 
          description: Base64 encoded mdm profile
        wifiProfileData:
          type: string
          example: 
          description: Base64 encoded wifi profile
        bootstrapToken:
          type: string
          example: HPZC3p80IWb3XgD51W7hhUxWNwKElvvEgCgjegI=
          description: Base64 encoded bootstrap token for the device.
