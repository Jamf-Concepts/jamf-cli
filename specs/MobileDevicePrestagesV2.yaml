components:
  schemas:
    FileAttachmentV2:
      properties:
        id:
          example: "1"
          type: string
        name:
          example: receipt.pdf
          type: string
      type: object
    GetMobileDevicePrestageV2:
      allOf:
        - $ref: '#/components/schemas/MobileDevicePrestageV2'
        - properties:
            id:
              example: "1"
              type: string
            profileUuid:
              example: 29d-a8d8f-b8sdjndf-dsa9
              type: string
            siteId:
              example: "5"
              type: string
            versionLock:
              example: 0
              type: integer
          type: object
    MobileDevicePrestageNameV2:
      properties:
        deviceName:
          example: iPad
          type: string
        id:
          example: "1"
          type: string
        used:
          example: false
          type: boolean
      type: object
    MobileDevicePrestageNamesV2:
      properties:
        assignNamesUsing:
          example: List of Names
          type: string
        deviceNamePrefix:
          example: prefix
          type: string
        deviceNameSuffix:
          example: suffix
          type: string
        deviceNamingConfigured:
          example: true
          type: boolean
        manageNames:
          example: true
          type: boolean
        prestageDeviceNames:
          items:
            $ref: '#/components/schemas/MobileDevicePrestageNameV2'
          type: array
        singleDeviceName:
          example: name
          type: string
      type: object
    MobileDevicePrestageSearchResultsV2:
      properties:
        results:
          items:
            $ref: '#/components/schemas/GetMobileDevicePrestageV2'
          type: array
        totalCount:
          example: 1
          minimum: 0
          type: integer
      type: object
    MobileDevicePrestageV2:
      allOf:
        - $ref: _MonolithLibrary.yaml#/components/schemas/DeviceEnrollmentPrestageV2
        - properties:
            allowPairing:
              example: true
              type: boolean
            configureDeviceBeforeSetupAssistant:
              example: true
              type: boolean
            enforceTemporarySessionTimeout:
              example: false
              type: boolean
            enforceUserSessionTimeout:
              example: false
              type: boolean
            maximumSharedAccounts:
              example: 10
              type: integer
            minimumOsSpecificVersionIos:
              example: "17.1"
              minLength: 0
              nullable: false
              type: string
            minimumOsSpecificVersionIpad:
              example: "17.1"
              minLength: 0
              nullable: false
              type: string
            multiUser:
              example: true
              type: boolean
            names:
              $ref: '#/components/schemas/MobileDevicePrestageNamesV2'
            prestageMinimumOsTargetVersionTypeIos:
              enum:
                - NO_ENFORCEMENT
                - MINIMUM_OS_LATEST_VERSION
                - MINIMUM_OS_LATEST_MAJOR_VERSION
                - MINIMUM_OS_LATEST_MINOR_VERSION
                - MINIMUM_OS_SPECIFIC_VERSION
              example: MINIMUM_OS_LATEST_VERSION
              nullable: false
              type: string
            prestageMinimumOsTargetVersionTypeIpad:
              enum:
                - NO_ENFORCEMENT
                - MINIMUM_OS_LATEST_VERSION
                - MINIMUM_OS_LATEST_MAJOR_VERSION
                - MINIMUM_OS_LATEST_MINOR_VERSION
                - MINIMUM_OS_SPECIFIC_VERSION
              example: MINIMUM_OS_LATEST_VERSION
              nullable: false
              type: string
            rtsConfigProfileId:
              example: "1"
              type: string
            rtsEnabled:
              example: false
              type: boolean
            sendTimezone:
              example: true
              type: boolean
            storageQuotaSizeMegabytes:
              example: 4096
              type: integer
            supervised:
              example: true
              type: boolean
            temporarySessionOnly:
              example: false
              type: boolean
            temporarySessionTimeout:
              example: 30
              type: integer
            timezone:
              example: America/Chicago
              type: string
            useStorageQuotaSize:
              example: true
              type: boolean
            userSessionTimeout:
              example: 30
              type: integer
          required:
            - allowPairing
            - configureDeviceBeforeSetupAssistant
            - maximumSharedAccounts
            - multiUser
            - sendTimezone
            - storageQuotaSizeMegabytes
            - supervised
            - timezone
            - useStorageQuotaSize
          type: object
    PrestageFileAttachmentV2:
      properties:
        fileType:
          example: pdf
          type: string
        id:
          example: "1"
          type: string
        name:
          example: receipt.pdf
          type: string
      type: object
    PutMobileDevicePrestageV2:
      allOf:
        - $ref: '#/components/schemas/MobileDevicePrestageV2'
        - properties:
            versionLock:
              example: 0
              type: integer
          type: object
info:
  title: Jamf Pro API - MobileDevicePrestagesV2
  version: 0.0.1
openapi: 3.0.1
paths:
  /v2/mobile-device-prestages:
    get:
      deprecated: true
      description: Gets sorted and paged mobile device prestages
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: 'Sorting criteria in the format: property:asc/desc. Multiple sort criteria are supported and must be separated with a comma. Example: sort=date:desc,name:asc '
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - id:desc
            items:
              type: string
            type: array
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileDevicePrestageSearchResultsV2'
          description: Successful response
      summary: |
        Get sorted and paged Mobile Device Prestages
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Read Mobile Device PreStage Enrollments
    post:
      deprecated: true
      description: Create a mobile device prestage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileDevicePrestageV2'
        description: Mobile Device Prestage to create. ids defined in this body will be ignored
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Mobile Device Prestage was created
      summary: |
        Create a Mobile Device Prestage
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Create Mobile Device PreStage Enrollments
  /v2/mobile-device-prestages/{id}:
    delete:
      deprecated: true
      description: Deletes a Mobile Device Prestage with the supplied id
      parameters:
        - description: Mobile Device Prestage identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: Success
      summary: |
        Delete a Mobile Device Prestage with the supplied id
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Delete Mobile Device PreStage Enrollments
    get:
      deprecated: true
      description: Retrieves a Mobile Device Prestage with the supplied id
      parameters:
        - description: Mobile Device Prestage identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMobileDevicePrestageV2'
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Mobile Device Prestage with that id does not exist
      summary: |
        Retrieve a Mobile Device Prestage with the supplied id
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Read Mobile Device PreStage Enrollments
    put:
      deprecated: true
      description: Updates a Mobile Device Prestage
      parameters:
        - description: Mobile Device Prestage identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMobileDevicePrestageV2'
        description: Mobile Device Prestage to update
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMobileDevicePrestageV2'
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Mobile Device Prestage with that id does not exist
        409:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: The Mobile Device Prestage was modified by another process. Read the Mobile Device Prestage again for updated changes.
      summary: |
        Update a Mobile Device Prestage
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Update Mobile Device PreStage Enrollments
  /v2/mobile-device-prestages/{id}/attachments:
    get:
      deprecated: true
      description: Get attachments for a Mobile Device Prestage
      parameters:
        - description: Mobile Device Prestage identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileAttachmentV2'
                type: array
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Mobile Device Prestage with that id does not exist
      summary: |
        Get attachments for a Mobile Device Prestage
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Read Mobile Device PreStage Enrollments
    post:
      deprecated: true
      description: Add an attachment to a Mobile Device prestage
      parameters:
        - description: Identifier of the Mobile Device Prestage the attachment should be assigned to
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: The file to upload
                  format: binary
                  type: string
              required:
                - file
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestageFileAttachmentV2'
          description: Success
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Mobile Device Prestage with that id does not exist
        413:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Payload Too Large
      summary: |
        Add an attachment to a Mobile Device Prestage
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Create Mobile Device PreStage Enrollments
  /v2/mobile-device-prestages/{id}/attachments/delete-multiple:
    post:
      deprecated: true
      description: Remove an attachment for a Mobile Device Prestage
      parameters:
        - description: Mobile Device Prestage identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/Ids
        required: true
      responses:
        204:
          description: Success
      summary: |
        Remove an attachment for a Mobile Device Prestage
      tags:
        - mobile-device-prestages
      x-action: true
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Delete Mobile Device PreStage Enrollments
  /v2/mobile-device-prestages/{id}/history:
    get:
      deprecated: true
      description: Gets sorted and paged mobile device prestage history objects
      parameters:
        - description: Mobile Device Prestage identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: 'Sorting criteria in the format: property,asc/desc. Default sort order is descending. Multiple sort criteria are supported and must be entered on separate lines in Swagger UI. In the URI the ''sort'' query param is duplicated for each sort criterion, e.g., ...&sort=name%2Casc&sort=date%2Cdesc'
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - date:desc
            items:
              type: string
            type: array
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HistorySearchResults
          description: Details of mobile device prestage history were found
      summary: |
        Get sorted and paged Mobile Device Prestage history objects
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Read Mobile Device PreStage Enrollments
    post:
      deprecated: true
      description: Adds mobile device prestage history object notes
      parameters:
        - description: Mobile Device Prestage identifier
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistoryNote
        description: History notes to create
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Notes of mobile deivce prestage history were added
        503:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Mobile device prestage history can not be saved
      summary: |
        Add Mobile Device Prestage history object notes
      tags:
        - mobile-device-prestages
      x-deprecation-date: "2025-06-30"
      x-required-privileges:
        - Update Mobile Device PreStage Enrollments
servers:
  - url: /api
