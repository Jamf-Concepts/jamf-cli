openapi: 3.0.1
info:
  title: Jamf Pro API - Local Admin Password Solution
  version: 0.0.1
paths:
  /v2/local-admin-password/settings:
    get:
      summary: Get the current LAPS settings.
      description: Return information about the current LAPS settings.
      tags:
        - local-admin-password
      x-required-privileges:
        - Update Local Admin Password Settings
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsSettingsResponseV2'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
    put:
      summary: Update settings for LAPS.
      description: Update settings for LAPS.
      tags:
        - local-admin-password
      x-required-privileges:
        - Update Local Admin Password Settings
      requestBody:
        description: LAPS settings to update
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/LapsSettingsRequestV2'
        required: true
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsSettingsResponseV2'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/account/{username}/password:
    get:
      summary: Get current LAPS password for specified username on a client.
      description: Get current LAPS password for specified client by using the client management id and username as the path parameters.
        Once the password is viewed it will be rotated out with a new password based on the rotation time settings. If multiple accounts
        with the same username exist, the MDM source will be selected by default.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
      parameters:
        - name: clientManagementId
          in: path
          description: client management id of target device.
          required: true
          schema:
            type: string
        - name: username
          in: path
          description: user name for the account
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsPasswordResponseV2'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/account/{username}/{guid}/password:
    get:
      summary: Get current LAPS password for specified user guid on a client.
      description: Get current LAPS password for specified client by using the client management id, username, and user guid as the path parameters.
        Once the password is viewed it will be rotated out with a new password based on the rotation time settings.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
      parameters:
        - name: clientManagementId
          in: path
          description: client management id of target device.
          required: true
          schema:
            type: string
        - name: username
          in: path
          description: user name for the account
          required: true
          schema:
            type: string
        - name: guid
          in: path
          description: user guid for the account
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsPasswordResponseV2'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/account/{username}/audit:
    get:
      summary: Get LAPS password viewed history.
      description: Get the full history of all local admin passwords for a specific username on a target device.
        History will include password, who viewed the password and when it was viewed.
        Get audit history by using the client management id and username as the path parameters. If multiple accounts
          with the same username exist, the MDM source will be selected by default.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
      parameters:
        - name: clientManagementId
          in: path
          description: client management id of target device.
          required: true
          schema:
            type: string
        - name: username
          in: path
          description: user name to view audit information for
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsPasswordAuditsResultsV2'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/account/{username}/{guid}/audit:
    get:
      summary: Get LAPS password viewed history.
      description: Get the full history of all local admin passwords for a specific user guid on a target device.
        History will include password, who viewed the password and when it was viewed.
        Get audit history by using the client management id, username, and user guid as the path parameters.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
      parameters:
        - name: clientManagementId
          in: path
          description: client management id of target device.
          required: true
          schema:
            type: string
        - name: username
          in: path
          description: user name to view audit information for
          required: true
          schema:
            type: string
        - name: guid
          in: path
          description: user guid to view audit information for
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsPasswordAuditsResultsV2'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/accounts:
    get:
      summary: Get the LAPS capable admin accounts for a device.
      description: Get a full list of admin accounts that are LAPS capable. Capable accounts are returned
        in the AutoSetupAdminAccounts from QueryResponses.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
      parameters:
        - name: clientManagementId
          in: path
          description: client management id of target device.
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsUserResultsV2'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/set-password:
    put:
      summary: Set the LAPS password for a device.
      description: Set the LAPS password for a device. This will set the password for all LAPS capable accounts.
      tags:
        - local-admin-password
      x-required-privileges:
        - Send Local Admin Password Command
      parameters:
        - name: clientManagementId
          in: path
          description: client management id of target device.
          required: true
          schema:
            type: string
      requestBody:
        description: LAPS password to set
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/LapsUserPasswordRequestV2'
        required: true
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsUserPasswordResponseV2'
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        500:
          description: Failure, unable to update passwords
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/pending-rotations:
    get:
      summary: Get a list of the current devices and usernames with pending LAPS rotations
      description: Return information about all devices and usernames currently in the state of a pending LAPS rotation
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/LapsPendingRotationResponse'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/account/{username}/history:
      get:
          summary: Get LAPS historical records for target device and username.
          description: Get the full history of all for a specific username on a target device.
              History will include date created, date last seen, expiration time, and rotational status.
              Get audit history by using the client management id and username as the path parameters.
          tags:
              - local-admin-password
          x-required-privileges:
              - View Local Admin Password Audit History
          parameters:
              - name: clientManagementId
                in: path
                description: client management id of target device.
                required: true
                schema:
                    type: string
              - name: username
                in: path
                description: user name to view history for
                required: true
                schema:
                    type: string
          responses:
              200:
                  description: Success
                  content:
                      'application/json':
                          schema:
                              $ref: '#/components/schemas/LapsHistoryResponse'
              400:
                  description: Bad Request
                  content:
                      'application/json':
                          schema:
                              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
              500:
                  description: Failure, unable to complete lookup.
                  content:
                      'application/json':
                          schema:
                              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/account/{username}/{guid}/history:
      get:
          summary: Get LAPS historical records for target device and user guid.
          description: Get the full history of all for a specific user guid on a target device.
              History will include date created, date last seen, expiration time, and rotational status.
              Get audit history by using the client management id, username, and user guid as the path parameters.
          tags:
              - local-admin-password
          x-required-privileges:
              - View Local Admin Password Audit History
          parameters:
              -   name: clientManagementId
                  in: path
                  description: client management id of target device.
                  required: true
                  schema:
                      type: string
              -   name: username
                  in: path
                  description: user name to view history for
                  required: true
                  schema:
                      type: string
              -   name: guid
                  in: path
                  description: user guid to view history for
                  required: true
                  schema:
                      type: string
          responses:
              200:
                  description: Success
                  content:
                      'application/json':
                          schema:
                              $ref: '#/components/schemas/LapsHistoryResponse'
              400:
                  description: Bad Request
                  content:
                      'application/json':
                          schema:
                              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
              500:
                  description: Failure, unable to complete lookup.
                  content:
                      'application/json':
                          schema:
                              $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
  /v2/local-admin-password/{clientManagementId}/history:
    get:
      summary: Get LAPS password viewed history, and rotation history.
      description: Get the full history of all local admin passwords for all accounts for a specific management ID.
        History will include password, who viewed the password and when it was viewed. This will include rotation history as well.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
      parameters:
        - name: clientManagementId
          in: "path"
          description: client management id of target device.
          required: true
          schema:
            type: "string"
      responses:
        200:
          description: OK
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/LapsAccountManagementHistoryResponse"
        400:
          description: Bad Request
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
        500:
          description: Failure, unable to complete lookup.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
components:
  schemas:
    LapsSettingsResponseV2:
      type: object
      properties:
        autoDeployEnabled:
          type: boolean
          nullable: false
          example: false
          description: When enabled, all appropriate computers will have the SetAutoAdminPassword command sent to them automatically.
        passwordRotationTime:
          type: integer
          example: 3600
          description: The amount of time in seconds that the local admin password will be rotated after viewing.
        autoRotateEnabled:
          type: boolean
          nullable: false
          example: false
          description: When enabled, all appropriate computers will automatically have their password expired and rotated after the configured autoRotateExpirationTime
        autoRotateExpirationTime:
          type: integer
          example: 7776000
          description: The amount of time in seconds that the local admin password will be rotated automatically if it is never viewed.
    LapsSettingsRequestV2:
      required:
        - autoDeployEnabled
        - passwordRotationTime
        - autoRotateEnabled
        - autoRotateExpirationTime
      type: object
      properties:
        autoDeployEnabled:
          type: boolean
          nullable: false
          example: false
          description: When enabled, all appropriate computers will have the SetAutoAdminPassword command sent to them automatically.
        passwordRotationTime:
          type: integer
          example: 3600
          description: The amount of time in seconds that the local admin password will be rotated after viewing.
        autoRotateEnabled:
          type: boolean
          nullable: false
          example: false
          description: When enabled, all appropriate computers will automatically have their password expired and rotated after the configured autoRotateExpirationTime
        autoRotateExpirationTime:
          type: integer
          example: 7776000
          description: The amount of time in seconds that the local admin password will be rotated automatically if it is never viewed.
    LapsPasswordResponseV2:
      type: object
      properties:
        password:
          type: string
          nullable: false
          format: password
          example: "jamf12345"
          readOnly: true
    LapsPasswordAuditsResultsV2:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
        results:
          type: array
          minLength: 0
          items:
            $ref: '#/components/schemas/LapsPasswordAndAuditsV2'
    LapsPasswordAndAuditsV2:
      type: object
      properties:
        password:
          type: string
          format: password
          example: "jamf12345"
          nullable: false
          readOnly: true
        dateLastSeen:
          type: string
          example: "2019-05-16T20:43:43.945Z"
          nullable: true
          format: date-time
        expirationTime:
          type: string
          example: "2019-05-16T20:43:43.945Z"
          nullable: true
          format: date-time
        audits:
          type: array
          minLength: 0
          items:
            $ref: '#/components/schemas/LapsAuditV2'
    LapsAuditV2:
      type: object
      properties:
        viewedBy:
          type: string
          example: "admin"
          nullable: true
        dateSeen:
          type: string
          example: "2019-05-16T20:43:43.945Z"
          nullable: true
          format: date-time
    LapsUserResultsV2:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
        results:
          type: array
          minLength: 0
          items:
            $ref: '#/components/schemas/LapsUserV2'
    LapsUserV2:
      type: object
      properties:
        clientManagementId:
          type: string
          example: "2db90ebf-ce9c-4078-b508-034c8ee3a060"
        guid:
          type: string
          example: "602F96A6-7BC4-43CD-95F2-1DD3B8BC0AF3"
          nullable: false
        username:
          type: string
          example: "admin"
          nullable: false
        userSource:
            type: string
            example: MDM
            enum:
                - MDM
                - JMF
            nullable: false
    LapsUserPasswordRequestV2:
      type: object
      properties:
        lapsUserPasswordList:
          type: array
          minLength: 1
          items:
            $ref: '#/components/schemas/LapsUserPasswordV2'
    LapsUserPasswordResponseV2:
      type: object
      properties:
        lapsUserPasswordList:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/LapsUserPasswordV2'
    LapsUserPasswordV2:
      type: object
      properties:
        username:
          type: string
          example: "username"
          nullable: false
        password:
          type: string
          example: "jamf1234"
          format: password
          writeOnly: true
          nullable: false
    LapsPendingRotationResponse:
        type: object
        properties:
            totalCount:
                type: integer
                example: 1
            results:
                type: array
                minLength: 0
                items:
                    $ref: '#/components/schemas/LapsPendingRotation'
    LapsPendingRotation:
      type: object
      properties:
        lapsUser:
          $ref: '#/components/schemas/LapsUserV2'
        createdDate:
          type: string
          example: "2019-05-16T20:43:43.945Z"
          nullable: false
          format: date-time
    LapsHistoryResponse:
        type: object
        properties:
            totalCount:
                type: integer
                example: 1
            results:
                type: array
                minLength: 0
                items:
                    $ref: '#/components/schemas/LapsHistory'
    LapsHistory:
        type: object
        properties:
            createdDate:
                type: string
                example: "2019-05-16T20:43:43.945Z"
                nullable: true
                format: date-time
            dateLastSeen:
                type: string
                example: "2019-05-16T20:43:43.945Z"
                nullable: true
                format: date-time
            expirationTime:
                type: string
                example: "2019-05-16T20:43:43.945Z"
                nullable: true
                format: date-time
            rotationStatus:
                type: string
                example: PENDING
                enum:
                    - PENDING
                    - COMPLETED
                    - VIEWED
                    - ERROR
                    - INVALID
    LapsAccountManagementHistoryResponse:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
        results:
          type: array
          minLength: 0
          items:
            $ref: '#/components/schemas/LapsAccountManagementHistory'
    LapsAccountManagementHistory:
      type: "object"
      properties:
        username:
          type: string
          example: "username"
          nullable: false
        eventType:
          type: string
          example: VIEWED
          enum:
            - PENDING
            - COMPLETED
            - VIEWED
            - ERROR
            - INVALID
        eventTime:
          type: string
          example: "2019-05-16T20:43:43.945Z"
          nullable: true
          format: date-time
        viewedBy:
          type: string
          example: "admin"
          nullable: true
        userSource:
          type: string
          example: MDM
          enum:
            - MDM
            - JMF
          nullable: false
