components:
  schemas:
    LapsAccountManagementHistory:
      properties:
        eventTime:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: true
          type: string
        eventType:
          enum:
            - PENDING
            - COMPLETED
            - VIEWED
            - ERROR
            - INVALID
          example: VIEWED
          type: string
        userSource:
          enum:
            - MDM
            - JMF
          example: MDM
          nullable: false
          type: string
        username:
          example: username
          nullable: false
          type: string
        viewedBy:
          example: admin
          nullable: true
          type: string
      type: object
    LapsAccountManagementHistoryResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/LapsAccountManagementHistory'
          minLength: 0
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    LapsAuditV2:
      properties:
        dateSeen:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: true
          type: string
        viewedBy:
          example: admin
          nullable: true
          type: string
      type: object
    LapsHistory:
      properties:
        createdDate:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: true
          type: string
        dateLastSeen:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: true
          type: string
        expirationTime:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: true
          type: string
        rotationStatus:
          enum:
            - PENDING
            - COMPLETED
            - VIEWED
            - ERROR
            - INVALID
          example: PENDING
          type: string
      type: object
    LapsHistoryResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/LapsHistory'
          minLength: 0
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    LapsPasswordAndAuditsV2:
      properties:
        audits:
          items:
            $ref: '#/components/schemas/LapsAuditV2'
          minLength: 0
          type: array
        dateLastSeen:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: true
          type: string
        expirationTime:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: true
          type: string
        password:
          example: jamf12345
          format: password
          nullable: false
          readOnly: true
          type: string
      type: object
    LapsPasswordAuditsResultsV2:
      properties:
        results:
          items:
            $ref: '#/components/schemas/LapsPasswordAndAuditsV2'
          minLength: 0
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    LapsPasswordResponseV2:
      properties:
        password:
          example: jamf12345
          format: password
          nullable: false
          readOnly: true
          type: string
      type: object
    LapsPendingRotation:
      properties:
        createdDate:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          nullable: false
          type: string
        lapsUser:
          $ref: '#/components/schemas/LapsUserV2'
      type: object
    LapsPendingRotationResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/LapsPendingRotation'
          minLength: 0
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    LapsSettingsRequestV2:
      properties:
        autoDeployEnabled:
          description: When enabled, all appropriate computers will have the SetAutoAdminPassword command sent to them automatically.
          example: false
          nullable: false
          type: boolean
        autoRotateEnabled:
          description: When enabled, all appropriate computers will automatically have their password expired and rotated after the configured autoRotateExpirationTime
          example: false
          nullable: false
          type: boolean
        autoRotateExpirationTime:
          description: The amount of time in seconds that the local admin password will be rotated automatically if it is never viewed.
          example: 7776000
          type: integer
        passwordRotationTime:
          description: The amount of time in seconds that the local admin password will be rotated after viewing.
          example: 3600
          type: integer
      required:
        - autoDeployEnabled
        - autoRotateEnabled
        - autoRotateExpirationTime
        - passwordRotationTime
      type: object
    LapsSettingsResponseV2:
      properties:
        autoDeployEnabled:
          description: When enabled, all appropriate computers will have the SetAutoAdminPassword command sent to them automatically.
          example: false
          nullable: false
          type: boolean
        autoRotateEnabled:
          description: When enabled, all appropriate computers will automatically have their password expired and rotated after the configured autoRotateExpirationTime
          example: false
          nullable: false
          type: boolean
        autoRotateExpirationTime:
          description: The amount of time in seconds that the local admin password will be rotated automatically if it is never viewed.
          example: 7776000
          type: integer
        passwordRotationTime:
          description: The amount of time in seconds that the local admin password will be rotated after viewing.
          example: 3600
          type: integer
      type: object
    LapsUserPasswordRequestV2:
      properties:
        lapsUserPasswordList:
          items:
            $ref: '#/components/schemas/LapsUserPasswordV2'
          minLength: 1
          type: array
      type: object
    LapsUserPasswordResponseV2:
      properties:
        lapsUserPasswordList:
          items:
            $ref: '#/components/schemas/LapsUserPasswordV2'
          nullable: false
          type: array
      type: object
    LapsUserPasswordV2:
      properties:
        password:
          example: jamf1234
          format: password
          nullable: false
          type: string
          writeOnly: true
        username:
          example: username
          nullable: false
          type: string
      type: object
    LapsUserResultsV2:
      properties:
        results:
          items:
            $ref: '#/components/schemas/LapsUserV2'
          minLength: 0
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    LapsUserV2:
      properties:
        clientManagementId:
          example: 2db90ebf-ce9c-4078-b508-034c8ee3a060
          type: string
        guid:
          example: 602F96A6-7BC4-43CD-95F2-1DD3B8BC0AF3
          nullable: false
          type: string
        userSource:
          enum:
            - MDM
            - JMF
          example: MDM
          nullable: false
          type: string
        username:
          example: admin
          nullable: false
          type: string
      type: object
info:
  title: Jamf Pro API - LocalAdminPasswordV2
  version: 0.0.1
openapi: 3.0.1
paths:
  /v2/local-admin-password/pending-rotations:
    get:
      description: Return information about all devices and usernames currently in the state of a pending LAPS rotation
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsPendingRotationResponse'
          description: Success
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get a list of the current devices and usernames with pending LAPS rotations
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
  /v2/local-admin-password/settings:
    get:
      description: Return information about the current LAPS settings.
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsSettingsResponseV2'
          description: Success
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get the current LAPS settings.
      tags:
        - local-admin-password
      x-required-privileges:
        - Read User-Initiated Enrollment
        - Update Local Admin Password Settings
    put:
      description: Update settings for LAPS.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LapsSettingsRequestV2'
        description: LAPS settings to update
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsSettingsResponseV2'
          description: Success
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Update settings for LAPS.
      tags:
        - local-admin-password
      x-required-privileges:
        - Update Local Admin Password Settings
  /v2/local-admin-password/{clientManagementId}/account/{username}/audit:
    get:
      description: Get the full history of all local admin passwords for a specific username on a target device. History will include password, who viewed the password and when it was viewed. Get audit history by using the client management id and username as the path parameters. If multiple accounts with the same username exist, the MDM source will be selected by default.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
        - description: user name to view audit information for
          explode: false
          in: path
          name: username
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsPasswordAuditsResultsV2'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get LAPS password viewed history.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
  /v2/local-admin-password/{clientManagementId}/account/{username}/history:
    get:
      description: Get the full history of all for a specific username on a target device. History will include date created, date last seen, expiration time, and rotational status. Get audit history by using the client management id and username as the path parameters.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
        - description: user name to view history for
          explode: false
          in: path
          name: username
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsHistoryResponse'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get LAPS historical records for target device and username.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
  /v2/local-admin-password/{clientManagementId}/account/{username}/password:
    get:
      description: Get current LAPS password for specified client by using the client management id and username as the path parameters. Once the password is viewed it will be rotated out with a new password based on the rotation time settings. If multiple accounts with the same username exist, the MDM source will be selected by default.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
        - description: user name for the account
          explode: false
          in: path
          name: username
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsPasswordResponseV2'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get current LAPS password for specified username on a client.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
  /v2/local-admin-password/{clientManagementId}/account/{username}/{guid}/audit:
    get:
      description: Get the full history of all local admin passwords for a specific user guid on a target device. History will include password, who viewed the password and when it was viewed. Get audit history by using the client management id, username, and user guid as the path parameters.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
        - description: user name to view audit information for
          explode: false
          in: path
          name: username
          required: true
          schema:
            type: string
          style: simple
        - description: user guid to view audit information for
          explode: false
          in: path
          name: guid
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsPasswordAuditsResultsV2'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get LAPS password viewed history.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
  /v2/local-admin-password/{clientManagementId}/account/{username}/{guid}/history:
    get:
      description: Get the full history of all for a specific user guid on a target device. History will include date created, date last seen, expiration time, and rotational status. Get audit history by using the client management id, username, and user guid as the path parameters.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
        - description: user name to view history for
          explode: false
          in: path
          name: username
          required: true
          schema:
            type: string
          style: simple
        - description: user guid to view history for
          explode: false
          in: path
          name: guid
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsHistoryResponse'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get LAPS historical records for target device and user guid.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
  /v2/local-admin-password/{clientManagementId}/account/{username}/{guid}/password:
    get:
      description: Get current LAPS password for specified client by using the client management id, username, and user guid as the path parameters. Once the password is viewed it will be rotated out with a new password based on the rotation time settings.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
        - description: user name for the account
          explode: false
          in: path
          name: username
          required: true
          schema:
            type: string
          style: simple
        - description: user guid for the account
          explode: false
          in: path
          name: guid
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsPasswordResponseV2'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get current LAPS password for specified user guid on a client.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
  /v2/local-admin-password/{clientManagementId}/accounts:
    get:
      description: Get a full list of admin accounts that are LAPS capable. Capable accounts are returned in the AutoSetupAdminAccounts from QueryResponses.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsUserResultsV2'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get the LAPS capable admin accounts for a device.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password
  /v2/local-admin-password/{clientManagementId}/history:
    get:
      description: Get the full history of all local admin passwords for all accounts for a specific management ID. History will include password, who viewed the password and when it was viewed. This will include rotation history as well.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsAccountManagementHistoryResponse'
          description: OK
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get LAPS password viewed history, and rotation history.
      tags:
        - local-admin-password
      x-required-privileges:
        - View Local Admin Password Audit History
  /v2/local-admin-password/{clientManagementId}/set-password:
    put:
      description: Set the LAPS password for a device. This will set the password for all LAPS capable accounts.
      parameters:
        - description: client management id of target device.
          explode: false
          in: path
          name: clientManagementId
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LapsUserPasswordRequestV2'
        description: LAPS password to set
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LapsUserPasswordResponseV2'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to update passwords
      summary: Set the LAPS password for a device.
      tags:
        - local-admin-password
      x-required-privileges:
        - Send Local Admin Password Command
servers:
  - url: /api
