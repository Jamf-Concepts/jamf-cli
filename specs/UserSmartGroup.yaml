info:
  title: Jamf Pro API - UserSmartGroup
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/smart-user-groups/{id}/recalculate:
    post:
      description: |
        Recalculates the smart group for the given id and then
        returns the ids for the users in the smart group
      parameters:
        - description: instance id of smart group
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: integer
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/RecalculationResults
          description: Successful response
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: smart group not found
      summary: |
        Recalculate the smart group for the given id and then return the ids for the users in the smart group
      tags:
        - smart-user-groups-preview
      x-action: true
      x-required-privileges:
        - Update Smart User Groups
  /v1/users/{id}/recalculate-smart-groups:
    post:
      description: |
        Recalculates a smart group for the given user id and then
        returns the count of smart groups the user falls into
      parameters:
        - description: id of user
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: integer
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/RecalculationResults
          description: Successful response
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: smart group not found
      summary: |
        Recalculate a smart group for the given user id and then return the count of smart groups the user falls into
      tags:
        - smart-user-groups-preview
      x-action: true
      x-required-privileges:
        - Update Smart User Groups
servers:
  - url: /api
