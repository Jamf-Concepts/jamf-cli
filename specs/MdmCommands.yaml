components:
  schemas:
    AppAnalyticsSetting:
      enum:
        - ENABLE_APP_ANALYTICS
        - DISABLE_APP_ANALYTICS
      example: ENABLE_APP_ANALYTICS
      type: string
    ApplicationAttributes:
      properties:
        attributes:
          $ref: '#/components/schemas/Attributes'
        identifier:
          example: com.jamf.selfservice
          nullable: true
          type: string
      type: object
    ApplicationConfiguration:
      properties:
        configuration:
          example: <plist><dict><key>Key</key><string>Value</string></dict></plist>
          nullable: true
          type: string
        identifier:
          example: com.jamf.selfservice
          type: string
      type: object
    ApplyRedemptionCodeCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            identifier:
              description: The bundle identifier of the app
              example: com.example.app
              type: string
            redemptionCode:
              description: The redemption code that applies to the app pending installation
              example: SB56LT7YX8RH
              type: string
          type: object
    Attributes:
      properties:
        associatedDomains:
          items:
            example: jamf.com
            type: string
          type: array
        cellularSliceUuid:
          example: f3b2c6d7-4e8a-9b3a-1a2b3c4d5e6f
          type: string
        contentFilterUuid:
          example: b7e6a1d2-4b3a-4c5a-8b3a-ca0cd7430937
          type: string
        dnsProxyUuid:
          example: e2a1f5b4-3c6d-4e8a-9b3a-1a2b3c4d5e6f
          type: string
        enableDirectDownloads:
          example: true
          type: boolean
        hideable:
          example: true
          type: boolean
        lockable:
          example: true
          type: boolean
        relayUuid:
          example: d4e5f6a7-8b9c-0d1e-2f3a-4b5c6d7e8f9a
          type: string
        removable:
          example: true
          type: boolean
        tapToPayScreenLock:
          example: true
          type: boolean
        vpnUuid:
          example: aaaaaaaa-3f1e-4b3a-a5b3-ca0cd7430937
          nullable: true
          type: string
      type: object
    BlankPushRequest:
      properties:
        clientManagementIds:
          example:
            - fd68c371-5921-436e-b16b-8a3c1bf90ee5
            - a1b2c3d4-5678-90ab-cdef-1234567890ab
          items:
            type: string
          type: array
      required:
        - clientManagementIds
      type: object
    BlankPushResponse:
      properties:
        errorUuids:
          example:
            - a1b2c3d4-5678-90ab-cdef-1234567890ab
            - fd68c371-5921-436e-b16b-8a3c1bf90ee5
          items:
            type: string
          type: array
      required:
        - errorUuids
      type: object
    CancelEnhancedLogCollectionCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    CertificateListCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    ClearPasscodeCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            unlockToken:
              example: VU5MT0NLVE9LRU4=
              type: string
          required:
            - unlockToken
          type: object
    ClearRestrictionsPasswordCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    DataRoamingSetting:
      enum:
        - ENABLE_DATA_ROAMING
        - DISABLE_DATA_ROAMING
      example: ENABLE_DATA_ROAMING
      type: string
    DeclarativeManagementCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            data:
              description: Base64 encoded data to be sent with the command
              example: TWFkZSB5YSBsb29r
              type: string
          type: object
    DefaultApplications:
      properties:
        calling:
          example: com.example.phone
          nullable: true
          type: string
        messaging:
          example: com.example.messages
          nullable: true
          type: string
        webBrowser:
          example: com.example.browser
          nullable: true
          type: string
      type: object
    DeleteUserCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            deleteAllUsers:
              example: true
              type: boolean
            forceDeletion:
              example: true
              type: boolean
            userName:
              example: user123
              type: string
          type: object
    DeviceInformationCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            queries:
              example:
                - DeviceName
                - BatteryLevel
                - IsSupervised
              items:
                description: List of queries specifying the information to collect from a device
                externalDocs:
                  description: For a full list of possible queries see Apple's documentation
                  url: https://developer.apple.com/documentation/devicemanagement/deviceinformationcommand/command/queries
                type: string
              minItems: 1
              type: array
          type: object
    DeviceLocationCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    DeviceLockCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            message:
              example: message123
              type: string
            phoneNumber:
              example: (123) 456-7890
              type: string
            pin:
              example: pin123
              type: string
          type: object
    DiagnosticSubmissionSetting:
      enum:
        - ENABLE_DIAGNOSTIC_SUBMISSION
        - DISABLE_DIAGNOSTIC_SUBMISSION
      example: ENABLE_DIAGNOSTIC_SUBMISSION
      type: string
    DisableLostModeCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    DisableRemoteDesktopCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            commandType:
              example: DISABLE_REMOTE_DESKTOP
              nullable: false
          type: object
    EnableLostModeCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - description: |
            Enables Lost Mode on a supervised iOS device. At least one of lostModeMessage or lostModePhone must be provided.
          properties:
            lostModeFootnote:
              description: Text displayed at the bottom of the Lock Screen.
              example: Please return to the front desk.
              type: string
            lostModeMessage:
              description: |
                Text displayed on the Lock Screen. At least one of lostModeMessage or lostModePhone must be provided.
              example: This device has been reported lost.
              type: string
            lostModePhone:
              description: |
                Phone number displayed on the Lock Screen. At least one of lostModePhone or lostModeMessage must be provided.
              example: 123-456-7890
              type: string
          type: object
    EnableRemoteDesktopCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            commandType:
              example: ENABLE_REMOTE_DESKTOP
              nullable: false
          type: object
    EraseDeviceCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            disallowProximitySetup:
              default: false
              description: If true, disable Proximity Setup on the next reboot and skip the pane in Setup Assistant. This value is available in iOS 11 and later. Prior to iOS 14, don’t use this option with any other option.
              example: true
              type: boolean
            obliterationBehavior:
              description: This key defines the fallback behavior for erasing a device.
              enum:
                - Default
                - DoNotObliterate
                - ObliterateWithWarning
                - Always
              example: Default
              type: string
            pin:
              description: The six-character PIN for Find My. This value is available in macOS 10.8 and later.
              example: "123456"
              maxLength: 6
              minLength: 6
              type: string
            preserveDataPlan:
              default: false
              description: If true, preserve the data plan on an iPhone or iPad with eSIM functionality, if one exists. This value is available in iOS 11 and later.
              example: true
              type: boolean
            returnToService:
              $ref: '#/components/schemas/ReturnToService'
          type: object
    InstalledApplicationListCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            identifiers:
              description: Array of application bundle identifiers to query. If not provided, all installed applications are returned.
              example:
                - com.example.app1
                - com.example.app2
              items:
                minLength: 1
                nullable: false
                type: string
              nullable: true
              type: array
            items:
              description: Array of keys to include in the response for each application. If not provided, default keys are returned.
              example:
                - Identifier
                - Version
                - Name
                - BundleSize
              items:
                enum:
                  - AdHocCodeSigned
                  - AppStoreVendable
                  - BetaApp
                  - BundleSize
                  - DeviceBasedVpp
                  - DistributorIdentifier
                  - DynamicSize
                  - ExternalVersionIdentifier
                  - HasUpdateAvailable
                  - Identifier
                  - Installing
                  - AppClip
                  - Validated
                  - Name
                  - ShortVersion
                  - Version
                type: string
              nullable: true
              type: array
            managedAppsOnly:
              description: If true, only managed applications are returned. If false or not provided, all applications are returned.
              example: false
              nullable: true
              type: boolean
          type: object
    LogOutUserCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    ManagedApplicationListCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            identifiers:
              description: Array of application identifiers to manage
              example:
                - com.example.app1
                - com.example.app2
                - com.example.app3
              items:
                minLength: 1
                nullable: false
                type: string
              minItems: 0
              nullable: true
              type: array
          type: object
    ManagedMediaListCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    MdmClientType:
      enum:
        - MOBILE_DEVICE
        - TV
        - VISION_PRO
        - WATCH
        - COMPUTER
        - COMPUTER_USER
        - MOBILE_DEVICE_USER
        - UNKNOWN
      example: MOBILE_DEVICE
      type: string
    MdmCommand:
      properties:
        client:
          $ref: '#/components/schemas/MdmCommandClient'
        commandError:
          $ref: '#/components/schemas/MdmCommandError'
        commandState:
          $ref: '#/components/schemas/MdmCommandState'
        commandType:
          $ref: '#/components/schemas/MdmCommandType'
        dateCompleted:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          type: string
        dateSent:
          example: "2019-05-16T20:43:43.945Z"
          format: date-time
          type: string
        profileId:
          example: 1
          type: integer
        uuid:
          example: aaaaaaaa-3f1e-4b3a-a5b3-ca0cd7430937
          type: string
      type: object
    MdmCommandBase:
      properties:
        commandType:
          $ref: '#/components/schemas/MdmCommandType'
      required:
        - commandType
      type: object
    MdmCommandClient:
      properties:
        clientType:
          $ref: '#/components/schemas/MdmClientType'
        managementId:
          example: aaaaaaaa-3f1e-4b3a-a5b3-ca0cd7430937
          type: string
      type: object
    MdmCommandClientRequest:
      properties:
        managementId:
          example: aaaaaaaa-3f1e-4b3a-a5b3-ca0cd7430937
          type: string
      type: object
    MdmCommandError:
      properties:
        errorCode:
          example: 1234
          type: integer
        errorDomain:
          example: An error occurred while processing the command.
          type: string
        errorEnglishDescription:
          example: An error occurred while processing the command.
          type: string
        errorLocalizedDescription:
          example: An error occurred while processing the command.
          type: string
      type: object
    MdmCommandRequest:
      properties:
        clientData:
          items:
            $ref: '#/components/schemas/MdmCommandClientRequest'
          type: array
        commandData:
          discriminator:
            mapping:
              APPLY_REDEMPTION_CODE: '#/components/schemas/ApplyRedemptionCodeCommand'
              CANCEL_ENHANCED_LOG_COLLECTION: '#/components/schemas/CancelEnhancedLogCollectionCommand'
              CERTIFICATE_LIST: '#/components/schemas/CertificateListCommand'
              CLEAR_PASSCODE: '#/components/schemas/ClearPasscodeCommand'
              CLEAR_RESTRICTIONS_PASSWORD: '#/components/schemas/ClearRestrictionsPasswordCommand'
              DECLARATIVE_MANAGEMENT: '#/components/schemas/DeclarativeManagementCommand'
              DELETE_USER: '#/components/schemas/DeleteUserCommand'
              DEVICE_INFORMATION: '#/components/schemas/DeviceInformationCommand'
              DEVICE_LOCATION: '#/components/schemas/DeviceLocationCommand'
              DEVICE_LOCK: '#/components/schemas/DeviceLockCommand'
              DISABLE_LOST_MODE: '#/components/schemas/DisableLostModeCommand'
              DISABLE_REMOTE_DESKTOP: '#/components/schemas/DisableRemoteDesktopCommand'
              ENABLE_LOST_MODE: '#/components/schemas/EnableLostModeCommand'
              ENABLE_REMOTE_DESKTOP: '#/components/schemas/EnableRemoteDesktopCommand'
              ERASE_DEVICE: '#/components/schemas/EraseDeviceCommand'
              INSTALLED_APPLICATION_LIST: '#/components/schemas/InstalledApplicationListCommand'
              LOG_OUT_USER: '#/components/schemas/LogOutUserCommand'
              MANAGED_APPLICATION_LIST: '#/components/schemas/ManagedApplicationListCommand'
              MANAGED_MEDIA_LIST: '#/components/schemas/ManagedMediaListCommand'
              PLAY_LOST_MODE_SOUND: '#/components/schemas/PlayLostModeSoundCommand'
              PROFILE_LIST: '#/components/schemas/ProfileListCommand'
              PROVISIONING_PROFILE_LIST: '#/components/schemas/ProvisioningProfileListCommand'
              REFRESH_CELLULAR_PLANS: '#/components/schemas/RefreshCellularPlansCommand'
              REQUEST_MIRRORING: '#/components/schemas/RequestMirroringCommand'
              RESTART_DEVICE: '#/components/schemas/RestartDeviceCommand'
              SECURITY_INFO: '#/components/schemas/SecurityInfoCommand'
              SETTINGS: '#/components/schemas/SettingsCommand'
              SET_AUTO_ADMIN_PASSWORD: '#/components/schemas/SetAutoAdminPasswordCommand'
              SET_RECOVERY_LOCK: '#/components/schemas/SetRecoveryLockCommand'
              SHUT_DOWN_DEVICE: '#/components/schemas/ShutDownDeviceCommand'
              STOP_MIRRORING: '#/components/schemas/StopMirroringCommand'
              TRIGGER_ENHANCED_LOG_COLLECTION: '#/components/schemas/TriggerEnhancedLogCollectionCommand'
              UNLOCK_USER_ACCOUNT: '#/components/schemas/UnlockUserAccountCommand'
              VALIDATE_APPLICATIONS: '#/components/schemas/ValidateApplicationsCommand'
              VERIFY_RECOVERY_LOCK: '#/components/schemas/VerifyRecoveryLockCommand'
            propertyName: commandType
          example:
            commandType: ENABLE_LOST_MODE
            lostModeFootnote: This is a footnote
            lostModeMessage: Lost Mode Message
            lostModePhone: 123-456-7890
          oneOf:
            - $ref: '#/components/schemas/ApplyRedemptionCodeCommand'
            - $ref: '#/components/schemas/CancelEnhancedLogCollectionCommand'
            - $ref: '#/components/schemas/CertificateListCommand'
            - $ref: '#/components/schemas/ClearPasscodeCommand'
            - $ref: '#/components/schemas/DeclarativeManagementCommand'
            - $ref: '#/components/schemas/DeviceInformationCommand'
            - $ref: '#/components/schemas/DeviceLocationCommand'
            - $ref: '#/components/schemas/DeviceLockCommand'
            - $ref: '#/components/schemas/DisableLostModeCommand'
            - $ref: '#/components/schemas/DisableRemoteDesktopCommand'
            - $ref: '#/components/schemas/EnableRemoteDesktopCommand'
            - $ref: '#/components/schemas/EraseDeviceCommand'
            - $ref: '#/components/schemas/ManagedApplicationListCommand'
            - $ref: '#/components/schemas/InstalledApplicationListCommand'
            - $ref: '#/components/schemas/ClearRestrictionsPasswordCommand'
            - $ref: '#/components/schemas/DeleteUserCommand'
            - $ref: '#/components/schemas/EnableLostModeCommand'
            - $ref: '#/components/schemas/LogOutUserCommand'
            - $ref: '#/components/schemas/ManagedMediaListCommand'
            - $ref: '#/components/schemas/PlayLostModeSoundCommand'
            - $ref: '#/components/schemas/ProfileListCommand'
            - $ref: '#/components/schemas/ProvisioningProfileListCommand'
            - $ref: '#/components/schemas/RefreshCellularPlansCommand'
            - $ref: '#/components/schemas/RestartDeviceCommand'
            - $ref: '#/components/schemas/RequestMirroringCommand'
            - $ref: '#/components/schemas/SecurityInfoCommand'
            - $ref: '#/components/schemas/SetAutoAdminPasswordCommand'
            - $ref: '#/components/schemas/SetRecoveryLockCommand'
            - $ref: '#/components/schemas/SettingsCommand'
            - $ref: '#/components/schemas/ShutDownDeviceCommand'
            - $ref: '#/components/schemas/StopMirroringCommand'
            - $ref: '#/components/schemas/TriggerEnhancedLogCollectionCommand'
            - $ref: '#/components/schemas/UnlockUserAccountCommand'
            - $ref: '#/components/schemas/ValidateApplicationsCommand'
            - $ref: '#/components/schemas/VerifyRecoveryLockCommand'
      type: object
    MdmCommandResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/MdmCommand'
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    MdmCommandState:
      enum:
        - PENDING
        - ACKNOWLEDGED
        - NOT_NOW
        - ERROR
        - COMMAND_FORMAT_ERROR
      example: PENDING
      type: string
    MdmCommandType:
      enum:
        - APPLY_REDEMPTION_CODE
        - CANCEL_ENHANCED_LOG_COLLECTION
        - CERTIFICATE_LIST
        - CLEAR_PASSCODE
        - CLEAR_RESTRICTIONS_PASSWORD
        - DECLARATIVE_MANAGEMENT
        - DELETE_USER
        - DEVICE_INFORMATION
        - DEVICE_LOCATION
        - DEVICE_LOCK
        - DISABLE_LOST_MODE
        - DISABLE_REMOTE_DESKTOP
        - ENABLE_LOST_MODE
        - ENABLE_REMOTE_DESKTOP
        - ERASE_DEVICE
        - INSTALLED_APPLICATION_LIST
        - LOG_OUT_USER
        - MANAGED_APPLICATION_LIST
        - MANAGED_MEDIA_LIST
        - REFRESH_CELLULAR_PLANS
        - PLAY_LOST_MODE_SOUND
        - PROFILE_LIST
        - PROVISIONING_PROFILE_LIST
        - RESTART_DEVICE
        - REQUEST_MIRRORING
        - SECURITY_INFO
        - SETTINGS
        - SET_AUTO_ADMIN_PASSWORD
        - SET_RECOVERY_LOCK
        - SHUT_DOWN_DEVICE
        - STOP_MIRRORING
        - TRIGGER_ENHANCED_LOG_COLLECTION
        - UNLOCK_USER_ACCOUNT
        - VALIDATE_APPLICATIONS
        - VERIFY_RECOVERY_LOCK
      example: ENABLE_LOST_MODE
      type: string
    PersonalHotspotSetting:
      enum:
        - ENABLE_PERSONAL_HOTSPOT
        - DISABLE_PERSONAL_HOTSPOT
      example: ENABLE_PERSONAL_HOTSPOT
      type: string
    PlayLostModeSoundCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    ProfileListCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            managedOnly:
              default: false
              description: If true, only managed configuration profiles are returned. If false, all configuration profiles are returned. The default value is false.
              example: true
              nullable: true
              type: boolean
          type: object
    ProvisioningProfileListCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            managedOnly:
              default: false
              description: If true, only managed provisioning profiles are returned. If false, all provisioning profiles are returned. The default value is false.
              example: true
              nullable: true
              type: boolean
          type: object
    RefreshCellularPlansCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            esimServerUrl:
              description: The URL of the eSIM server that the device should contact to refresh cellular plans.
              example: https://esim.example.com
              maxLength: 2048
              minLength: 1
              type: string
          required:
            - esimServerUrl
          type: object
    RequestMirroringCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            destinationDeviceId:
              description: The hardware address of the destination device to which the screen will be mirrored. This value isn’t case-sensitive. Required if destinationName is not provided.
              example: xx:xx:xx:xx:xx
              type: string
            destinationName:
              description: The name of the destination device to which the screen will be mirrored. Required if destinationDeviceId is not provided.
              example: airplay name
              type: string
            password:
              description: The screen-sharing password used to connect to the destination device.
              example: password123
              format: password
              nullable: true
              type: string
              writeOnly: true
            scanTime:
              description: The scan time which device spends in seconds to find the destination device.
              example: 30
              nullable: true
              type: integer
          type: object
    RestartDeviceCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            kextPaths:
              description: Only used if RebuildKernelCache is true
              example:
                - extension1
                - extension2
              items:
                type: string
              type: array
            notifyUser:
              example: true
              type: boolean
            rebuildKernelCache:
              example: true
              type: boolean
          type: object
    ReturnToService:
      description: The configuration settings for Return to Service.
      properties:
        bootstrapToken:
          description: Base64 encoded bootstrap token for the device.
          example: HPZC3p80IWb3XgD51W7hhUxWNwKElvvEgCgjegI=
          type: string
        enabled:
          example: true
          type: boolean
        mdmProfileData:
          description: Base64 encoded mdm profile
          example: 
          type: string
        wifiProfileData:
          description: Base64 encoded wifi profile
          example: 
          type: string
      required:
        - enabled
      type: object
    SecurityInfoCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    SetAutoAdminPasswordCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            guid:
              description: The unique identifier of the local administrator account. Must match the GUID of an administrator account that MDM created during Device Enrollment Program (DEP) enrollment.
              example: 76d765f1-651b-4032-9eea-a10e09a62d50
              type: string
            password:
              description: The new password for the local administrator account.
              example: newQuerty1234
              format: password
              minLength: 1
              type: string
              writeOnly: true
          type: object
    SetRecoveryLockCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            newPassword:
              description: The new password for Recovery Lock. Set as an empty string to clear the Recovery Lock password.
              example: newQuerty1234
              format: password
              type: string
          type: object
    SettingsCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            activationLockAllowedWhileSupervised:
              description: If true, a supervised device registers itself with Activation Lock when the user enables Find My. This setting is available for supervised devices in iOS 7 and later, and macOS 10.15 and later.
              example: true
              type: boolean
            appAnalytics:
              $ref: '#/components/schemas/AppAnalyticsSetting'
            applicationAttributes:
              $ref: '#/components/schemas/ApplicationAttributes'
            applicationConfiguration:
              $ref: '#/components/schemas/ApplicationConfiguration'
            bluetooth:
              example: true
              nullable: true
              type: boolean
            bootstrapTokenAllowed:
              deprecated: true
              description: Deprecated - BootstrapTokenAllowed is automatically managed by macOS 11 and later. This field will continue to function but is no longer necessary.
              example: true
              nullable: true
              type: boolean
            dataRoaming:
              $ref: '#/components/schemas/DataRoamingSetting'
            defaultApplications:
              $ref: '#/components/schemas/DefaultApplications'
            deviceName:
              example: My iPhone
              type: string
            diagnosticSubmission:
              $ref: '#/components/schemas/DiagnosticSubmissionSetting'
            maximumResidentUsers:
              example: 1
              nullable: true
              type: integer
            passcodeLockGracePeriod:
              description: The number of seconds before a locked screen requires the user to enter the device passcode to unlock it. (Shared iPad Only)
              example: 60
              nullable: true
              type: integer
            personalHotspot:
              $ref: '#/components/schemas/PersonalHotspotSetting'
            sharedDeviceConfiguration:
              $ref: '#/components/schemas/SharedDeviceConfiguration'
            softwareUpdateSettings:
              $ref: '#/components/schemas/SoftwareUpdateSettings'
            timeZone:
              example: America/New_York
              nullable: true
              type: string
            voiceRoaming:
              $ref: '#/components/schemas/VoiceRoamingSetting'
          type: object
    SharedDeviceConfiguration:
      properties:
        quotaSize:
          example: 2048
          nullable: true
          type: integer
        residentUsers:
          example: 3
          type: integer
      type: object
    ShutDownDeviceCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    SoftwareUpdateSettings:
      properties:
        recommendationCadence:
          enum:
            - ALLOW_ALL_UPDATES
            - ONLY_ALLOW_LEAST_CURRENT_UPDATE
            - ONLY_ALLOW_MOST_CURRENT_UPDATE
          example: ALLOW_ALL_UPDATES
          type: string
      type: object
    StopMirroringCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    TriggerEnhancedLogCollectionCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            appleCareToken:
              description: The AppleCare token the device uses for authenticating the enhanced log collection session.
              example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              minLength: 1
              type: string
          required:
            - appleCareToken
          type: object
    UnlockUserAccountCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            userName:
              description: The username of the user account to unlock
              example: user123
              type: string
          type: object
    ValidateApplicationsCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - type: object
    VerifyRecoveryLockCommand:
      allOf:
        - $ref: '#/components/schemas/MdmCommandBase'
        - properties:
            password:
              description: The password to verify.
              example: password123
              format: password
              minLength: 1
              type: string
              writeOnly: true
          type: object
    VoiceRoamingSetting:
      enum:
        - ENABLE_VOICE_ROAMING
        - DISABLE_VOICE_ROAMING
      example: ENABLE_VOICE_ROAMING
      type: string
info:
  title: Jamf Pro API - MdmCommands
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/mdm/commands:
    get:
      deprecated: true
      description: Get information about mdm commands made by Jamf Pro.
      parameters:
        - description: A list of the UUIDs of the commands being searched for.  Limited to 40 UUIDs in length. Choose one of two parameters, but not both.
          explode: true
          in: query
          name: uuids
          required: false
          schema:
            items:
              type: string
            type: array
          style: form
        - description: The client management id used to search for a list of commands. Choose one of two parameters, but not both.
          explode: true
          in: query
          name: client-management-id
          required: false
          schema:
            example: fd68c371-5921-436e-b16b-8a3c1bf90ee5
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MdmCommand'
                type: array
          description: Success
        414:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Too many UUIDs were provided in the path. The limit is set at a strict 40 UUIDs.
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: Get information about mdm commands made by Jamf Pro.
      tags:
        - mdm
      x-deprecation-date: "2023-10-16"
      x-required-privileges:
        - View MDM command information in Jamf Pro API
  /v2/mdm/blank-push:
    post:
      description: Accepts a list of client management IDs and sends a blank push notification to each. Returns a list of UUIDs that encountered errors.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlankPushRequest'
        description: A list of client management IDs to send push notifications to.
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlankPushResponse'
          description: Push notifications sent successfully, with a list of UUIDs that encountered errors.
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Invalid input provided.
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Internal server error.
      summary: Send blank push notifications to a list of client management IDs.
      tags:
        - mdm
      x-action: true
      x-required-privileges:
        - View MDM command information in Jamf Pro API
  /v2/mdm/commands:
    get:
      description: Get information about mdm commands made by Jamf Pro.
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Default sort is dateSent:asc. Multiple sort criteria are supported and must be separated with a comma.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - dateSent:asc
            items:
              type: string
            type: array
          style: form
        - description: 'Query in the RSQL format, allowing to filter, for a list of commands. All url must contain minimum one filter field. Fields allowed in the query: uuid, clientManagementId, command, status, clientType, dateSent, validAfter, dateCompleted, profileId, profileIdentifier, and active. This param can be combined with paging. Please note that any date filters must be used with gt, lt, ge, le Example: clientManagementId==fb511aae-c557-474f-a9c1-5dc845b90d0f;status==Pending;command==INSTALL_PROFILE;uuid==9e18f849-e689-4f2d-b616-a99d3da7db42;clientType==COMPUTER_USER;profileId==1;profileIdentifier==18cc61c2-01fc-11ed-b939-0242ac120002;dateCompleted=ge=2021-08-04T14:25:18.26Z;dateCompleted=le=2021-08-04T14:25:18.26Z;validAfter=ge=2021-08-05T14:25:18.26Z;active==true'
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdmCommandResults'
          description: Success
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to complete lookup.
      summary: |
        Get information about mdm commands made by Jamf Pro.
      tags:
        - mdm
      x-required-privileges:
        - View MDM command information in Jamf Pro API
    post:
      description: Provided an MDM command type and appropriate information, will create and then queue said command. A separate privilege is required for each device type and MDM command you want to view or send.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MdmCommandRequest'
        description: The mdm command object to create and queue
      responses:
        201:
          content:
            application/json:
              schema:
                items:
                  $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
                type: array
          description: Success
        500:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Failure, unable to queue command.
      summary: |
        Post a command for creation and queuing
      tags:
        - mdm
      x-action: true
      x-required-privileges:
        - View MDM command information in Jamf Pro API
servers:
  - url: /api
