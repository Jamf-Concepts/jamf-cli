components:
  schemas:
    PatchReportV3:
      properties:
        buildingName:
          example: Building
          nullable: true
          type: string
        computerName:
          example: MacBook
          nullable: true
          type: string
        departmentName:
          example: Department
          nullable: true
          type: string
        deviceId:
          example: "2"
          nullable: true
          type: string
        lastCheckIn:
          example: "1970-01-01T00:00:00Z"
          format: date-time
          nullable: true
          type: string
        operatingSystemVersion:
          example: "10.11"
          nullable: true
          type: string
        siteName:
          example: Site
          nullable: true
          type: string
        username:
          example: User
          nullable: true
          type: string
        version:
          example: "10.1"
          nullable: true
          type: string
      type: object
    PatchSoftwareTitleConfiguration:
      allOf:
        - $ref: '#/components/schemas/PatchSoftwareTitleConfigurationBase'
        - properties:
            id:
              example: "1"
              nullable: false
              type: string
            packages:
              items:
                $ref: '#/components/schemas/PatchSoftwareTitlePackages'
              type: array
          type: object
    PatchSoftwareTitleConfigurationBase:
      properties:
        categoryId:
          default: "-1"
          example: "-1"
          type: string
        displayName:
          example: Google Chrome
          nullable: false
          type: string
        emailNotifications:
          default: false
          example: false
          type: boolean
        extensionAttributes:
          items:
            $ref: '#/components/schemas/PatchSoftwareTitleConfigurationExtensionAttributes'
          type: array
        jamfOfficial:
          example: false
          readOnly: true
          type: boolean
        patchSourceEnabled:
          example: true
          readOnly: true
          type: boolean
        patchSourceName:
          example: Jamf
          readOnly: true
          type: string
        siteId:
          default: "-1"
          example: "-1"
          type: string
        softwareTitleId:
          example: "1"
          nullable: false
          type: string
        softwareTitleName:
          example: Safari
          readOnly: true
          type: string
        softwareTitleNameId:
          example: AppleSafari
          readOnly: true
          type: string
        softwareTitlePublisher:
          example: Apple
          readOnly: true
          type: string
        uiNotifications:
          default: false
          example: false
          type: boolean
      required:
        - displayName
        - softwareTitleId
      type: object
    PatchSoftwareTitleConfigurationDefinitionKillApp:
      properties:
        appName:
          example: Firefox
          type: string
      type: object
    PatchSoftwareTitleConfigurationDependencies:
      properties:
        results:
          items:
            $ref: '#/components/schemas/PatchSoftwareTitleConfigurationDependency'
          type: array
        totalCount:
          example: 1
          nullable: false
          type: integer
      type: object
    PatchSoftwareTitleConfigurationDependency:
      properties:
        smartGroupId:
          example: "1"
          nullable: false
          type: string
        smartGroupName:
          example: name
          type: string
      type: object
    PatchSoftwareTitleConfigurationExtensionAttributes:
      properties:
        accepted:
          default: false
          description: Once an extension attribute is accepted, it cannot be reverted.
          example: false
          type: boolean
        eaId:
          example: google-chrome-ea
          nullable: false
          type: string
      type: object
    PatchSoftwareTitleConfigurationPatch:
      properties:
        categoryId:
          example: "-1"
          type: string
        displayName:
          example: Google Chrome
          type: string
        emailNotifications:
          example: false
          type: boolean
        extensionAttributes:
          items:
            $ref: '#/components/schemas/PatchSoftwareTitleConfigurationExtensionAttributes'
          type: array
        packages:
          items:
            $ref: '#/components/schemas/PatchSoftwareTitlePackages'
          type: array
        siteId:
          example: "-1"
          type: string
        softwareTitleId:
          example: "1"
          type: string
        uiNotifications:
          example: false
          type: boolean
      type: object
    PatchSoftwareTitleDefinition:
      properties:
        absoluteOrderId:
          example: "1"
          type: string
        killApps:
          items:
            $ref: '#/components/schemas/PatchSoftwareTitleConfigurationDefinitionKillApp'
          type: array
        minimumOperatingSystem:
          default: "-1"
          example: 12.0.1
          type: string
        rebootRequired:
          default: false
          example: false
          type: boolean
        releaseDate:
          default: "-1"
          example: "2010-12-10 13:36:04"
          type: string
        standalone:
          default: false
          example: false
          type: boolean
        version:
          example: 10.37.0
          nullable: false
          type: string
      type: object
    PatchSoftwareTitleDefinitions:
      properties:
        results:
          items:
            $ref: '#/components/schemas/PatchSoftwareTitleDefinition'
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    PatchSoftwareTitleExtensionAttributes:
      properties:
        accepted:
          example: true
          type: boolean
        displayName:
          example: Google Chrome
          type: string
        eaId:
          example: google-chrome-ea
          nullable: false
          type: string
        scriptContents:
          example: ZXhhbXBsZSBvZiBhIGJhc2U2NCBlbmNvZGVkIHZhbGlkIHAxMi4ga2V5c3RvcmUgZmlsZQ==
          format: base64
          type: string
      type: object
    PatchSoftwareTitlePackages:
      properties:
        displayName:
          example: Firefox.pkg
          readOnly: true
          type: string
        packageId:
          example: "1"
          nullable: false
          type: string
        version:
          example: "1"
          nullable: false
          type: string
      type: object
    PatchSoftwareTitleReport:
      properties:
        buildingName:
          example: Building
          type: string
        computerName:
          example: MacBook
          type: string
        departmentName:
          example: Department
          type: string
        deviceId:
          example: "2"
          type: string
        lastContactTime:
          example: "1970-01-01T00:00:00Z"
          format: date-time
          type: string
        operatingSystemVersion:
          example: "10.11"
          type: string
        siteName:
          example: Site
          type: string
        username:
          example: User
          type: string
        version:
          example: "10.1"
          type: string
      type: object
    PatchSoftwareTitleReportSearchResult:
      properties:
        results:
          items:
            $ref: '#/components/schemas/PatchSoftwareTitleReport'
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
    PatchSoftwareTitleReportV3SearchResult:
      properties:
        results:
          items:
            $ref: '#/components/schemas/PatchReportV3'
          type: array
        totalCount:
          example: 3
          minimum: 0
          type: integer
      type: object
    PatchSummary:
      properties:
        latestVersion:
          example: "2"
          type: string
        onDashboard:
          example: false
          type: boolean
        outOfDate:
          example: 6
          type: integer
        releaseDate:
          example: "2018-10-15T16:39:56.307Z"
          format: date-time
          type: string
        softwareTitleConfigurationId:
          example: "1"
          type: string
        softwareTitleId:
          example: "1"
          type: string
        title:
          example: Patch title
          type: string
        upToDate:
          example: 3
          type: integer
      type: object
    PatchSummaryVersion:
      properties:
        absoluteOrderId:
          example: "1"
          type: string
        onVersion:
          example: 1
          type: integer
        version:
          example: "3"
          type: string
      type: object
    SoftwareTitleConfigurationOnDashboard:
      properties:
        onDashboard:
          example: true
          nullable: false
          type: boolean
      type: object
