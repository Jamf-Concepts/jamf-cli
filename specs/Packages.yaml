components:
  schemas:
    Package:
      properties:
        basePath:
          example: my/path
          nullable: true
          type: string
        categoryId:
          example: "-1"
          type: string
        cloudTransferStatus:
          example: READY
          readOnly: true
          type: string
        fileName:
          example: my-package.pkg
          type: string
        fillExistingUsers:
          example: false
          type: boolean
        fillUserTemplate:
          example: false
          type: boolean
        format:
          example: format
          nullable: true
          type: string
        hashType:
          example: MD5
          nullable: true
          type: string
        hashValue:
          example: 0cc175b9c0f1b6a831c399e269772661
          nullable: true
          type: string
        id:
          example: "1"
          readOnly: true
          type: string
        ignoreConflicts:
          example: false
          type: boolean
        indexed:
          example: false
          readOnly: true
          type: boolean
        info:
          example: A package that is important to my organization.
          nullable: true
          type: string
        installLanguage:
          example: en_US
          nullable: true
          type: string
        manifest:
          example: manifest
          nullable: true
          type: string
        manifestFileName:
          example: manifest.plist
          nullable: true
          type: string
        md5:
          example: 0cc175b9c0f1b6a831c399e269772661
          nullable: true
          type: string
        notes:
          example: Some notes.
          nullable: true
          type: string
        osInstall:
          example: false
          type: boolean
        osInstallerVersion:
          example: 10.3.x
          nullable: true
          type: string
        osRequirements:
          example: 10.6.8, 10.7.x
          nullable: true
          type: string
        packageName:
          example: Google Chrome
          type: string
        parentPackageId:
          example: "3"
          nullable: true
          type: string
        priority:
          example: 3
          type: integer
        rebootRequired:
          example: false
          type: boolean
        selfHealNotify:
          example: false
          type: boolean
        selfHealingAction:
          example: nothing
          nullable: true
          type: string
        serialNumber:
          example: "1234"
          nullable: true
          type: string
        sha256:
          example: 61be55a8e2f6b4e172338bddf184d6dbee29c98853e0a0485ecee7f27b9af0b4
          nullable: true
          type: string
        sha3512:
          example: a51a01e63f76c4601a2989575280e2a1c1e83191382277906b0f92a251c53bbbd1d9804dd30edd304cffe75d1c6455440b0c39081ca94c68f149d1f719e15092
          nullable: true
          type: string
        size:
          example: 234KB
          nullable: true
          readOnly: true
          type: string
        suppressEula:
          example: false
          type: boolean
        suppressFromDock:
          example: false
          type: boolean
        suppressRegistration:
          example: false
          type: boolean
        suppressUpdates:
          example: false
          type: boolean
        swu:
          example: false
          type: boolean
      required:
        - categoryId
        - fileName
        - fillUserTemplate
        - osInstall
        - packageName
        - priority
        - rebootRequired
        - suppressEula
        - suppressFromDock
        - suppressRegistration
        - suppressUpdates
      type: object
    PackagesSearchResults:
      properties:
        results:
          items:
            $ref: '#/components/schemas/Package'
          minItems: 0
          type: array
        totalCount:
          example: 1
          type: integer
      type: object
info:
  title: Jamf Pro API - Packages
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/packages:
    get:
      description: Retrieves packages
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Sorts results by one or more criteria, following the format property:asc/desc. Default sort is ID:asc. If using multiple criteria, separate with commas.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - id:asc
            items:
              type: string
            type: array
          style: form
        - description: 'Filters results. Use RSQL format for query. Allows for many fields, including ID, name, etc. Can be combined with paging and sorting. Fields allowed in the query: id, fileName, packageName, categoryId, info, notes, manifestFileName, cloudTransferStatus. Default filter is an empty query and returns all results from the requested page.'
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackagesSearchResults'
          description: Success
      summary: Retrieve Packages
      tags:
        - packages
      x-required-privileges:
        - Read Packages
    post:
      description: Create package
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Package'
        description: Package to be created
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Package was created
      summary: Create package
      tags:
        - packages
      x-required-privileges:
        - Create Packages
  /v1/packages/delete-multiple:
    post:
      description: IDs of the packages to be deleted
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/Ids
        description: ids of the package to be deleted
        required: true
      responses:
        204:
          description: All specified packages deleted successfully
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Returns error codes and IDs for any packages that were unable to be deleted. Possible error codes include INVALID_ID (Package ID does not exist) and SYSTEM_EXCEPTION (A system exception occurred while attempting to delete the package).
      summary: Delete multiple packages at once
      tags:
        - packages
      x-action: true
      x-required-privileges:
        - Delete Packages
  /v1/packages/export:
    post:
      description: |
        Export Packages collection
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/export-fields
        - $ref: _MonolithLibrary.yaml#/components/parameters/export-labels
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Sorts results by one or more criteria, following the format property:asc/desc. Default sort is ID:asc. If using multiple criteria, separate with commas.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - id:asc
            items:
              type: string
            type: array
          style: form
        - description: Filters results. Use RSQL format for query. Allows for many fields, including ID, name, etc. Can be combined with paging and sorting. Default filter is an empty query and returns all results from the requested page.
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/ExportParameters
        description: Optional. Can be used to override query parameters so that the URI does not exceed the 2,000 character limit.
        required: false
      responses:
        200:
          content:
            text/csv:
              schema:
                example: |
                  id,packageName
                  1,Chrome
                  2,Firefox
                format: binary
          description: Export successful
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Could not export. List may contain a non-existing column or a duplicate.
        503:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Export currently unavailable. All export-related resources are in use. Try again later.
      summary: |
        Export Packages collection
      tags:
        - packages
      x-action: true
      x-required-privileges:
        - Read Packages
  /v1/packages/{id}:
    delete:
      description: |
        Removes specified package
      parameters:
        - description: Instance ID of package
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: Package deleted successfully
      summary: |
        Remove specified package
      tags:
        - packages
      x-required-privileges:
        - Delete Packages
    get:
      description: |
        Gets specified Package object
      parameters:
        - description: instance id of package
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
          description: Package details found
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified package object could not be found
      summary: |
        Get specified Package object
      tags:
        - packages
      x-required-privileges:
        - Read Packages
    put:
      description: |
        Update specified package object
      parameters:
        - description: Instance ID of package
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Package'
        description: Package object to update. IDs defined in this body will be ignored
        required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
          description: Package update
      summary: |
        Update specified package object
      tags:
        - packages
      x-required-privileges:
        - Update Packages
  /v1/packages/{id}/history:
    get:
      description: |
        Gets specified Package history object
      parameters:
        - description: Instance ID of package history
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Sorts results by one or more criteria, following the format property:asc/desc. Default sort is ID:asc. If using multiple criteria, separate with commas.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - date:desc
            items:
              type: string
            type: array
          style: form
        - description: Filters results. Use RSQL format for query. Allows for many fields, including ID, name, etc. Can be combined with paging and sorting. Default filter is an empty query and returns all results from the requested page.
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HistorySearchResults
          description: Details of package history were found
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified package history object could not be found
      summary: |
        Get specified Package History object
      tags:
        - packages
      x-required-privileges:
        - Read Packages
    post:
      description: |
        Adds specified Package history object notes
      parameters:
        - description: Instance ID of package history
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistoryNote
        description: History note to be created
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ObjectHistory
          description: Package history note created successfully
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Package history note could not be found
        503:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Package history note could not be saved
      summary: |
        Add specified Package history object notes
      tags:
        - packages
      x-required-privileges:
        - Update Packages
  /v1/packages/{id}/history/export:
    post:
      description: |
        Export history object collection in specified format for specified Packages
      parameters:
        - $ref: _MonolithLibrary.yaml#/components/parameters/export-fields
        - $ref: _MonolithLibrary.yaml#/components/parameters/export-labels
        - description: Instance ID of package history note
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
        - $ref: _MonolithLibrary.yaml#/components/parameters/page
        - $ref: _MonolithLibrary.yaml#/components/parameters/page-size
        - description: Sorts results by one or more criteria, following the format property:asc/desc. Default sort is ID:asc. If using multiple criteria, separate with commas.
          explode: true
          in: query
          name: sort
          required: false
          schema:
            default:
              - date:desc
            items:
              type: string
            type: array
          style: form
        - description: Filters results. Use RSQL format for query. Allows for many fields, including ID, name, etc. Can be combined with paging and sorting. Default filter is an empty query and returns all results from the requested page.
          explode: true
          in: query
          name: filter
          required: false
          schema:
            default: ""
            type: string
          style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: _MonolithLibrary.yaml#/components/schemas/ExportParameters
        description: Optional. Can be used to override query parameters so that the URI does not exceed the 2,000 character limit.
        required: false
      responses:
        200:
          content:
            text/csv:
              schema:
                example: |
                  id,username,date,note,details
                  1,admin,2019-02-04 21:09:31,Packages update,Some details
                format: binary
          description: Export successful
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Could not export. List may contain a non-existing column or a duplicate.
        503:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Export currently unavailable. All export-related resources are in use. Try again later.
      summary: |
        Export history object collection in specified format for specified Packages
      tags:
        - packages
      x-action: true
      x-required-privileges:
        - Read Packages
  /v1/packages/{id}/manifest:
    delete:
      description: |
        Delete the manifest file for a specified package
      parameters:
        - description: Id of the package to delete manifest from
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: Package manifest deleted successfully
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Package with that id does not exist
      summary: |
        Delete the manifest for a specified package
      tags:
        - packages
      x-required-privileges:
        - Update Packages
        - Read Packages
    post:
      description: Add a manifest to a package
      parameters:
        - description: Id of the package the manifest should be assigned to
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: The manifest file to upload
                  format: binary
                  type: string
              required:
                - file
              type: object
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
          description: Success
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Package with that id does not exist
        413:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Payload Too Large
      summary: |
        Add a manifest to a package
      tags:
        - packages
      x-required-privileges:
        - Update Packages
        - Read Packages
  /v1/packages/{id}/upload:
    post:
      description: Uploads a package
      parameters:
        - description: instance id of package
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: The file to upload
                  format: binary
                  type: string
              required:
                - file
              type: object
        required: true
      responses:
        201:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Successfully uploaded package
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Specified package object does not exist.
      summary: Upload package
      tags:
        - packages
      x-action: true
      x-required-privileges:
        - Update Packages
        - Read Packages
servers:
  - url: /api
