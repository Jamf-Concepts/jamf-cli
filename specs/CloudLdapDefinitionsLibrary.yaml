openapi: 3.0.1
info:
  title: Jamf Pro API - Definitions Library
  description: These definitions exist to be re-used by other Cloud Identity Provider
    Swagger files.
  version: 0.0.1
paths: { }
components:
  schemas:

    CloudIdPCommon:
      required:
        - id
        - displayName
        - providerName
      type: object
      properties:
        id:
          type: string
          minimum: 1001
          example: "1001"
        displayName:
          type: string
          example: Cloud Identity Provider
        providerName:
          type: string
          example: PROVIDER
          enum:
            - GOOGLE
            - AZURE
      description: A Cloud Identity Provider information

    CloudIdPCommonRequest:
      required:
        - displayName
        - providerName
      type: object
      properties:
        displayName:
          type: string
          example: Cloud Identity Provider
        providerName:
          type: string
          example: PROVIDER
          enum:
            - GOOGLE
            - AZURE
      description: A Cloud Identity Provider information for request

    CloudIdPCommonResponse:
      type: object
      properties:
        id:
          type: string
          minimum: 1001
          example: 1001
        displayName:
          type: string
          example: Cloud Identity Provider
        enabled:
          type: boolean
          example: true
        providerName:
          type: string
          example: PROVIDER
          enum:
            - GOOGLE
            - AZURE
        providerDescription:
          type: string
          example: Entra ID
      description: A Cloud Identity Provider information for responses

    LdapConfigurationResponse:
      required:
        - cloudIdPCommon
        - server
      type: object
      properties:
        cloudIdPCommon:
          $ref: '#/components/schemas/CloudIdPCommon'
        server:
          $ref: '#/components/schemas/CloudLdapServerResponse'
        mappings:
          $ref: '#/components/schemas/CloudLdapMappingsResponse'
      description: A Cloud Identity Provider LDAP configuration for responses

    LdapConfigurationRequest:
      required:
        - cloudIdPCommon
        - server
      type: object
      properties:
        cloudIdPCommon:
          $ref: '#/components/schemas/CloudIdPCommonRequest'
        server:
          $ref: '#/components/schemas/CloudLdapServerRequest'
        mappings:
          $ref: '#/components/schemas/CloudLdapMappingsRequest'
      description: A Cloud Identity Provider LDAP configuration for requests

    LdapConfigurationUpdate:
      required:
        - cloudIdPCommon
        - server
      type: object
      properties:
        cloudIdPCommon:
          $ref: '#/components/schemas/CloudIdPCommon'
        server:
          $ref: '#/components/schemas/CloudLdapServerUpdate'
        mappings:
          $ref: '#/components/schemas/CloudLdapMappingsRequest'
      description: A Cloud Identity Provider LDAP configuration for updates

    AzureConfiguration:
      required:
        - cloudIdPCommon
        - server
      type: object
      properties:
        cloudIdPCommon:
          $ref: '#/components/schemas/CloudIdPCommon'
        server:
          $ref: '#/components/schemas/AzureServerConfiguration'
      description: A Cloud Identity Provider Azure configuration for responses

    AzureConfigurationRequest:
      required:
        - cloudIdPCommon
        - server
      type: object
      properties:
        cloudIdPCommon:
          $ref: '#/components/schemas/CloudIdPCommonRequest'
        server:
          $ref: '#/components/schemas/AzureServerConfigurationRequest'
      description: A Cloud Identity Provider Azure configuration for responses

    AzureConfigurationUpdate:
      required:
        - cloudIdPCommon
        - server
      type: object
      properties:
        cloudIdPCommon:
          $ref: '#/components/schemas/CloudIdPCommon'
        server:
          $ref: '#/components/schemas/AzureServerConfigurationUpdate'
      description: A Cloud Identity Provider Azure configuration for update

    ConfigurationSearchResults:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/CloudIdPCommonResponse'
      description: A list with Cloud Identity Providers informations about configurations

    CloudLdapServerRequest:
      required:
        - connectionTimeout
        - connectionType
        - enabled
        - domainName
        - useWildcards
        - keystore
        - port
        - searchTimeout
        - serverUrl
      type: object
      properties:
        serverUrl:
          type: string
          example: ldap.google.com
        enabled:
          type: boolean
          example: true
        domainName:
          type: string
          example: jamf.com
        port:
          maximum: 65535
          minimum: 1
          type: integer
          example: 636
        keystore:
          $ref: '#/components/schemas/CloudLdapKeystoreFile'
        connectionTimeout:
          maximum: 6E+2
          minimum: 5
          type: integer
          example: 15
        searchTimeout:
          maximum: 6E+2
          minimum: 5
          type: integer
          example: 60
        useWildcards:
          type: boolean
          example: true
        connectionType:
          type: string
          enum:
            - LDAPS
            - START_TLS
          example: LDAPS
        membershipCalculationOptimizationEnabled:
            type: boolean
            example: true
      description: A Cloud Identity Provider LDAP server configuration for requests

    CloudLdapServerUpdate:
      required:
        - connectionTimeout
        - enabled
        - connectionType
        - useWildcards
        - port
        - providerName
        - domainName
        - searchTimeout
        - serverUrl
      type: object
      properties:
        serverUrl:
          type: string
          example: ldap.google.com
        enabled:
          type: boolean
          example: true
        domainName:
          type: string
          example: jamf.com
        port:
          maximum: 65535
          minimum: 1
          type: integer
          example: 636
        keystore:
          $ref: '#/components/schemas/CloudLdapKeystoreFile'
        connectionTimeout:
          minimum: 1
          type: integer
          example: 15
        searchTimeout:
          minimum: 1
          type: integer
          example: 60
        useWildcards:
          type: boolean
          example: true
        connectionType:
          type: string
          enum:
            - LDAPS
            - START_TLS
          example: LDAPS
        membershipCalculationOptimizationEnabled:
            type: boolean
            example: true
      description: A Cloud Identity Provider LDAP server configuration for updates

    CloudLdapServerResponse:
      type: object
      properties:
        id:
          type: string
          example: 1001
        enabled:
          type: boolean
          example: true
        serverUrl:
          type: string
          example: ldap.google.com
        domainName:
          type: string
          example: jamf.com
        port:
          maximum: 65535
          minimum: 1
          type: integer
          example: 636
        keystore:
          $ref: '#/components/schemas/CloudLdapKeystore'
        connectionTimeout:
          minimum: 5
          type: integer
          example: 15
        searchTimeout:
          minimum: 5
          type: integer
          example: 60
        useWildcards:
          type: boolean
          example: true
        connectionType:
          type: string
          enum:
            - LDAPS
            - START_TLS
          example: LDAPS
        membershipCalculationOptimizationEnabled:
            type: boolean
            example: true
      description: A Cloud Identity Provider LDAP server configuration for responses

    CloudLdapMappingsResponse:
      type: object
      properties:
        userMappings:
          $ref: '#/components/schemas/UserMappings'
        groupMappings:
          $ref: '#/components/schemas/GroupMappings'
        membershipMappings:
          $ref: '#/components/schemas/MembershipMappings'
      description: Mappings configuration response for Ldap Cloud Identity Provider configuration

    CloudLdapMappingsRequest:
      required:
        - userMappings
        - groupMappings
        - membershipMappings
      type: object
      properties:
        userMappings:
          $ref: '#/components/schemas/UserMappings'
        groupMappings:
          $ref: '#/components/schemas/GroupMappings'
        membershipMappings:
          $ref: '#/components/schemas/MembershipMappings'
      description: Mappings configurations request for Ldap Cloud Identity Provider configuration

    UserMappings:
      required:
        - userID
        - username
        - realName
        - emailAddress
        - department
        - building
        - room
        - phone
        - position
        - userUuid
        - objectClassLimitation
        - objectClasses
        - searchBase
        - searchScope
      type: object
      properties:
        objectClassLimitation:
          type: string
          enum:
            - ANY_OBJECT_CLASSES
            - ALL_OBJECT_CLASSES
          example: ANY_OBJECT_CLASSES
        objectClasses:
          type: string
          example: inetOrgPerson
        searchBase:
          type: string
          example: ou=Users
        searchScope:
          type: string
          enum:
            - ALL_SUBTREES
            - FIRST_LEVEL_ONLY
          example: ALL_SUBTREES
        additionalSearchBase:
          type: string
          default: ''
        userID:
          type: string
          example: mail
        username:
          type: string
          example: uid
        realName:
          type: string
          example: displayName
        emailAddress:
          type: string
          example: mail
        department:
          type: string
          example: departmentNumber
        building:
          type: string
          default: ''
        room:
          type: string
          default: ''
        phone:
          type: string
          default: ''
        position:
          type: string
          example: title
        userUuid:
          type: string
          example: uid
      description: Cloud Identity Provider user mappings configuration

    GroupMappings:
      required:
        - groupID
        - groupName
        - groupUuid
        - objectClassLimitation
        - objectClasses
        - searchBase
        - searchScope
      type: object
      properties:
        objectClassLimitation:
          type: string
          enum:
            - ANY_OBJECT_CLASSES
            - ALL_OBJECT_CLASSES
          example: ANY_OBJECT_CLASSES
        objectClasses:
          type: string
          example: groupOfNames
        searchBase:
          type: string
          example: ou=Groups
        searchScope:
          type: string
          enum:
            - ALL_SUBTREES
            - FIRST_LEVEL_ONLY
          example: ALL_SUBTREES
        groupID:
          type: string
          example: cn
        groupName:
          type: string
          example: cn
        groupUuid:
          type: string
          example: gidNumber
      description: Cloud Identity Provider user group mappings configuration

    MembershipMappings:
      required:
        - groupMembershipMapping
      type: object
      properties:
        groupMembershipMapping:
          type: string
          example: memberOf
      description: Cloud Identity Provider user group membership mappings configuration

    CloudLdapKeystore:
      type: object
      properties:
        type:
          type: string
          example: PKCS12
        expirationDate:
          type: string
          format: date-time
          example: 2030-02-21T12:05:47.244Z
        subject:
          type: string
          example: ST=California, C=US, OU=GSuite, CN=LDAP Client, L=Mountain View, O=Google Inc.
        fileName:
          type: string
          example: keystore.p12
      description: Response with keystore information

    CloudLdapKeystoreFile:
      required:
        - fileBytes
        - fileName
        - password
      type: object
      properties:
        password:
          type: string
          format: password
          example: "***"
          writeOnly: true
        fileBytes:
          example: ZXhhbXBsZSBvZiBhIGJhc2U2NCBlbmNvZGVkIHZhbGlkIHAxMi4ga2V5c3RvcmUgZmlsZQ==
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          type: string
          format: byte
        fileName:
          type: string
          example: keystore.p12
      description: Request with the Base64-encoded keystore file

    CloudLdapConnectionPoolStatistics:
      type: object
      properties:
        numConnectionsClosedDefunct:
          type: integer
          format: int64
          example: 1
        numConnectionsClosedExpired:
          type: integer
          format: int64
          example: 1
        numConnectionsClosedUnneeded:
          type: integer
          format: int64
          example: 1
        numFailedCheckouts:
          type: integer
          format: int64
          example: 1
        numFailedConnectionAttempts:
          type: integer
          format: int64
          example: 1
        numReleasedValid:
          type: integer
          format: int64
          example: 1
        numSuccessfulCheckouts:
          type: integer
          format: int64
          example: 1
        numSuccessfulCheckoutsNewConnection:
          type: integer
          format: int64
          example: 1
        numSuccessfulConnectionAttempts:
          type: integer
          format: int64
          example: 1
        maximumAvailableConnections:
          type: integer
          format: int64
          example: 1
        numSuccessfulCheckoutsWithoutWaiting:
          type: integer
          format: int64
          example: 1
        numSuccessfulCheckoutsAfterWaiting:
          type: integer
          format: int64
          example: 1
        numAvailableConnections:
          type: integer
          format: int64
          example: 1
      description: Ldap Cloud Identity Provider conection pool statistics

    UserTestSearchRequest:
      required:
        - username
      type: object
      properties:
        username:
          type: string
          example: admin

    GroupTestSearchRequest:
      required:
        - groupname
      type: object
      properties:
        groupname:
          type: string
          example: users

    MembershipTestSearchRequest:
      required:
        - username
        - groupname
      type: object
      properties:
        username:
          type: string
          example: admin
        groupname:
          type: string
          example: users

    MembershipTestSearchResponse:
      type: object
      properties:
        username:
          type: string
          example: admin
        isMember:
          type: boolean
          example: true

    GroupTestSearchResponse:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/GroupTestSearch'

    GroupTestSearch:
      type: object
      properties:
        distinguishedName:
          type: string
          example: cn=users,ou=Groups,dc=jamf,dc=com
        id:
          type: string
          example: users
        uuid:
          type: string
          example: 121100023
        serverId:
          type: string
          example: "1001"
        name:
          type: string
          example: users

    UserTestSearchResponse:
      type: object
      properties:
        totalCount:
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserTestSearch'

    UserTestSearch:
      type: object
      properties:
        distinguishedName:
          type: string
          example: uid=admin,ou=Users,dc=jamf,dc=com
        id:
          type: string
          example: admin@jamf.com
        uuid:
          type: string
          example: admin
        serverId:
          type: string
          example: "1001"
        name:
          type: string
          example: admin
        attributes:
          $ref: '#/components/schemas/UserTestAttributes'

    UserTestAttributes:
      type: object
      properties:
        fullName:
          type: string
          example: Bob
        emailAddress:
          type: string
          example: bob@jamf.com
        phoneNumber:
          type: string
          example: 123456789
        position:
          type: string
          example: SE
        room:
          type: string
          example: 1
        buildingName:
          type: string
          example: Jamf
        departmentName:
          type: string
          example: Engineering

    AzureServerConfigurationRequest:
      required:
        - tenantId
        - enabled
        - mappings
        - searchTimeout
        - transitiveMembershipEnabled
        - transitiveMembershipUserField
        - transitiveDirectoryMembershipEnabled
        - code
      type: object
      properties:
        id:
          type: string
          minimum: 1001
          example: "1001"
          readOnly: true
        tenantId:
          type: string
          example: db65d325-0350-4a17-9af9-b302d0fc386b
        enabled:
          type: boolean
          example: true
        mappings:
          $ref: '#/components/schemas/AzureMappings'
        searchTimeout:
          type: integer
          example: 30
          minimum: 5
          maximum: 600
        transitiveMembershipEnabled:
          type: boolean
          example: false
          description: Use this field to enable transitive membership lookup with Single Sign On
        transitiveMembershipUserField:
          type: string
          example: userPrincipalName
          description: Use this field to set user field mapping for transitive membership lookup with Single Sign On
        transitiveDirectoryMembershipEnabled:
          type: boolean
          example: false
          description: Use this field to enable transitive membership lookup. This setting would not apply to Single Sign On
        membershipCalculationOptimizationEnabled:
          type: boolean
          example: true
          description: Use this field to enable membership calculation optimization. This setting would not apply to Single Sign On
        code:
          type: string
          example: auth
        type:
          type: string
          description: Type of Entra ID connection
          example: PUBLIC
          enum:
            - PUBLIC
            - GCC_HIGH

      description: Azure Cloud Identity Provider configuration request

    AzureServerConfiguration:
      required:
        - id
        - tenantId
        - enabled
        - deprecatedConsent
        - migrated
        - mappings
        - searchTimeout
        - transitiveMembershipEnabled
        - transitiveMembershipUserField
        - transitiveDirectoryMembershipEnabled
      type: object
      properties:
        id:
          type: string
          minimum: 1001
          example: "1001"
        tenantId:
          type: string
          example: db65d325-0350-4a17-9af9-b302d0fc386b
        enabled:
          type: boolean
          example: true
        deprecatedConsent:
            type: boolean
            example: true
        migrated:
          type: boolean
          example: true
        mappings:
          $ref: '#/components/schemas/AzureMappings'
        searchTimeout:
          type: integer
          example: 30
          minimum: 5
          maximum: 600
        transitiveMembershipEnabled:
          type: boolean
          example: false
          description: Use this field to enable transitive membership lookup with Single Sign On
        transitiveMembershipUserField:
          type: string
          example: userPrincipalName
          description: Use this field to set user field mapping for transitive membership lookup with Single Sign On
        transitiveDirectoryMembershipEnabled:
          type: boolean
          example: false
          description: Use this field to enable transitive membership lookup. This setting would not apply to Single Sign On
        membershipCalculationOptimizationEnabled:
          type: boolean
          example: true
          description: Use this field to enable membership calculation optimization. This setting would not apply to Single Sign On
        type:
          type: string
          description: Type of Entra ID connection
          example: PUBLIC
          enum:
            - PUBLIC
            - GCC_HIGH
      description: Azure Cloud Identity Provider configuration

    AzureServerConfigurationUpdate:
      required:
        - id
        - enabled
        - mappings
        - searchTimeout
        - transitiveMembershipEnabled
        - transitiveMembershipUserField
        - transitiveDirectoryMembershipEnabled
      type: object
      properties:
        id:
          type: string
          minimum: 1001
          example: "1001"
        enabled:
          type: boolean
          example: true
        mappings:
          $ref: '#/components/schemas/AzureMappings'
        searchTimeout:
          type: integer
          example: 30
          minimum: 5
          maximum: 600
        transitiveMembershipEnabled:
          type: boolean
          example: false
          description: Use this field to enable transitive membership lookup with Single Sign On
        transitiveMembershipUserField:
          type: string
          example: userPrincipalName
          description: Use this field to set user field mapping for transitive membership lookup with Single Sign On
        transitiveDirectoryMembershipEnabled:
          type: boolean
          example: false
          description: Use this field to enable transitive membership lookup. This setting would not apply to Single Sign On
        membershipCalculationOptimizationEnabled:
          type: boolean
          example: true
          description: Use this field to enable membership calculation optimization. This setting would not apply to Single Sign On
      description: Azure Cloud Identity Provider configuration update

    AzureMappings:
      required:
        - userId
        - userName
        - realName
        - email
        - department
        - building
        - room
        - phone
        - position
        - groupId
        - groupName
      type: object
      properties:
        userId:
          type: string
          example: id
        userName:
          type: string
          example: userPrincipalName
        realName:
          type: string
          example: displayName
        email:
          type: string
          example: mail
        department:
          type: string
          example: department
        building:
          type: string
          example: companyName
        room:
          type: string
          example: officeLocation
        phone:
          type: string
          example: mobilePhone
        position:
          type: string
          example: jobTitle
        groupId:
          type: string
          example: id
        groupName:
          type: string
          example: displayName
      description: Azure Cloud Identity Provider mappings

    ClassicLdapMappings:
      required:
        - userObjectMapIdTo
        - userObjectMapUsernameTo
        - userObjectMapRealNameTo
        - userObjectMapEmailTo
        - userObjectMapDepartmentTo
        - userObjectMapBuildingTo
        - userObjectMapRoomTo
        - userObjectMapPhoneTo
        - userObjectMapPositionTo
        - userObjectMapUuidTo
        - userGroupObjectMapIdTo
        - userGroupObjectMapGroupNameTo
        - userGroupObjectMapUuidTo
      type: object
      properties:
        userObjectMapIdTo:
          type: string
          example: mail
        userObjectMapUsernameTo:
          type: string
          example: uid
        userObjectMapRealNameTo:
          type: string
          example: displayName
        userObjectMapEmailTo:
          type: string
          example: mail
        userObjectMapDepartmentTo:
          type: string
          example: departmentNumber
        userObjectMapBuildingTo:
          type: string
          default: ''
        userObjectMapRoomTo:
          type: string
          default: ''
        userObjectMapPhoneTo:
          type: string
          default: ''
        userObjectMapPositionTo:
          type: string
          example: title
        userObjectMapUuidTo:
          type: string
          example: uid
        userGroupObjectMapIdTo:
          type: string
          example: name
        userGroupObjectMapGroupNameTo:
          type: string
          example: name
        userGroupObjectMapUuidTo:
          type: string
          example: uid
      description: Classic Ldap mappings configuration

    CloudLdapConnectionStatus:
      type: object
      properties:
        status:
          type: string
          example: Successfully connected
      description: Status of tested Cloud Ldap connection