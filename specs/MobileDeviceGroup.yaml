components:
  schemas:
    MobileDeviceGroup:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: All Managed iPads
        description:
          type: string
          example: A group containing all managed iPads
        isSmartGroup:
          type: boolean
          example: true
    SmartGroup:
      type: object
      properties:
        groupId:
          type: string
          example: 1
        groupName:
          type: string
          example: Smart iPad Group
        groupDescription:
            type: string
            example: A smart group containing iPads meeting certain criteria
        siteId:
          type: string
          example: 11
        count:
          type: integer
          description: membership count
          example: 25
          minimum: 0
    SmartGroupDetail:
      allOf:
        - $ref: '#/components/schemas/SmartGroup'
        - type: object
          properties:
            criteria:
              type: array
              minLength: 0
              items:
                $ref: '#/components/schemas/SmartGroupCriteria'
              description: The criteria used to define the smart group
    StaticGroup:
      type: object
      properties:
        groupId:
          type: string
          example: 6
        groupName:
          type: string
          example: Static iPad Group
        groupDescription:
          type: string
          example: A static group containing only iPads
        siteId:
          type: string
          example: 11
        count:
          type: integer
          description: membership count
          example: 15
          minimum: 0
    StaticGroupAssignment:
      type: object
      required:
        - groupName
      properties:
        groupId:
          type: string
          readOnly: true
          minLength: 1
          example: 7
        groupName:
          type: string
          minLength: 1
          example: Static iPads
        groupDescription:
          type: string
          example: Static iPads
        siteId:
          type: string
          example: 11
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    SmartGroupAssignment:
      type: object
      required:
        - groupName
      properties:
        groupId:
          type: string
          readOnly: true
          minLength: 1
          example: 7
          description: The unique identifier of the smart group
        groupName:
          type: string
          minLength: 1
          example: Smart iPads Group
        groupDescription:
          type: string
          example: Smart iPads that meet certain criteria
        siteId:
          type: string
          example: 11
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/SmartGroupCriteria'
    SmartGroupCriteria:
      type: object
      required:
        - name
        - andOr
        - searchType
        - value
      properties:
        name:
          type: string
          example: Model
          description: The field to search on (e.g., Model, OS Version, etc.)
        searchType:
          type: string
          example: is
          description: The type of search to perform (e.g., is, is not, like, etc.)
        value:
          type: string
          example: iPad
          description: The value to search for
        andOr:
          type: string
          example: and
          description: Whether this criterion should be ANDed or ORed with the previous criterion
        openingParen:
          type: boolean
          example: false
          description: Whether to add an opening parenthesis before this criterion
        closingParen:
          type: boolean
          example: false
          description: Whether to add a closing parenthesis after this criterion
        priority:
          type: integer
          example: 0
          description: The priority order of this criterion
    Assignment:
      type: object
      properties:
        mobileDeviceId:
          type: string
          example: 5
        selected:
          type: boolean
          description: If true the device should be added to the group, if false should be removed from the group
          example: true
    StaticGroupSearchResults:
      type: object
      properties:
        totalCount:
          type: integer
          example: 3
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/StaticGroup'
    SmartGroupSearchResults:
      type: object
      properties:
        totalCount:
          type: integer
          example: 2
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/SmartGroup'
    InventoryListMobileDeviceSearchResults:
      type: object
      properties:
        totalCount:
          type: integer
          nullable: false
          example: 3
        results:
          type: array
          items:
            $ref: '#/components/schemas/InventoryListMobileDevice'
    InventoryListMobileDevice:
      type: object
      properties:
        mobileDeviceId:
          type: string
          minLength: 1
          example: 1
        udid:
          type: string
          example: 0dad565fb40b010a9e490440188063a378721069
        airPlayPassword:
          type: string
          example: "1234"
          format: password
