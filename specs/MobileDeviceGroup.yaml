openapi: 3.0.1
info:
  title: Jamf Pro API - mobile-device-groups
  version: 0.0.1
paths:
  /v1/mobile-device-groups:
    get:
      tags:
        - mobile-device-groups
      summary: |
        Return the list of all Mobile Device Groups
      description: |
        Returns the list of all mobile device groups.
      responses:
        200:
          description: Success
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MobileDeviceGroup'
      x-required-privileges:
        - Read Smart Mobile Device Groups
        - Read Static Mobile Device Groups
  /v1/mobile-device-groups/smart-groups:
    get:
      tags:
        - mobile-device-groups
      summary: |
        Get Smart Groups
      description: |
        Get Smart Groups
      parameters:
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page'
        - $ref: 'DefinitionsLibrary.yaml#/components/parameters/page-size'
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property:asc/desc. Default sort is id:asc.
                        Available criteria to sort on: groupId, groupName, siteId.'
          explode: true
          schema:
            type: array
            items:
              type: string
            default: [ groupId:asc ]
        - name: filter
          in: query
          description: 'Query in the RSQL format, allowing to filter smart group collection.
                            Default filter is empty query - returning all results for the requested page.
                            Fields allowed in the query: groupId, groupName, siteId.
                            The siteId field can only be filtered by admins with full access.
                            Any sited admin will have siteId filtered automatically.
                            This param can be combined with paging and sorting.
                            Example: groupName=="smartGroup1"'
          schema:
            type: string
            default: ''
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SmartGroupSearchResults'
      x-required-privileges:
        - Read Smart Mobile Device Groups
    post:
      tags:
        - mobile-device-groups
      description: |
        Create a smart group
      summary: |
        Create a smart group
      parameters:
        - name: platform
          in: query
          description: 'Optional. Return platform identifiers instead of internal identifiers when set to true.'
          schema:
            type: boolean
            default: false
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/SmartGroupAssignment'
        required: true
      responses:
        201:
          description: Smart mobile device group created successfully
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/HrefResponse'
        400:
          description: Could not save smart group
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Create Smart Mobile Device Groups
  /v1/mobile-device-groups/smart-groups/{id}:
    get:
      tags:
        - mobile-device-groups
      summary: |
        Get Smart Group by Id
      description: |
        Get Smart Group by Id
      parameters:
        - name: id
          in: path
          description: instance id of smart-group
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SmartGroupDetail'
        404:
          description: No smart group found with the given id.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Read Smart Mobile Device Groups
    put:
      tags:
        - mobile-device-groups
      description: |
        Update a smart group
      summary: |
        Update a smart group
      parameters:
        - name: id
          in: path
          description: instance id of a smart group
          required: true
          schema:
            type: string
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/SmartGroupAssignment'
        required: true
      responses:
        202:
          description: Successful response
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SmartGroupAssignment'
        404:
          description: No smart group found with the given id.
          content:
            'application/json':
              schema:
                $ref: 'DefinitionsLibrary.yaml#/components/schemas/ApiError'
      x-required-privileges:
        - Update Smart Mobile Device Groups
    delete:
      tags:
        - mobile-device-groups
      summary: |
        Remove Smart Group by Id
      description: |
        Remove Smart Group by Id
      parameters:
        - name: id
          in: path
          description: instance id of smart-group
          required: true
          schema:
            type: string
      responses:
        204:
          description: Smart Group successfully removed
      x-required-privileges:
        - Delete Smart Mobile Device Groups
