openapi: 3.0.1
info:
  title: Jamf Pro API - Installed Application List Command Definition
  description: This MDM commands exist to be re-used by multiple other Swagger files.
  version: 0.0.1
paths: {}
components:
  schemas:
    InstalledApplicationListCommand:
      allOf:
        - $ref: 'MdmDefinitionsLibrary.yaml#/components/schemas/MdmCommandBase'
        - type: object
          properties:
            identifiers:
              type: array
              nullable: true
              items:
                type: string
                nullable: false
                minLength: 1
              description: Array of application bundle identifiers to query. If not provided, all installed applications are returned.
              example: ["com.example.app1", "com.example.app2"]
            managedAppsOnly:
              type: boolean
              nullable: true
              description: If true, only managed applications are returned. If false or not provided, all applications are returned.
              example: false
            items:
              type: array
              nullable: true
              items:
                type: string
                enum:
                  - AdHocCodeSigned
                  - AppStoreVendable
                  - BetaApp
                  - BundleSize
                  - DeviceBasedVpp
                  - DistributorIdentifier
                  - DynamicSize
                  - ExternalVersionIdentifier
                  - HasUpdateAvailable
                  - Identifier
                  - Installing
                  - AppClip
                  - Validated
                  - Name
                  - ShortVersion
                  - Version
              description: Array of keys to include in the response for each application. If not provided, default keys are returned.
              example: ["Identifier", "Version", "Name", "BundleSize"]