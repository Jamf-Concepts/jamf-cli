components:
  schemas:
    ActiveUserSession:
      properties:
        creationTime:
          description: Timestamp of when the session was created
          example: "2024-12-22T09:00:00Z"
          format: date-time
          type: string
        ipAddress:
          description: IP address associated with the session
          example: 192.168.1.100
          nullable: true
          type: string
        lastAccessedTime:
          description: Timestamp of when the session was last accessed
          example: "2024-12-22T10:30:00Z"
          format: date-time
          type: string
        sessionId:
          description: Unique session identifier
          example: 4F3B2E1A-8C9D-4E5F-A6B7-C8D9E0F1A2B3
          type: string
        userAgent:
          description: User agent string from the session
          example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)
          nullable: true
          type: string
        username:
          description: Username of the logged in user
          example: john.smith
          type: string
      type: object
    ActiveUsersCount:
      properties:
        activeUserCount:
          description: Number of currently logged in users
          example: 5
          format: int32
          minimum: 0
          type: integer
      type: object
info:
  title: Jamf Pro API - UserSession
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/user-sessions/active:
    get:
      description: |
        Returns detailed information about currently logged in users.
      responses:
        200:
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActiveUserSession'
                type: array
          description: Active user sessions retrieved successfully.
        403:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Forbidden
      summary: |
        Get active user sessions.
      tags:
        - user-sessions
      x-authentication-required: true
      x-required-privileges:
        - Read User
  /v1/user-sessions/count:
    get:
      description: |
        Returns the number of currently logged in users.
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveUsersCount'
          description: Count of active user sessions retrieved successfully.
        403:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Forbidden
      summary: |
        Get count of active user sessions.
      tags:
        - user-sessions
      x-authentication-required: true
      x-required-privileges:
        - Read User
servers:
  - url: /api
