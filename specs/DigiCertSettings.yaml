components:
  schemas:
    Certificate:
      properties:
        data:
          description: Must be base-64 encoded data obtainable by `openssl base64 < /file/path/filename.p12 | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods.
          example: 
          items:
            format: byte
            type: string
          type: array
        filename:
          description: Client certificate filename should extend .p12.
          example: example.p12
          maxLength: 255
          minLength: 1
          type: string
        password:
          example: password-example
          format: password
          maxLength: 255
          minLength: 1
          nullable: true
          type: string
          writeOnly: true
      required:
        - data
        - filename
      type: object
    CertificateResponse:
      properties:
        expirationDate:
          example: "2018-10-15T16:39:56Z"
          format: date-time
          readOnly: true
          type: string
        filename:
          description: Client certificate filename with .p12 extension.
          example: example.p12
          maxLength: 255
          readOnly: true
          type: string
        issuer:
          example: IssuerName
          readOnly: true
          type: string
        serialNumber:
          example: "123456789456123"
          readOnly: true
          type: string
        subject:
          example: CN=SubjectName, OU=OrganizationalUnit, O=Organization, L=Location, ST=State, C=Country
          readOnly: true
          type: string
      type: object
    DigiCertSetting:
      description: DigiCert Trust Lifecycle Manager object to create, or update with a merge-patch strategy. Certificate data must be provided in full, or not at all for update with merge-patch strategy.
      properties:
        caName:
          example: Example Display Name
          maxLength: 255
          minLength: 1
          type: string
        clientCert:
          $ref: '#/components/schemas/Certificate'
        fqdn:
          example: digicert.example.com
          maxLength: 255
          minLength: 1
          type: string
        revocationEnabled:
          example: true
          type: boolean
      type: object
    DigiCertSettingResponse:
      description: DigiCert Trust Lifecycle Manager response object.
      properties:
        caName:
          example: Example Display Name
          maxLength: 255
          minLength: 1
          type: string
        clientCert:
          $ref: '#/components/schemas/CertificateResponse'
        fqdn:
          example: digicert.example.com
          maxLength: 255
          minLength: 1
          type: string
        id:
          example: "1"
          readOnly: true
          type: string
        revocationEnabled:
          example: true
          type: boolean
      type: object
    DigicertConnectionStatus:
      properties:
        status:
          example: Successfully connected
          maxLength: 255
          minLength: 1
          readOnly: true
          type: string
      type: object
    DigicertDependencies:
      properties:
        results:
          items:
            $ref: '#/components/schemas/DigicertDependency'
          type: array
        totalCount:
          example: 1
          nullable: false
          type: integer
      type: object
    DigicertDependency:
      properties:
        configProfileId:
          example: 1
          nullable: false
          type: integer
        configProfileName:
          example: name
          type: string
        configProfileType:
          enum:
            - OSX_CONFIGURATION_PROFILE
            - IOS_CONFIGURATION_PROFILE
          example: OSX_CONFIGURATION_PROFILE
          nullable: false
          readOnly: true
          type: string
      type: object
info:
  title: Jamf Pro API - DigiCertSettings
  version: 0.0.1
openapi: 3.0.1
paths:
  /v1/pki/digicert/trust-lifecycle-manager:
    post:
      description: Create DigiCert Trust Lifecycle Manager configuration and initialize renewal monitor.
      requestBody:
        content:
          application/json:
            examples:
              sample1:
                value:
                  caName: Example Display Name - 1
                  clientCert:
                    data: 
                    filename: client-cert.p12
                    password: password-example
                  fqdn: digicert.example.com
                  revocationEnabled: true
            schema:
              $ref: '#/components/schemas/DigiCertSetting'
        required: true
      responses:
        201:
          content:
            '*/*':
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/HrefResponse
          description: Created
      summary: |
        Create DigiCert Trust Lifecycle Manager configuration with client authentication via client certificate.
      tags:
        - digicert
      x-required-privileges:
        - Create DigiCert Settings
  /v1/pki/digicert/trust-lifecycle-manager/validate-client-certificate:
    post:
      description: Validate DigiCert Trust Lifecycle Manager client certificate for file format and correct password. Must be base64-encoded PKCS#12 file content, obtainable by `openssl base64 < /file/path/filename.p12 | tr -d '\n' | pbcopy` in linux terminal, or similar parsing methods.
      requestBody:
        content:
          application/json:
            examples:
              sample1:
                value:
                  data: 
                  filename: client-cert.p12
                  password: password-example
              sample2:
                value:
                  data: 
                  filename: client-cert.p12
                  password: password-example
            schema:
              $ref: '#/components/schemas/Certificate'
      responses:
        204:
          description: DigiCert Trust Lifecycle Manager certificate for client server is of valid file format and has correct password.
      summary: |
        Validate DigiCert Trust Lifecycle Manager client certificate
      tags:
        - digicert
      x-action: true
      x-required-privileges:
        - Create DigiCert Settings
        - Update DigiCert Settings
  /v1/pki/digicert/trust-lifecycle-manager/{id}:
    delete:
      description: |
        Delete the current configuration of the DigiCert Trust Lifecycle
        Manager.
      parameters:
        - description: ID of the DigiCert Trust Lifecycle Manager configuration
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        204:
          description: |
            Successful deletion of the DigiCert Trust Lifecycle Manager
            configuration
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Not Found
        409:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Conflict
      summary: Delete DigiCert Trust Lifecycle Manager configuration
      tags:
        - digicert
      x-required-privileges:
        - Delete DigiCert Settings
    get:
      description: |
        Retrieve the current configuration of the DigiCert Trust Lifecycle
        Manager.
      parameters:
        - description: ID of the DigiCert Trust Lifecycle Manager configuration
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigiCertSettingResponse'
          description: |
            Successful response returns a DigiCert Trust Lifecycle Manager
            configuration
        404:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: DigiCert Trust Lifecycle Manager configuration not found
      summary: Retrieve DigiCert Trust Lifecycle Manager configuration
      tags:
        - digicert
      x-required-privileges:
        - Read DigiCert Settings
    patch:
      description: Update DigiCert Trust Lifecycle Manager configuration, where the client certificate information must be provided in full or not at all.
      parameters:
        - description: ID of the DigiCert Trust Lifecycle Manager configuration.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/DigiCertSetting'
        required: true
      responses:
        204:
          description: No Content
        400:
          content:
            application/json:
              schema:
                $ref: _MonolithLibrary.yaml#/components/schemas/ApiError
          description: Bad Request
      summary: |
        Update DigiCert Trust Lifecycle Manager configuration
      tags:
        - digicert
      x-required-privileges:
        - Update DigiCert Settings
  /v1/pki/digicert/trust-lifecycle-manager/{id}/connection-status:
    get:
      description: Get connection status of DigiCert Trust Lifecycle Manager for a given ID.
      parameters:
        - description: ID of the DigiCert Trust Lifecycle Manager settings.
          explode: false
          in: path
          name: id
          required: true
          schema:
            example: "12"
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigicertConnectionStatus'
          description: Successful connection to DigiCert Trust Lifecycle Manager.
        404:
          description: DigiCert Trust Lifecycle Manager settings not found.
      summary: Get connection status of DigiCert Trust Lifecycle Manager for a given ID
      tags:
        - digicert
      x-required-privileges:
        - Read DigiCert Settings
  /v1/pki/digicert/trust-lifecycle-manager/{id}/dependencies:
    get:
      description: Retrieve list of DigiCert Trust Lifecycle Manager Settings dependencies.
      parameters:
        - description: ID of the DigiCert Trust Lifecycle Manager configuration.
          explode: false
          in: path
          name: id
          required: true
          schema:
            type: string
          style: simple
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigicertDependencies'
          description: Success
      summary: Retrieve list of DigiCert Trust Lifecycle Manager Settings dependencies
      tags:
        - digicert
      x-required-privileges:
        - Read DigiCert Settings
servers:
  - url: /api
