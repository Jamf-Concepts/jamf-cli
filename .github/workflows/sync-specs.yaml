name: Sync Specs

on:
  workflow_dispatch:
    inputs:
      jamf_pro_version:
        description: "Jamf Pro version (e.g., 11.25.2)"
        required: true
        type: string
      server_repo_ref:
        description: "Git ref in jamf/jss (tag, branch, or SHA)"
        required: true
        type: string
      dry_run:
        description: "Dry run (show diff only, do not create PR)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      JAMF_PRO_VERSION: ${{ inputs.jamf_pro_version }}
      SERVER_REPO_REF: ${{ inputs.server_repo_ref }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # Validate before any checkout, so a bad value costs nothing. The version
      # reaches a shell twice: once here, and once when make substitutes it into
      # a recipe. The Makefile guards its own use, but this step fails the run
      # early and gives the operator a clear message.
      - name: Validate jamf_pro_version
        run: |
          if ! printf '%s' "$JAMF_PRO_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::jamf_pro_version must be three dot-separated numbers, for example 11.31.0"
            exit 1
          fi

      - name: Checkout jamf-cli
        uses: actions/checkout@v7

      - name: Checkout jss
        uses: actions/checkout@v7
        with:
          repository: jamf/jss
          ref: ${{ inputs.server_repo_ref }}
          token: ${{ secrets.SERVER_REPO_TOKEN }}
          path: jss
          sparse-checkout: |
            **/swagger_docs/uapi
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Call the same target a maintainer runs locally rather than
      # re-implementing the copy steps here — the target also drops the legacy
      # MobileDeviceExtensionAttribute preview spec, renames
      # DeviceExtensionAttribute.yaml into its place, and hard-fails on
      # duplicate basenames. JAMF_SERVER_ROOT points at the checkout above,
      # which is the spec tree itself rather than its parent.
      - name: Sync specs and regenerate
        run: |
          make sync-specs JAMF_SERVER_ROOT=jss JAMF_PRO_VERSION="$JAMF_PRO_VERSION"
          go fmt ./internal/commands/pro/generated/...

      - name: Run tests
        run: make test

      - name: Generate diff summary
        id: diff
        run: |
          ADDED=$(git diff --name-only --diff-filter=A -- specs/ internal/commands/pro/generated/)
          MODIFIED=$(git diff --name-only --diff-filter=M -- specs/ internal/commands/pro/generated/)
          DELETED=$(git diff --name-only --diff-filter=D -- specs/ internal/commands/pro/generated/)

          NEW_SPECS=$(echo "$ADDED" | grep '^specs/' | grep -c '\.yaml$' || true)
          MOD_SPECS=$(echo "$MODIFIED" | grep '^specs/' | grep -c '\.yaml$' || true)
          DEL_SPECS=$(echo "$DELETED" | grep '^specs/' | grep -c '\.yaml$' || true)
          NEW_CMDS=$(echo "$ADDED" | grep '^internal/commands/pro/generated/' | grep -c '\.go$' || true)
          MOD_CMDS=$(echo "$MODIFIED" | grep '^internal/commands/pro/generated/' | grep -c '\.go$' || true)
          DEL_CMDS=$(echo "$DELETED" | grep '^internal/commands/pro/generated/' | grep -c '\.go$' || true)

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "summary<<$EOF"
            echo "## Spec Sync Summary — Jamf Pro v${JAMF_PRO_VERSION}"
            echo ""
            echo "**Source:** \`jamf/jss@${SERVER_REPO_REF}\`"
            echo ""
            echo "### Specs"
            echo "- Added: ${NEW_SPECS}"
            echo "- Modified: ${MOD_SPECS}"
            echo "- Removed: ${DEL_SPECS}"
            echo ""
            echo "### Generated Commands"
            echo "- Added: ${NEW_CMDS}"
            echo "- Modified: ${MOD_CMDS}"
            echo "- Removed: ${DEL_CMDS}"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dry run — print diff and stop
        if: inputs.dry_run
        run: |
          echo "$DIFF_SUMMARY"
          echo ""
          git diff --stat
          echo ""
          echo "Dry run complete. No PR created."
        env:
          DIFF_SUMMARY: ${{ steps.diff.outputs.summary }}

      - name: Create pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/jamf-pro-v${{ inputs.jamf_pro_version }}
          commit-message: "feat: sync specs with Jamf Pro v${{ inputs.jamf_pro_version }}"
          title: "feat: sync specs with Jamf Pro v${{ inputs.jamf_pro_version }}"
          body: ${{ steps.diff.outputs.summary }}
          labels: specs,automated
