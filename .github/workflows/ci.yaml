name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Test
        run: make test

      - name: Verify generated code is up-to-date
        run: make verify-generated

      - name: Build
        run: make build

      - name: Verify site generator compiles
        run: go build ./generator/site/...

      - name: Verify site supports all products
        run: ./scripts/verify-site-products.sh
