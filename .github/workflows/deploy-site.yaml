name: Deploy Site

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout latest release tag for binary build
        if: github.event_name != 'release'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          git checkout "$LATEST_TAG"
          # Build the CLI from the latest release tag (so deployed catalog
          # reflects the released CLI), but pull these from main so site-only
          # changes ship without waiting for a release:
          #   docs/site/             — site UI, llms.txt seed, robots/sitemap
          #   generator/site/        — generator must know about flags this
          #                            workflow invokes (e.g. --llms-output)
          #   internal/commands/groups.go — group taxonomy used when rendering
          #                            commands.json. Pure data + apply-funcs;
          #                            safe to override on top of older binary
          #                            code. Entries for commands that don't
          #                            exist in the tag silently no-op.
          git checkout ${{ github.sha }} -- \
            docs/site \
            generator/site \
            internal/commands/groups.go

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: make build

      - name: Download previous commands.json
        run: |
          curl -sSfL "${{ steps.deployment.outputs.page_url || 'https://jamf-concepts.github.io/jamf-cli/' }}commands.json" \
            -o /tmp/previous-commands.json 2>/dev/null || echo "No previous commands.json (first deploy)"

      - name: Generate site artifacts (commands.json, llms.txt, llms-full.txt)
        run: |
          PREV_FLAG=""
          if [ -f /tmp/previous-commands.json ]; then
            PREV_FLAG="--previous /tmp/previous-commands.json"
          fi
          go run ./generator/site/main.go \
            --binary ./bin/jamf-cli \
            --output ./docs/site/commands.json \
            --llms-output ./docs/site/llms.txt \
            --llms-full-output ./docs/site/llms-full.txt \
            $PREV_FLAG

      - name: Stamp build freshness (date + version) into SEO assets
        # index.html (JSON-LD dateModified/softwareVersion) and sitemap.xml
        # (<lastmod>) carry __BUILD_DATE__/__VERSION__ placeholders in the repo.
        # Substitute them here, in the throwaway runner checkout, so deployed
        # structured data signals freshness without committing volatile values.
        # Version comes from commands.json, which the generator just wrote using
        # the same cleaning logic as the on-page version badge (single source).
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          VERSION="$(python3 -c "import json; print(json.load(open('docs/site/commands.json'))['version'])")"
          COUNT="$(python3 -c "import json; print(format(json.load(open('docs/site/commands.json'))['commandCount'], ','))")"
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g; s/__VERSION__/${VERSION}/g; s/__COMMAND_COUNT__/${COUNT}/g" \
            docs/site/index.html docs/site/sitemap.xml
          if grep -REn '__BUILD_DATE__|__VERSION__|__COMMAND_COUNT__' docs/site/index.html docs/site/sitemap.xml; then
            echo "::error::Unsubstituted SEO placeholder(s) remain after stamping." >&2
            exit 1
          fi
          echo "Stamped freshness: version=${VERSION} date=${BUILD_DATE} commands=${COUNT}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test deployed site
        # Post-deploy assertion that everything we promised got served.
        # Catches regressions like a broken upload step, missing assets,
        # or a Pages config that swallowed our llms.txt / sitemap.xml.
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          URL="${URL%/}"
          fail=0
          for path in "" /commands.json /llms.txt /llms-full.txt /robots.txt /sitemap.xml; do
            target="${URL}${path}"
            if curl -fsSLI --retry 3 --retry-delay 2 -o /dev/null "$target"; then
              echo "  OK   $target"
            else
              echo "  FAIL $target"
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "One or more deployed artifacts returned non-2xx."
            exit 1
          fi
          echo "All deployed artifacts return 200."
