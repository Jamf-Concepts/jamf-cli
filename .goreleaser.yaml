version: 2

project_name: jamfpro-cli

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - mkdir -p dist/completions
    - sh -c "go run ./cmd/jamfpro-cli completion bash > dist/completions/jamfpro-cli.bash"
    - sh -c "go run ./cmd/jamfpro-cli completion zsh > dist/completions/_jamfpro-cli"
    - sh -c "go run ./cmd/jamfpro-cli completion fish > dist/completions/jamfpro-cli.fish"
    - sh -c "go run ./cmd/jamfpro-cli completion powershell > dist/completions/jamfpro-cli.ps1"

builds:
  - id: jamfpro-cli
    main: ./cmd/jamfpro-cli
    binary: jamfpro-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - dist/completions/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

brews:
  - name: jamfpro-cli
    repository:
      owner: ktn-jamf
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ktn-jamf/jamfpro-cli"
    description: "CLI tool for Jamf Pro Server API automation"
    license: "MIT"
    skip_upload: auto
    test: |
      system "#{bin}/jamfpro-cli", "version"
    install: |
      bin.install "jamfpro-cli"
      bash_completion.install "dist/completions/jamfpro-cli.bash" => "jamfpro-cli"
      zsh_completion.install "dist/completions/_jamfpro-cli"
      fish_completion.install "dist/completions/jamfpro-cli.fish"

nfpms:
  - id: packages
    package_name: jamfpro-cli
    vendor: ktn-jamf
    homepage: "https://github.com/ktn-jamf/jamfpro-cli"
    maintainer: "ktn-jamf"
    description: "CLI tool for Jamf Pro Server API automation"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
