version: 2

project_name: jamf-cli

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - mkdir -p completions
    - sh -c "go run ./cmd/jamf-cli completion bash > completions/jamf-cli.bash"
    - sh -c "go run ./cmd/jamf-cli completion zsh > completions/_jamf-cli"
    - sh -c "go run ./cmd/jamf-cli completion fish > completions/jamf-cli.fish"
    - sh -c "go run ./cmd/jamf-cli completion powershell > completions/jamf-cli.ps1"

builds:
  - id: jamf-cli
    main: ./cmd/jamf-cli
    binary: jamf-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - completions/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

brews:
  - name: jamf-cli
    repository:
      owner: Jamf-Concepts
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Jamf-Concepts/jamf-cli"
    description: "CLI for the Jamf platform"
    license: "MIT"
    skip_upload: auto
    test: |
      system "#{bin}/jamf-cli", "version"
    install: |
      bin.install "jamf-cli"
      bash_completion.install "completions/jamf-cli.bash" => "jamf-cli"
      zsh_completion.install "completions/_jamf-cli"
      fish_completion.install "completions/jamf-cli.fish"

nfpms:
  - id: packages
    package_name: jamf-cli
    vendor: jamf
    homepage: "https://github.com/Jamf-Concepts/jamf-cli"
    maintainer: "jamf"
    description: "CLI for the Jamf platform"
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
